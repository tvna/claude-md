# Document dependency graph for governance enforcement.
#
# Nodes are documents, scripts, and compiled artifacts. Edges are typed,
# directed relationships. When a PR changes a node, the gate
# `scripts/gate_doc_graph_pr.py` queries this graph and requires that all
# blocking-severity dependent nodes are also changed in the same PR (or
# carry an explicit `doc-graph-waiver: NODE_ID -- reason` line in the PR
# body).
#
# Edge types:
#   governs      -- upstream principles define/constrain downstream; blocking.
#   compiled_to  -- upstream compiles deterministically into downstream; blocking.
#   derives_from -- downstream design was derived from upstream; blocking.
#   enforced_by  -- downstream script enforces upstream rule; advisory.
#   implements   -- downstream is the concrete implementation of upstream; advisory.
#   references   -- upstream cites downstream; advisory.
#
# Severity: blocking = co-change required; advisory = informational note only.
#
# Maintained by: docs/prd/doc-dependency-graph.md
# CODEOWNERS-protected: .github/CODEOWNERS (docs/graph/ @tvna)
# Refs #1754.

[meta]
schema_version = 1
description = "Typed document dependency graph for PR governance enforcement."

