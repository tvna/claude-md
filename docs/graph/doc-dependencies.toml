# gate_doc_graph_pr implements doc_graph_lib (dependency direction).
[[edges]]
from = "gate_doc_graph_pr"
to = "doc_graph_lib"
type = "references"
severity = "advisory"
note = "gate_doc_graph_pr imports doc_graph_lib; gate changes may require lib review."

# The versioning scheme classifies changes to the universal text; it cites
# the master structure (P1-P6, defined terms) but must not co-change on every
# universal-text edit, so the edge is advisory.
[[edges]]
from = "semver_universal_text_prd"
to = "master_instructions"
type = "references"
severity = "advisory"
note = "Classification rules (R1) reference the universal-text structure; informational only."
