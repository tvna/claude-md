# ---------------------------------------------------------------------------
# Edges
# ---------------------------------------------------------------------------

# master.instructions.md compiles to CLAUDE.md and AGENTS.md (already gated
# by verify-pr.yml / apm compile; included here for graph completeness).
[[edges]]
from = "master_instructions"
to = "claude_md"
type = "compiled_to"
severity = "blocking"
note = "Already enforced by verify-pr.yml apm-drift gate; included for completeness."

[[edges]]
from = "master_instructions"
to = "agents_md"
type = "compiled_to"
severity = "blocking"
note = "Already enforced by verify-pr.yml apm-drift gate; included for completeness."

# master.instructions.md governs every document that records, implements, or
# explains the six principles. A change to the principles must trigger a
# review of each governed document.
[[edges]]
from = "master_instructions"
to = "design_philosophy_prd"
type = "governs"
severity = "blocking"
note = "Principle edits must be reviewed against the responsibility matrix (sec 3)."

[[edges]]
from = "master_instructions"
to = "non_ascii_prd"
type = "governs"
severity = "blocking"
note = "P3 bullet on ASCII discipline is rationale-grounded in non_ascii_prd."

[[edges]]
from = "master_instructions"
to = "security_control_inventory"
type = "governs"
severity = "blocking"
note = "P3/P4 safety principles define the security control surface."

[[edges]]
from = "master_instructions"
to = "issue_pr_body_standard"
type = "governs"
severity = "blocking"
note = "P2 Facts/Assumptions discipline is adopted in issue_pr_body_standard."

[[edges]]
from = "master_instructions"
to = "workflow_script_quality"
type = "governs"
severity = "blocking"
note = "P4 safety boundary sets the must-have quality gates M1-M9."

[[edges]]
from = "master_instructions"
to = "doc_dependency_prd"
type = "governs"
severity = "blocking"
note = "P3 deterministic-gate requirement motivates this graph system."

# Advisory edges: policy documents informing their enforcing scripts.
# When the policy changes, the enforcing script should be reviewed, but
# the enforcing script changing does not require the policy to change.
[[edges]]
from = "master_instructions"
to = "ubiquitous_language"
type = "governs"
severity = "blocking"
note = "Terms used in master principles must be defined in ubiquitous-language.md."

[[edges]]
from = "design_philosophy_prd"
to = "ubiquitous_language"
type = "derives_from"
severity = "blocking"
note = "section 2.5 now points to ubiquitous_language as SSoT; co-change required when either changes."

[[edges]]
from = "ubiquitous_language"
to = "scan_design_philosophy_drift"
type = "enforced_by"
severity = "advisory"
note = "scan_design_philosophy_drift verifies REQUIRED_GLOSSARY_ENTRIES are present in ubiquitous-language.md."

[[edges]]
from = "design_philosophy_prd"
to = "scan_design_philosophy_drift"
type = "enforced_by"
severity = "advisory"
note = "scan_design_philosophy_drift enforces the matrix-subtitle invariant."

[[edges]]
from = "non_ascii_prd"
to = "preflight_non_ascii"
type = "enforced_by"
severity = "advisory"
note = "preflight_non_ascii is Layer 3 of the non-ASCII defense."

[[edges]]
from = "non_ascii_prd"
to = "scan_non_ascii"
type = "enforced_by"
severity = "advisory"
note = "scan_non_ascii is Layer 2 (server-side) of the non-ASCII defense."

[[edges]]
from = "issue_pr_body_standard"
to = "body_policy"
