# doc_dependency_prd governs the gate implementation and workflow.
[[edges]]
from = "doc_dependency_prd"
to = "gate_doc_graph_pr"
type = "enforced_by"
severity = "advisory"
note = "gate_doc_graph_pr is the deterministic enforcement of the graph policy."

[[edges]]
from = "doc_dependency_prd"
to = "validate_doc_graph_workflow"
