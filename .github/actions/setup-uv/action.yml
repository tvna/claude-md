# Security invariant: this composite action runs INLINE in the calling job, so
# it inherits that job's `permissions:`, env, and secrets. It is used by jobs
# spanning contents:read up to contents:write / pull-requests:write /
# id-token:write, so it effectively runs under the UNION of caller permissions.
# To keep that safe it MUST stay permission-agnostic: it uses NO GITHUB_TOKEN
# and NO secrets (only a public uv download + checksum verify + uv sync). Do not
# add a step here that reads the token or a secret -- if shared steps ever need
# their own least-privilege token/secret scope, use a reusable workflow
# (workflow_call, own `permissions:`) instead of this composite action.
name: Setup uv
description: Install the pinned uv (checksum-verified against flake.nix), provision Python, and sync the locked project environment.

runs:
  using: composite
  steps:
    - name: Read uv pin from pyproject.toml
      id: uvpin
      shell: bash
      run: |
        set -euo pipefail
        PIN="$(python3 scripts/uv_pin.py read)"
        echo "version=${PIN}" >> "$GITHUB_OUTPUT"

    - name: Install uv (verified against flake.nix pin)
      shell: bash
      env:
        UV_VERSION: ${{ steps.uvpin.outputs.version }}
      run: |
        set -euo pipefail
        # Fetch from the same URL the flake pins (releases.astral.sh) so the
        # flake.nix SHA256 is the authoritative checksum for this exact tarball.
        curl -LsSf "https://releases.astral.sh/github/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/uv.tar.gz
        python3 scripts/uv_download_checksum.py verify \
          --file /tmp/uv.tar.gz \
          --target x86_64-unknown-linux-gnu
        tar -xzf /tmp/uv.tar.gz -C /tmp
        mkdir -p "$HOME/.local/bin"
        install -m 0755 /tmp/uv-x86_64-unknown-linux-gnu/uv "$HOME/.local/bin/uv"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        uv --version

    - name: Install Python
      shell: bash
      run: uv python install

    - name: Sync locked project environment
      shell: bash
      run: uv sync --locked
