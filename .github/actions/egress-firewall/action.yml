# Security invariant: like .github/actions/setup-uv, this composite action runs
# INLINE in the calling job and inherits that job's permissions, env, and
# secrets. It MUST stay permission-agnostic: it reads NO GITHUB_TOKEN and NO
# secrets. It only applies the repository's own egress allowlist
# (.devcontainer/network/*.allowlist) via the same
# .devcontainer/scripts/apply-egress-allowlist.sh dispatcher used at devcontainer
# start, which sources .devcontainer/scripts/_egress-lib.sh -- so the bash
# read_allowlist parser stays the single source of truth across the container
# start path and CI. Do not add a step that reads the token or a secret; if a
# shared step ever needs its own scope, use a reusable workflow (workflow_call,
# own permissions:) instead of this composite action.
#
# Honest limitation: this is detection plus best-effort blocking, not a sandbox.
# A runner with sudo can revert the rules (iptables -P OUTPUT ACCEPT), the same
# CVE-2025-32955 class of in-host bypass. On hosted runners audit mode keeps the
# OUTPUT policy at ACCEPT, so it records non-allowlisted egress without dropping.
name: Egress firewall
description: Apply the repository egress allowlist (block or audit mode) on the runner, reusing the devcontainer _egress-lib.sh single source of truth.

inputs:
  mode:
    description: "block (deny-by-default) or audit (log-only discovery). Defaults to the non-breaking audit posture."
    required: false
    default: audit
  allowlist:
    description: "Path to the .devcontainer/network/*.allowlist file to enforce."
    required: false
    default: .devcontainer/network/shared.allowlist

runs:
  using: composite
  steps:
    - name: Apply egress allowlist (${{ inputs.mode }} mode)
      shell: bash
      env:
        EGRESS_MODE: ${{ inputs.mode }}
        EGRESS_ALLOWLIST: ${{ inputs.allowlist }}
      run: |
        set -euo pipefail
        case "$EGRESS_MODE" in
          block | audit) ;;
          *)
            echo "::error::invalid mode: $EGRESS_MODE (expected 'block' or 'audit')"
            exit 64
            ;;
        esac
        if [[ ! -f "$EGRESS_ALLOWLIST" ]]; then
          echo "::error::allowlist file not found: $EGRESS_ALLOWLIST"
          exit 66
        fi
        # Reuse the devcontainer dispatcher (which sources _egress-lib.sh) so the
        # CI surface and the container start path share one implementation and
        # stay covered by scan_allowlist_parser_parity.py. It needs root to
        # mutate iptables; --preserve-env carries EGRESS_MODE across sudo.
        sudo --preserve-env=EGRESS_MODE \
          bash .devcontainer/scripts/apply-egress-allowlist.sh "$EGRESS_ALLOWLIST"
