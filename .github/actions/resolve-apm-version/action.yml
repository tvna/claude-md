# Security invariant: like .github/actions/setup-uv and egress-firewall, this
# composite action runs INLINE in the calling job and inherits that job's
# permissions, env, and secrets. It MUST stay permission-agnostic: it reads NO
# GITHUB_TOKEN and NO secrets, and touches the network not at all -- it only
# reads flake.nix, already present in the checked-out working tree, via
# scripts/flake_pin.py. Do not add a step that reads the token or a secret; if
# a shared step ever needs its own scope, use a reusable workflow
# (workflow_call, own permissions:) instead of this composite action.
#
# flake.nix is the single source of truth for the apm-cli version (mirrors the
# scripts/flake_pin.py resolve contract already used by scripts/install-apm.sh
# for the native-binary install path). A workflow that hardcoded its own
# APM_CLI_VERSION copy would silently diverge the next time the scheduled
# flake-pin-refresh job bumps flake.nix's apmVersion. Refs #2218.
name: Resolve apm-cli version
description: Read the apm-cli version pinned in flake.nix and export it as APM_CLI_VERSION for the rest of the job.

runs:
  using: composite
  steps:
    - name: Read apm pin from flake.nix
      shell: bash
      run: |
        set -euo pipefail
        echo "APM_CLI_VERSION=$(python3 scripts/flake_pin.py version --tool apm)" >> "$GITHUB_ENV"
