# Exact-match login allowlists for harness gates.
# Extend deliberately, one entry at a time.
# Refs #137, #480, #504, #620.

[general]
# Shared across issue-link, body-policy, and non-ASCII scanner (advisory demotion).
# tvna-bot[bot]: the GitHub App bot that authors generated bot PRs via
# createCommitOnBranch (#1437, #1539). Its fixed generated bodies are exempt
# from the human-PR body-shape contract, same carve-out as dependabot[bot]. #1553
logins = ["dependabot[bot]", "tvna-bot[bot]"]

[non_ascii_skip]
# Bots fully exempt from non-ASCII scan (action = "none": no label, no comment).
# Their generated content may include emoji or other non-ASCII that is not a
# security concern.
# codecov: #480, #504, #620 -- GitHub has delivered as both "codecov" and "codecov[bot]"
# devin: Cognition AI Devin integration (devin-ai-integration[bot] canonical form)
# chatgpt-codex-connector: #1731 -- OpenAI Codex review bot; posts generated review
#   comments with emoji. GitHub delivers App logins in two forms (webhook/REST appends
#   the "[bot]" suffix, GraphQL returns the bare slug), so both are listed, mirroring
#   the codecov dual-form carve-out.
logins = [
    "codecov",
    "codecov[bot]",
    "devin-ai-integration[bot]",
    "devin[bot]",
    "chatgpt-codex-connector",
    "chatgpt-codex-connector[bot]",
]

[review_in_progress_marker]
# Bots whose "eyes" reaction on a PR marks an automated review as still in
# progress (scan_review_in_progress_marker.py, #2312). Confirmed live on PR
# #2319: chatgpt-codex-connector[bot] added an "eyes" reaction 6s after PR
# creation, then removed it and added "+1" once its review completed 2m6s
# later (no suggestions case; a review comment starting "### Codex Review"
# with a leading lightbulb emoji is the completed-with-suggestions case).
# Same dual-login-form rationale as non_ascii_skip above.
logins = ["chatgpt-codex-connector", "chatgpt-codex-connector[bot]"]
