schema_version = 2
status = "adopted-design"
tracking_issue = 970
migration_issue = 972
live_catalog = ".github/labels.json"
apply_workflow = ".github/workflows/apply-labels.yml"

[rollout]
phase = "renames-batch"
note = "Renames batch (#2139, parent #972) flips labels.json to the final names for the five rename entries and migrates their consumers. labels_apply.py renames live labels in place via the rename_from map below so associations are preserved (no delete+recreate). The status=rename + rename_from entries stay until the operator runs apply-labels.yml; a follow-up then flips them to keep and drops rename_from. Retirements and area additions remain out of scope until later #972 batches."
pr_requires_scoped_issue = true
area_addition_exception = "area:ci-ops, area:governance, and area:security-intel are added to labels.json ahead of the general #972 area batch this note otherwise defers. This is a scoped exception: the owner decided the layer:meta successor mapping at #1041 comment 4882932274 and issue #2313 names these three labels as its prerequisite. No other area:* entry is affected by this exception; the remaining #972 area batch stays out of scope per the note above."
retirement_exception = "layer:meta is retired from labels.json ahead of the general #972 retirements batch this note otherwise defers. This is a scoped exception mirroring area_addition_exception: the owner approved the early retirement at #2393 as the terminal step of the #2313 successor migration, after every open issue carrying layer:meta was backfilled with its layer:p3-harness successor so no open issue depends on layer:meta for discovery. Only layer:meta is affected; the remaining #972 retirements (agent:*, bug, question, enhancement, fix, governance) stay out of scope per the note above and remain in [[retired_labels]] as design-level records until their own batch."

[[families]]
name = "layer"
purpose = "CLAUDE.md principle responsibility."
cardinality = "one_or_more"

[[families]]
name = "type"
purpose = "Issue purpose or structural kind."
cardinality = "exactly_one_for_normal_issues"

[[families]]
name = "state"
purpose = "Issue lifecycle and actionability."
cardinality = "zero_or_one"

[[families]]
name = "severity"
purpose = "Human safety or content sensitivity flag."
cardinality = "zero_or_one"

[[families]]
name = "area"
purpose = "File and directory ownership or conflict domain."
cardinality = "one_or_more_for_active_implementation"

[[families]]
name = "ops"
purpose = "Workflow, bot, or maintenance state outside normal triage taxonomy."
cardinality = "unbounded_but_each_label_requires_writer_reader_lifecycle"

[[families]]
name = "semver"
purpose = "Declared semantic-version severity of a universal-text change; read by the source version drift gate."
cardinality = "exactly_one_for_universal_text_prs"

[[families]]
name = "retro"
purpose = "Retrospective TP/FP feedback-loop classification recorded by operators and the retro drift scanner."
cardinality = "zero_or_more_for_retro_feedback_loop"

