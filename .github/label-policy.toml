reader = "auto-retro sentinel, rescan, and duplicate-retro prevention"
lifecycle = "Added after retrospective creation is confirmed; retained as durable PR audit state."

# The retro:* feedback-loop labels. Their NAMES are the Python single source in
# scripts/_retro_labels.py (ALL_RETRO_LABELS), imported widely at runtime; this
# file is the single source for their identity (description/color). The two are
# coupled by tests/test_retro_labels_in_policy.py so the name set cannot drift.
# type:retrospective is deliberately NOT here: its SoT home stays labels.json /
# scripts/_retro_labels.py pending its #972 retirement decision (Refs #2442).
[[labels]]
name = "retro:tp"
family = "retro"
status = "keep"
description = "Operator-confirmed true positive: follow-up landed and is reducing repair loops."
color = "0e8a16"

[[labels]]
name = "retro:fp"
family = "retro"
status = "keep"
description = "Confirmed false positive: retro fired on weak signals with no genuine repair loop."
color = "ededed"

[[labels]]
name = "retro:fp-candidate"
family = "retro"
status = "keep"
description = "Scanner-detected drift: follow-up stale or unresolved; operator confirms fp or relabels tp."
color = "fbca04"

[[labels]]
name = "retro:tentative"
family = "retro"
status = "keep"
description = "Auto-opened with low prior confidence (label-derived prior below the skip threshold)."
color = "d4c5f9"

[[labels]]
name = "retro:expired"
family = "retro"
status = "keep"
description = "Sentinel closed as not_planned after inactivity; weak fp signal, counted apart from tp/fp."
color = "cfd3d7"

[[retired_labels]]
name = "layer:meta"
reason = "Responsibility is unstable and overlaps the typed axes."

[[retired_labels]]
name = "agent:*"
reason = "Old routing design replaced by type, state, severity, threat, area, and layer axes."

[[retired_labels]]
name = "bug"
reason = "Noisy duplicate of type:fix."

[[retired_labels]]
name = "question"
reason = "Noisy state; use state:rfc, state:parked, or a scoped issue type."

[[retired_labels]]
name = "enhancement"
reason = "Noisy duplicate of type:feat."

[[retired_labels]]
name = "fix"
reason = "Noisy duplicate of type:fix."

[[retired_labels]]
name = "governance"
reason = "Recreates retired layer:meta ambiguity."

[[retired_labels]]
name = "threat:intel-needed"
reason = "Per-item threat:* labelling retired in 1645; findings aggregate weekly onto the 178 security umbrella, not per item. Definition removed in 1647."

[[retired_labels]]
name = "threat:response-needed"
reason = "Per-item threat:* labelling retired in 1645; findings aggregate weekly onto the 178 security umbrella, not per item. Definition removed in 1647."

