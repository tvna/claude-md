name: Refactor
description: Restructure without behaviour change. Use when reshaping code, docs, or workflows without altering observable behaviour.
title: "refactor(<scope>): <summary>"
labels:
  - "type:refactor"
body:
  - type: markdown
    attributes:
      value: |
        Titles must be ASCII-only and match `type(scope): summary` (scope optional).
        Refactors must not change observable behaviour. If behaviour changes, file a `feat` or `fix` instead.
        See `scripts/title_policy.py` and CLAUDE.md sections 1 and 2.
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: One paragraph naming the area being restructured. State explicitly that no behaviour change is intended.
    validations:
      required: true
  - type: textarea
    id: facts
    attributes:
      label: Facts
      description: |
        Observable evidence only -- diffs, logs, file paths, command output.
        No speculation here. Per CLAUDE.md section 2.
      value: "- Fact: "
    validations:
      required: true
  - type: textarea
    id: assumptions
    attributes:
      label: Assumptions / Speculation
      description: |
        Tag each line `Speculation:` when it is a guess rather than evidence.
        Per CLAUDE.md section 2.
      value: "- Speculation: "
    validations:
      required: false
  - type: textarea
    id: proposed_work
    attributes:
      label: Proposed work
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: |
        How completion is proven -- existing tests pass unchanged, public surface
        unchanged. Per CLAUDE.md section 1.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] Existing tests pass unchanged
        - [ ] No observable behaviour change
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Layer
      description: Which CLAUDE.md layer this issue lives in. Multi-select.
      multiple: true
      options:
        - "layer:p1-goal-plan"
        - "layer:p2-input-boundary"
        - "layer:p3-harness"
        - "layer:p4-safety-boundary"
        - "layer:p5-scale-quality"
        - "layer:p6-handoff"
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: Parent / related issue
      description: "Format: #NNN. Leave blank if standalone."
    validations:
      required: false
