name: Feature
description: New behaviour or rule. Use when you are adding capability, not fixing or restructuring existing code.
title: "feat(<scope>): <summary>"
labels:
  - "type:feat"
body:
  - type: markdown
    attributes:
      value: |
        Titles must be ASCII-only and match `type(scope): summary` (scope optional).
        See `scripts/title_policy.py` and CLAUDE.md sections 1 and 2.
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: One paragraph naming what is in and out of scope.
    validations:
      required: true
  - type: textarea
    id: facts
    attributes:
      label: Facts
      description: |
        Observable evidence only -- diffs, logs, file paths, command output.
        No speculation here. Per CLAUDE.md section 2.
      value: "- Fact: "
    validations:
      required: true
  - type: textarea
    id: assumptions
    attributes:
      label: Assumptions / Speculation
      description: |
        Tag each line `Speculation:` when it is a guess rather than evidence.
        Per CLAUDE.md section 2.
      value: "- Speculation: "
    validations:
      required: false
  - type: textarea
    id: proposed_work
    attributes:
      label: Proposed work
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: |
        How completion is proven -- tests, commands, observable workflow runs.
        Per CLAUDE.md section 1.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      value: "- [ ] "
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Layer
      description: Which CLAUDE.md layer this issue lives in. Multi-select.
      multiple: true
      options:
        - "layer:p1-goal-plan"
        - "layer:p2-input-boundary"
        - "layer:p3-harness"
        - "layer:p4-safety-boundary"
        - "layer:p5-scale-quality"
        - "layer:p6-handoff"
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: Parent / related issue
      description: "Format: #NNN. Leave blank if standalone."
    validations:
      required: false
