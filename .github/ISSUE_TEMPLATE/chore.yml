name: Chore
description: Repository hygiene, maintenance, or housekeeping not covered by feat/fix/refactor/docs. No dedicated `type:chore` label exists -- triage applies the type label later.
title: "chore(<scope>): <summary>"
labels:
  - "layer:meta"
body:
  - type: markdown
    attributes:
      value: |
        `type:chore` is not a registered label in `.github/labels.json`. The title
        prefix `chore(scope):` communicates intent; a maintainer applies the type
        label during triage if appropriate. Titles must be ASCII-only and match
        `type(scope): summary` (scope optional). See CLAUDE.md sections 1 and 2.
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: One paragraph naming what is in and out of scope.
    validations:
      required: true
  - type: textarea
    id: facts
    attributes:
      label: Facts
      description: |
        Observable evidence only -- diffs, logs, file paths, command output.
        No speculation here. Per CLAUDE.md section 2.
      value: "- Fact: "
    validations:
      required: true
  - type: textarea
    id: assumptions
    attributes:
      label: Assumptions / Speculation
      description: |
        Tag each line `Speculation:` when it is a guess rather than evidence.
        Per CLAUDE.md section 2.
      value: "- Speculation: "
    validations:
      required: false
  - type: textarea
    id: proposed_work
    attributes:
      label: Proposed work
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: |
        How completion is proven -- tests, commands, observable workflow runs.
        Per CLAUDE.md section 1.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      value: "- [ ] "
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Layer
      description: Which CLAUDE.md layer this issue lives in. Multi-select. Default `layer:meta` is pre-applied; adjust if wrong.
      multiple: true
      options:
        - "layer:p1-goal-plan"
        - "layer:p2-precode"
        - "layer:p3-harness"
        - "layer:p4-artifact"
        - "layer:p5-scope-split"
        - "layer:p6-handoff"
        - "layer:meta"
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: Parent / related issue
      description: "Format: #NNN. Leave blank if standalone."
    validations:
      required: false
