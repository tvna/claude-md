name: ATT&CK coverage review reminder

# Quarterly review reminder for the MITRE ATT&CK coverage tracker (#178).
# Thin orchestration: scripts/attack_review_reminder.py extracts the
# canonical template block from docs/runbooks/attack-coverage-review-cadence.md,
# verifies the H3 sections, and assembles the dated comment;
# scripts/post_issue_comment.py posts it on #178. Refs #184.

on:
  schedule:
    # 00:00 UTC (09:00 JST) on days 1-7 of Jan / Apr / Jul / Oct.
    # GitHub Actions cron treats day-of-month and day-of-week as OR when
    # both are set, so we filter to Monday inside the job below.
    - cron: "0 0 1-7 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only (assemble template, do not post comment on #178).'
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: attack-coverage-review-reminder
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  RUNBOOK: docs/runbooks/attack-coverage-review-cadence.md
  TRACKING_ISSUE: "178"

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Gate to Monday (schedule only)
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "schedule" ]; then
            dow="$(date -u +%u)"
            if [ "${dow}" != "1" ]; then
              echo "Scheduled run on day-of-week=${dow}; only Monday (1) posts. Exiting."
              echo "should_post=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "should_post=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.gate.outputs.should_post == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Assemble review reminder comment
        id: assemble
        if: steps.gate.outputs.should_post == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          comment_path=/tmp/review-comment.md
          python3 scripts/attack_review_reminder.py assemble \
            --runbook "${RUNBOOK}" \
            --out "${comment_path}" \
            --summary-file "${GITHUB_STEP_SUMMARY}" \
            --repo "${REPO}" \
            --run-url "${RUN_URL}"
          echo "comment_path=${comment_path}" >> "$GITHUB_OUTPUT"

      - name: Post review reminder comment on tracking issue
        if: steps.gate.outputs.should_post == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          COMMENT_PATH: ${{ steps.assemble.outputs.comment_path }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            echo "[dry-run] Would post review reminder comment on ${REPO}#${TRACKING_ISSUE}."
            exit 0
          fi

          python3 scripts/post_issue_comment.py create \
            --issue-number "${TRACKING_ISSUE}" \
            --body-file "${COMMENT_PATH}"
          echo "Posted review reminder comment on ${REPO}#${TRACKING_ISSUE}."
