name: ATT&CK coverage review reminder

# Quarterly review reminder for the MITRE ATT&CK coverage tracker (#178).
# All logic lives in this workflow: it extracts the canonical template
# block from docs/runbooks/attack-coverage-review-cadence.md, prepends a
# dated header, and posts a fresh comment on #178. No companion Python
# script. Refs #184.

on:
  schedule:
    # 00:00 UTC (09:00 JST) on days 1-7 of Jan / Apr / Jul / Oct.
    # GitHub Actions cron treats day-of-month and day-of-week as OR when
    # both are set, so we filter to Monday inside the job below.
    - cron: "0 0 1-7 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only (assemble template, do not post comment on #178).'
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: attack-coverage-review-reminder
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  RUNBOOK: docs/runbooks/attack-coverage-review-cadence.md
  TRACKING_ISSUE: "178"

jobs:
  remind:
    runs-on: ubuntu-latest

    steps:
      - name: Gate to Monday (schedule only)
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "schedule" ]; then
            dow="$(date -u +%u)"
            if [ "${dow}" != "1" ]; then
              echo "Scheduled run on day-of-week=${dow}; only Monday (1) posts. Exiting."
              echo "should_post=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "should_post=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.gate.outputs.should_post == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Assemble review reminder comment
        id: assemble
        if: steps.gate.outputs.should_post == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          run_date="$(date -u +%Y-%m-%d)"

          template_path=/tmp/review-template.md
          awk '/<!-- attack-coverage-review-template:begin -->/,/<!-- attack-coverage-review-template:end -->/' \
            "${RUNBOOK}" > "${template_path}"

          if [ ! -s "${template_path}" ]; then
            echo "::error::Could not extract template block from ${RUNBOOK}. Markers missing or runbook unreadable."
            exit 1
          fi

          h3_count="$(grep -cE '^### ' "${template_path}" || true)"
          if [ "${h3_count}" != "7" ]; then
            echo "::error::Extracted template has ${h3_count} H3 sections; expected 7. Refusing to post."
            exit 1
          fi

          comment_path=/tmp/review-comment.md
          {
            echo "## ATT&CK coverage review reminder -- ${run_date}"
            echo
            echo "Quarterly review reminder for the MITRE ATT&CK coverage tracker."
            echo "Runbook: [\`docs/runbooks/attack-coverage-review-cadence.md\`](https://github.com/${REPO}/blob/main/${RUNBOOK})."
            echo "Workflow run: ${RUN_URL}."
            echo "Refs #184."
            echo
            echo "Edit this comment in place to fill in each section below."
            echo
            cat "${template_path}"
          } > "${comment_path}"

          {
            echo "### Assembled review reminder comment"
            echo
            echo '```markdown'
            cat "${comment_path}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "comment_path=${comment_path}" >> "$GITHUB_OUTPUT"

      - name: Post review reminder comment on tracking issue
        if: steps.gate.outputs.should_post == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          COMMENT_PATH: ${{ steps.assemble.outputs.comment_path }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            echo "[dry-run] Would post review reminder comment on ${REPO}#${TRACKING_ISSUE}."
            exit 0
          fi

          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::GITHUB_TOKEN is empty."
            exit 1
          fi

          payload="$(python3 -c 'import json, sys, pathlib; sys.stdout.write(json.dumps({"body": pathlib.Path(sys.argv[1]).read_text()}))' "${COMMENT_PATH}")"

          http_code="$(curl -sS -o /tmp/post-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/issues/${TRACKING_ISSUE}/comments" \
            -d "${payload}")"

          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "::error::POST comment failed (HTTP ${http_code})."
            cat /tmp/post-response.json
            exit 1
          fi

          echo "Posted review reminder comment on ${REPO}#${TRACKING_ISSUE} (HTTP ${http_code})."
