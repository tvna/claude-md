name: Publish devcontainer images

on:
  push:
    branches: [main]
    paths:
      - ".devcontainer/images/**"
      - ".devcontainer/scripts/configure-agent-runtime.sh"
      - ".devcontainer/scripts/install-agent-cli.sh"
      - ".github/workflows/publish-devcontainer-images.yml"
      - "flake.lock"
      - "flake.nix"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.agent }} devcontainer image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: claude
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - agent: claude
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - agent: codex
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - agent: codex
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      DEVCONTAINERS_CLI_VERSION: "0.86.1"
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/claude-md-devcontainer
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Prepare BuildKit builder
        run: |
          builder="devcontainer-${{ matrix.agent }}-${{ matrix.arch }}"
          docker buildx create --name "$builder" --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Build and publish ${{ matrix.agent }} devcontainer image
        run: |
          image="${IMAGE_PREFIX}-${{ matrix.agent }}"
          cache_ref="${image}:buildcache-${{ matrix.arch }}"
          npx --yes "@devcontainers/cli@${DEVCONTAINERS_CLI_VERSION}" build \
            --workspace-folder . \
            --config ".devcontainer/images/${{ matrix.agent }}/devcontainer.json" \
            --platform "${{ matrix.platform }}" \
            --image-name "${image}:${GITHUB_SHA}-${{ matrix.arch }}" \
            --cache-from "type=registry,ref=${cache_ref}" \
            --cache-to "type=registry,ref=${cache_ref},mode=max" \
            --push

  scan:
    name: Scan ${{ matrix.agent }} devcontainer image (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # Isolated from `build` so a compromised scanner cannot reach the GHCR write
    # token: scan holds read-only registry access plus SARIF upload, nothing more.
    permissions:
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: claude
            arch: amd64
            runner: ubuntu-24.04
          - agent: claude
            arch: arm64
            runner: ubuntu-24.04-arm
          - agent: codex
            arch: amd64
            runner: ubuntu-24.04
          - agent: codex
            arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/claude-md-devcontainer
    steps:
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      # Trivy scans the per-arch image published by `build` on the matching-arch
      # runner. Informational-first posture (mirrors the CodeQL workflow):
      # exit-code 0 means findings never fail the run, and continue-on-error
      # means a Trivy DB-download or other infra failure never blocks publish.
      # Results surface in the Security tab via the SARIF upload.
      - name: Scan published image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.agent }}:${{ github.sha }}-${{ matrix.arch }}
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
          # Pin the Trivy binary, not just the action SHA. trivy-action downloads
          # the scanner at runtime and the `version:` input selects which binary;
          # leaving it unset (or `latest`) was the exposure vector in the
          # 2026-03-19 Trivy supply-chain incident (aquasecurity/trivy#10425).
          # v0.70.0 is the trivy-action v0.36.0 default and post-incident
          # (>= v0.69.3). Bump in lockstep when the pinned action SHA changes.
          version: v0.70.0

      - name: Upload Trivy results to the Security tab
        uses: github/codeql-action/upload-sarif@1a818fd5f97ed0ee9a823421bd5b171add01227f # v4.36.2
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.agent }}-${{ matrix.arch }}

  publish:
    name: Publish ${{ matrix.agent }} devcontainer manifest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        agent: [claude, codex]
    env:
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/claude-md-devcontainer
    steps:
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Publish ${{ matrix.agent }} multi-platform tags
        run: |
          image="${IMAGE_PREFIX}-${{ matrix.agent }}"
          docker buildx imagetools create \
            --tag "${image}:main" \
            --tag "${image}:${GITHUB_SHA}" \
            "${image}:${GITHUB_SHA}-amd64" \
            "${image}:${GITHUB_SHA}-arm64"

  update-pins:
    name: Update local devcontainer image pins
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: devcontainer-image-pins
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Update pinned image SHAs
        run: python3 scripts/update_devcontainer_image_pins.py "$GITHUB_SHA"

      - name: Open pin update PR
        env:
          GH_TOKEN: ${{ secrets.DEVCONTAINER_PIN_PR_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/devcontainer_pin_pr.py open \
            --github-sha "$GITHUB_SHA" \
            --base main \
            --title "fix(devcontainer): pin published agent images" \
            --commit-subject "fix(devcontainer): pin published agent images" \
            --commit-trailer "Refs #696" \
            --template .github/pr-body-templates/devcontainer-image-pins.md \
            --file .devcontainer/claude/devcontainer.json \
            --file .devcontainer/codex/devcontainer.json \
            --file docs/runbooks/devcontainers.md
