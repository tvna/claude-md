name: Publish devcontainer images

on:
  push:
    branches: [main]
    paths:
      - ".devcontainer/images/**"
      - ".devcontainer/scripts/configure-agent-runtime.sh"
      - ".devcontainer/scripts/install-agent-cli.sh"
      - ".github/workflows/publish-devcontainer-images.yml"
      - "flake.lock"
      - "flake.nix"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.agent }} devcontainer image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: claude
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - agent: claude
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - agent: codex
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - agent: codex
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      DEVCONTAINERS_CLI_VERSION: "0.86.1"
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/claude-md-devcontainer
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Prepare BuildKit builder
        run: |
          builder="devcontainer-${{ matrix.agent }}-${{ matrix.arch }}"
          docker buildx create --name "$builder" --driver docker-container --use
          docker buildx inspect --bootstrap

      # The nix-warm-claude Feature bakes the .#claude devShell closure at build
      # time, but the workspace is NOT mounted during Feature install, so the
      # Feature can only see files packaged inside its own directory. Stage the
      # flake files the Feature realises (flake.nix/flake.lock for the closure,
      # pyproject.toml for the uv version the flake reads) into the Feature dir
      # for the claude legs only. These copies are git-ignored so they never
      # drift from the repo flake; each build re-stages the current files, and
      # all three are in this workflow's `paths:` trigger so a flake change
      # rebuilds (and re-realises) the layer. Refs #1491.
      - name: Stage flake into nix-warm-claude feature
        if: matrix.agent == 'claude'
        run: |
          set -euo pipefail
          feature_dir=".devcontainer/images/features/nix-warm-claude"
          cp flake.nix flake.lock pyproject.toml "$feature_dir/"

      - name: Build and publish ${{ matrix.agent }} devcontainer image
        run: |
          image="${IMAGE_PREFIX}-${{ matrix.agent }}"
          cache_ref="${image}:buildcache-${{ matrix.arch }}"
          npx --yes "@devcontainers/cli@${DEVCONTAINERS_CLI_VERSION}" build \
            --workspace-folder . \
            --config ".devcontainer/images/${{ matrix.agent }}/devcontainer.json" \
            --platform "${{ matrix.platform }}" \
            --image-name "${image}:${GITHUB_SHA}-${{ matrix.arch }}" \
            --cache-from "type=registry,ref=${cache_ref}" \
            --cache-to "type=registry,ref=${cache_ref},mode=max" \
            --push

  scan:
    name: Scan ${{ matrix.agent }} devcontainer image (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # Isolated from `build` so a compromised scanner cannot reach the GHCR write
    # token: scan holds read-only registry access plus SARIF upload, nothing more.
    permissions:
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: claude
            arch: amd64
            runner: ubuntu-24.04
          - agent: claude
            arch: arm64
            runner: ubuntu-24.04-arm
          - agent: codex
            arch: amd64
            runner: ubuntu-24.04
          - agent: codex
            arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/claude-md-devcontainer
    steps:
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      # Trivy scans the per-arch image published by `build` on the matching-arch
      # runner. Informational-first posture (mirrors the CodeQL workflow):
      # exit-code 0 means findings never fail the run, and continue-on-error
      # means a Trivy DB-download or other infra failure never blocks publish.
      # Results surface in the Security tab via the SARIF upload.
      #
      # The scanner runtime is pinned by image *digest*, not by the resolve-at-
      # runtime version/tag that the trivy-action wrapper used: images referenced
      # by digest were unaffected by the 2026-03-19 Trivy supply-chain incident
      # (aquasecurity/trivy#10425), whereas a version/tag remains re-resolvable
      # upstream. Dropping the trivy-action `uses:` ref loses its Dependabot
      # auto-bump and OSV correlation surface; the `# threat-intel-pin:` line in
      # the run block below re-attaches the OSV surface
      # (scripts/threat_intel_triage.py reads it), and the digest bump/refresh
      # procedure is documented in docs/runbooks/compromised-action-response.md.
      # Bump the @sha256 digest and the threat-intel-pin version in lockstep.
      # Refs #1276, #1267, #1264.
      - name: Scan published image with Trivy
        continue-on-error: true
        env:
          # Trivy reads TRIVY_USERNAME / TRIVY_PASSWORD for registry auth when it
          # pulls the GHCR image to scan (and the trivy-db). Passed by reference
          # (`-e NAME`) below so the token never lands on the command line.
          # github.token is the job's read-only GHCR credential.
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
          IMAGE_REF: ${{ env.IMAGE_PREFIX }}-${{ matrix.agent }}:${{ github.sha }}-${{ matrix.arch }}
        run: |
          set -euo pipefail
          # Skip the Nix store optimisation hardlink farm. /nix/store/.links is a
          # content-addressed mirror in which every store file is hardlinked under
          # a second path; Trivy's secret scanner walks it and reports findings
          # (e.g. a HIGH "Asymmetric Private Key") against the .links/<hash> path,
          # and also emits a 15 MB large-file warning. Skipping the farm loses no
          # detection coverage: each .links entry is a hardlink to a file that is
          # still scanned at its real /nix/store/<hash> path. Verified against
          # Trivy v0.70.0 pkg/fanal/utils/utils.go SkipPath: skip-dirs patterns are
          # matched on the leading-slash-trimmed path with doublestar, so the
          # relative pattern below prunes the whole subtree. Refs #1473, #1348.
          #
          # threat-intel-pin: Go github.com/aquasecurity/trivy 0.71.0
          docker run --rm \
            -e TRIVY_USERNAME \
            -e TRIVY_PASSWORD \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ghcr.io/aquasecurity/trivy@sha256:016eae51fdcf989332a5404af7e8f625cd5d95d7c0907a221d080a996f556500 \
            image \
              --scanners vuln,secret,misconfig \
              --skip-dirs nix/store/.links \
              --format sarif \
              --output trivy-results.sarif \
              --exit-code 0 \
              "$IMAGE_REF"

      - name: Upload Trivy results to the Security tab
        uses: github/codeql-action/upload-sarif@1a818fd5f97ed0ee9a823421bd5b171add01227f # v4.36.2
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.agent }}-${{ matrix.arch }}

  publish:
    name: Publish ${{ matrix.agent }} devcontainer manifest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        agent: [claude, codex]
    env:
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/claude-md-devcontainer
    steps:
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Publish ${{ matrix.agent }} multi-platform tags
        run: |
          image="${IMAGE_PREFIX}-${{ matrix.agent }}"
          docker buildx imagetools create \
            --tag "${image}:main" \
            --tag "${image}:${GITHUB_SHA}" \
            "${image}:${GITHUB_SHA}-amd64" \
            "${image}:${GITHUB_SHA}-arm64"

  update-pins:
    name: Update local devcontainer image pins
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: devcontainer-image-pins
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Update pinned image SHAs
        run: python3 scripts/update_devcontainer_image_pins.py "$GITHUB_SHA"

      # Mint a short-lived GitHub App installation token so the generated pin PR
      # is authored by the App bot (not a human PAT owner). App-token events,
      # unlike GITHUB_TOKEN, still trigger the downstream pull_request checks the
      # auto-merge keeper waits on. The token also authors the pin commit via the
      # GraphQL createCommitOnBranch API, so GitHub signs it (Verified) under the
      # App bot, satisfying the required_signatures rule on main. Refs #1401, #1437.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DEVCONTAINER_PIN_APP_ID }}
          private-key: ${{ secrets.DEVCONTAINER_PIN_APP_PRIVATE_KEY }}

      - name: Open pin update PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/devcontainer_pin_pr.py open \
            --github-sha "$GITHUB_SHA" \
            --base main \
            --title "fix(devcontainer): pin published agent images" \
            --commit-subject "fix(devcontainer): pin published agent images" \
            --commit-trailer "Refs #696" \
            --template .github/pr-body-templates/devcontainer-image-pins.md \
            --file .devcontainer/claude/devcontainer.json \
            --file .devcontainer/codex/devcontainer.json \
            --file .devcontainer/claude-amd64/devcontainer.json \
            --file .devcontainer/claude-arm64/devcontainer.json \
            --file .devcontainer/codex-amd64/devcontainer.json \
            --file .devcontainer/codex-arm64/devcontainer.json \
            --file docs/runbooks/devcontainers.md
