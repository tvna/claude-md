name: Publish devcontainer images

on:
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/publish-devcontainer-images.yml"
      - "flake.lock"
      - "flake.nix"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.agent }} devcontainer image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: claude
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - agent: claude
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - agent: codex
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - agent: codex
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      DEVCONTAINERS_CLI_VERSION: "0.86.1"
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/claude-md-devcontainer
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Build and publish ${{ matrix.agent }} devcontainer image
        run: |
          image="${IMAGE_PREFIX}-${{ matrix.agent }}"
          npx --yes "@devcontainers/cli@${DEVCONTAINERS_CLI_VERSION}" build \
            --workspace-folder . \
            --config ".devcontainer/images/${{ matrix.agent }}/devcontainer.json" \
            --platform "${{ matrix.platform }}" \
            --image-name "${image}:${GITHUB_SHA}-${{ matrix.arch }}" \
            --push

  publish:
    name: Publish ${{ matrix.agent }} devcontainer manifest
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        agent: [claude, codex]
    env:
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/claude-md-devcontainer
    steps:
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Publish ${{ matrix.agent }} multi-platform tags
        run: |
          image="${IMAGE_PREFIX}-${{ matrix.agent }}"
          docker buildx imagetools create \
            --tag "${image}:main" \
            --tag "${image}:${GITHUB_SHA}" \
            "${image}:${GITHUB_SHA}-amd64" \
            "${image}:${GITHUB_SHA}-arm64"
