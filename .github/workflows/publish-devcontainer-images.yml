name: Publish devcontainer images

on:
  push:
    branches: [main]
    paths:
      - ".devcontainer/images/**"
      - ".devcontainer/scripts/install-agent-cli.sh"
      - ".github/workflows/publish-devcontainer-images.yml"
      - "flake.lock"
      - "flake.nix"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.agent }} devcontainer image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: claude
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - agent: claude
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - agent: codex
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - agent: codex
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      DEVCONTAINERS_CLI_VERSION: "0.86.1"
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/claude-md-devcontainer
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Prepare BuildKit builder
        run: |
          builder="devcontainer-${{ matrix.agent }}-${{ matrix.arch }}"
          docker buildx create --name "$builder" --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Build and publish ${{ matrix.agent }} devcontainer image
        run: |
          image="${IMAGE_PREFIX}-${{ matrix.agent }}"
          cache_ref="${image}:buildcache-${{ matrix.arch }}"
          npx --yes "@devcontainers/cli@${DEVCONTAINERS_CLI_VERSION}" build \
            --workspace-folder . \
            --config ".devcontainer/images/${{ matrix.agent }}/devcontainer.json" \
            --platform "${{ matrix.platform }}" \
            --image-name "${image}:${GITHUB_SHA}-${{ matrix.arch }}" \
            --cache-from "type=registry,ref=${cache_ref}" \
            --cache-to "type=registry,ref=${cache_ref},mode=max" \
            --push

  publish:
    name: Publish ${{ matrix.agent }} devcontainer manifest
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        agent: [claude, codex]
    env:
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/claude-md-devcontainer
    steps:
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Publish ${{ matrix.agent }} multi-platform tags
        run: |
          image="${IMAGE_PREFIX}-${{ matrix.agent }}"
          docker buildx imagetools create \
            --tag "${image}:main" \
            --tag "${image}:${GITHUB_SHA}" \
            "${image}:${GITHUB_SHA}-amd64" \
            "${image}:${GITHUB_SHA}-arm64"

  update-pins:
    name: Update local devcontainer image pins
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Update pinned image SHAs
        run: python3 scripts/update_devcontainer_image_pins.py "$GITHUB_SHA"

      - name: Open pin update PR
        env:
          GH_TOKEN: ${{ secrets.DEVCONTAINER_PIN_PR_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "devcontainer image pins already match ${GITHUB_SHA}"
            exit 0
          fi

          branch="codex/devcontainer-image-pins-${GITHUB_SHA}"
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::DEVCONTAINER_PIN_PR_TOKEN is required because the default GitHub Actions token cannot create pull requests in this repository."
            exit 1
          fi

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            existing_pr="$(gh pr list --head "$branch" --state open --json url --jq '.[0].url // ""')"
            if [ -n "$existing_pr" ]; then
              echo "pin update PR already exists: $existing_pr"
              exit 0
            fi
            echo "pin update branch already exists without an open PR; retrying PR creation: $branch"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b "$branch"
            git add .devcontainer/claude/devcontainer.json .devcontainer/codex/devcontainer.json docs/runbooks/devcontainers.md
            git commit -m "fix(devcontainer): pin published agent images" -m "Refs #696"
            git push origin "$branch"
          fi

          cat > pr-body.md <<EOF
          ## Summary

          Refs #696.
          <!-- partial -->

          - Update Claude and Codex devcontainer image pins to ${GITHUB_SHA}.
          - Keep local entrypoints on immutable multi-platform image tags.

          ## Facts

          - Fact: the devcontainer publish workflow completed before this PR was opened.
          - Fact: this PR was generated from the publish workflow for ${GITHUB_SHA}.

          ## Assumptions

          - Assumption: the published tag contains the expected amd64 and arm64 manifests because the publish job succeeded.

          ## Risk & blast radius

          - Limited to local devcontainer image pins and the devcontainer runbook.

          ## Verification

          - command: \`update devcontainer image pins for ${GITHUB_SHA}\`
            result: passed.

          ## Rollback

          - Revert this PR to restore the previous pinned image SHA.

          ## Checklist

          ### Bootstrap

          - [x] Issue exists before branch and commit.
          - [x] Branch created by the publish workflow.
          - [x] PR title is ASCII and policy-compliant.

          ### Review

          - [x] Blast radius is limited to devcontainer image pins and the devcontainer runbook.
          - [x] The workflow avoids an image publish / pin update loop.

          ### After-merge

          - [ ] Confirm repository checks pass on the PR.

          ### Post-merge

          - [ ] Reopen the devcontainer and verify Podman selects the host-native image platform.

          _Generated by [GitHub Actions](https://github.com/features/actions)._
          EOF
          gh pr create \
            --base main \
            --head "$branch" \
            --title "fix(devcontainer): pin published agent images" \
            --body-file pr-body.md
