name: Verify GitHub issue content

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: read

concurrency:
  group: verify-github-issue-content-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: "Verify GitHub issue content / gate"
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      KIND: issue
      TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      BODY_POLICY_CUTOFF: "2026-05-26T00:00:00Z"
      BODY_POLICY_SHAPE_CUTOFF: "2026-05-26T00:00:00Z"
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate title policy
        run: |
          body_file="$(mktemp)"
          printf '%s' "$ISSUE_BODY" > "$body_file"
          python3 scripts/title_policy.py verify --kind "$KIND" --body-file "$body_file"

      - name: Validate body section structure
        run: |
          body_file="$(mktemp)"
          printf '%s' "$ISSUE_BODY" > "$body_file"
          python3 scripts/body_policy.py verify \
            --kind "$KIND" \
            --body-file "$body_file"
