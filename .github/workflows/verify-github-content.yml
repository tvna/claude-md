name: Verify GitHub content

on:
  issues:
    types: [opened, edited, reopened]
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: verify-github-content-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: "Verify GitHub content / gate"
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      KIND: ${{ github.event_name == 'issues' && 'issue' || 'pull_request' }}
      TITLE: ${{ github.event.issue.title || github.event.pull_request.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      BODY_POLICY_CUTOFF: "2026-05-26T00:00:00Z"
      BODY_POLICY_SHAPE_CUTOFF: "2026-05-26T00:00:00Z"
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # fetch-depth: 0 makes origin/<base> reachable from HEAD so the
          # single-commit step below can run `git rev-list <base>..HEAD`.
          # Issue #492.
          fetch-depth: 0

      - name: Validate title policy
        run: python3 scripts/title_policy.py verify --kind "$KIND"

      - name: Validate single-commit PR rule
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: python3 scripts/preflight_pr_single_commit.py

      - name: Validate no merge-from-main commits
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
          # HEAD_REF pins the comparison endpoint to the actual PR head SHA
          # so the GitHub-generated `refs/pull/<N>/merge` synthetic merge
          # does not false-positive the gate. Issue #491.
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/preflight_pr_no_merge_commits.py

      - name: Validate body section structure
        run: |
          body_file="$(mktemp)"
          if [ "$KIND" = "issue" ]; then
            printf '%s' "$ISSUE_BODY" > "$body_file"
          else
            printf '%s' "$PR_BODY" > "$body_file"
          fi
          python3 scripts/body_policy.py verify \
            --kind "$KIND" \
            --body-file "$body_file"

      - name: Validate PR-issue link
        if: github.event_name == 'pull_request'
        run: |
          body_file="$(mktemp)"
          printf '%s' "$PR_BODY" > "$body_file"
          python3 scripts/issue_link.py verify --repo "$REPO" --body-file "$body_file" --author "$PR_AUTHOR"

      - name: Validate README translation parity
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          body_file="$(mktemp)"
          printf '%s' "$PR_BODY" > "$body_file"
          python3 scripts/verify_readme_translation.py verify \
            --base-ref "$BASE_REF" \
            --body-file "$body_file"
