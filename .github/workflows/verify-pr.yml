name: Verify PR

# Consolidated PR-verification gates (issue #1319). This file groups the
# pull_request validation workflows that previously lived as separate files:
#   - portable-pr-policy.yml      -> job: portable-pr-policy
#   - verify-design-philosophy.yml-> job: verify-design-philosophy
#   - verify-dependabot-labels.yml-> job: verify-dependabot-labels
#   - verify-ruleset-sync.yml     -> job: verify-ruleset-sync
#
# Each job keeps its original `name:` so the required_status_check contexts in
# .github/rulesets/main.json keep resolving (scripts/verify_required_check_contexts.py
# matches on job `name:`, not file name). Job-level permissions, concurrency,
# environment, and env are preserved per job to keep effective security
# permissions identical to the pre-consolidation state.
#
# Trigger note (intentional widening, documented per #1319): the merged
# on.pull_request.types is the UNION of the source triggers
# ([opened, edited, synchronize, reopened, ready_for_review]). The two jobs that
# previously used the default types (verify-design-philosophy, verify-dependabot-labels)
# now also run on `edited` and `ready_for_review`. This is a superset of their
# old triggers; it never narrows their coverage and keeps the required gates
# resolvable on title/body edits.
#
# `labeled` / `unlabeled` are included (#89) so the source-version drift gate
# re-runs when a `semver:*` label is added, changed, or removed: the gate reads
# the label set from github.event.pull_request.labels, so without these activity
# types a post-green label edit would leave the required check stale and let a
# PR merge with a label that no longer matches the version bump.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions: {}

jobs:
  portable-pr-policy:
    name: "Portable PR policy / gate"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    concurrency:
      group: portable-pr-policy-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      KIND: pull_request
      TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
      BODY_POLICY_CUTOFF: "2026-05-26T00:00:00Z"
      BODY_POLICY_SHAPE_CUTOFF: "2026-05-26T00:00:00Z"
      BASE_REF: origin/${{ github.event.pull_request.base.ref }}
      APM_CLI_VERSION: "0.12.1"
      # Every file `apm compile --target all` can produce (Refs #2210, #2211).
      # git status --porcelain (not git diff) is required: a target file
      # apm compile creates for the first time is untracked, and git diff
      # silently ignores untracked paths.
      COMPILED_OUTPUT_PATHS: "CLAUDE.md AGENTS.md GEMINI.md .github/copilot-instructions.md"
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # fetch-depth: 0 makes origin/<base> reachable from HEAD so the
          # README translation check can compare <base>..HEAD.
          fetch-depth: 0
          persist-credentials: false

      - name: Validate title policy
        run: |
          body_file="$(mktemp)"
          printf '%s' "$PR_BODY" > "$body_file"
          python3 scripts/title_policy.py verify --kind "$KIND" --body-file "$body_file" --author "$PR_AUTHOR"

      - name: Validate body section structure
        run: |
          body_file="$(mktemp)"
          printf '%s' "$PR_BODY" > "$body_file"
          python3 scripts/body_policy.py verify \
            --kind "$KIND" \
            --body-file "$body_file"

      - name: Validate retro repair completeness
        run: |
          body_file="$(mktemp)"
          printf '%s' "$PR_BODY" > "$body_file"
          python3 scripts/auto_retro.py verify-retro-completeness \
            --repo "$REPO" --pr-title "$TITLE" --pr-body-file "$body_file"

      - name: Block direct PR from retro issue
        run: |
          body_file="$(mktemp)"
          printf '%s' "$PR_BODY" > "$body_file"
          python3 scripts/auto_retro.py verify-no-direct-retro-pr \
            --repo "$REPO" --pr-title "$TITLE" --pr-body-file "$body_file"

      - name: Validate PR-issue link
        run: |
          body_file="$(mktemp)"
          printf '%s' "$PR_BODY" > "$body_file"
          python3 scripts/issue_link.py verify --repo "$REPO" --body-file "$body_file" --author "$PR_AUTHOR"

      - name: Validate linked issue titles
        run: |
          body_file="$(mktemp)"
          printf '%s' "$PR_BODY" > "$body_file"
          python3 scripts/verify_linked_issue_titles.py verify --repo "$REPO" --body-file "$body_file"

      - name: Validate README translation parity
        run: |
          body_file="$(mktemp)"
          printf '%s' "$PR_BODY" > "$body_file"
          python3 scripts/verify_readme_translation.py verify \
            --base-ref "$BASE_REF" \
            --body-file "$body_file"

      - name: Forbid hand edits to generated script docs
        # docs/generated/ and the docs/standards/module-size-distribution.toml
        # size snapshot are owned by the post-merge automation (#1540, #2013).
        # This gate fails a non-bot PR whose diff touches them. The post-merge
        # bot branch (chore/update-generated-docs) is exempt; it is resolved
        # from GITHUB_HEAD_REF, which Actions sets on pull_request.
        run: |
          python3 scripts/gate_generated_scripts_manual_edit.py verify \
            --base-ref "$BASE_REF"

      - name: Forbid hand edits to APM-managed skill trees
        # .agents/skills/ and .claude/skills/ are generated by `apm compile` from
        # the obra/superpowers pin (#2066, #1892). The PreToolUse gate
        # (scripts/gate_agents_skills_edit.py) blocks edits inside an agent
        # session; this is the post-merge-tree counterpart (#2098, Gap B) that
        # fails a PR diffing those trees without a matching apm.yml / apm.lock.yaml
        # pin change -- a hand edit the next compile would silently overwrite.
        run: |
          python3 scripts/gate_agents_skills_edit.py verify --base-ref "$BASE_REF"

      - name: Require Text delta section for instruction changes
        run: |
          body_file="$(mktemp)"
          printf '%s' "$PR_BODY" > "$body_file"
          python3 scripts/verify_text_delta_section.py verify \
            --base-ref "$BASE_REF" \
            --body-file "$body_file" \
            --created-at "$PR_CREATED_AT" \
            --cutoff "$BODY_POLICY_CUTOFF"

      - name: Require design-philosophy matrix update for principle changes
        run: |
          body_file="$(mktemp)"
          printf '%s' "$PR_BODY" > "$body_file"
          python3 scripts/scan_design_philosophy_drift.py verify-coupling \
            --base-ref "$BASE_REF" \
            --body-file "$body_file"

      - name: Require justification for net instruction-text growth
        run: |
          body_file="$(mktemp)"
          printf '%s' "$PR_BODY" > "$body_file"
          python3 scripts/verify_instruction_text_growth.py verify \
            --base-ref "$BASE_REF" \
            --body-file "$body_file" \
            --created-at "$PR_CREATED_AT" \
            --cutoff "$BODY_POLICY_CUTOFF"

      - name: Verify source version bump drift gate
        # Refs #89: the universal text changes iff apm.yml version bumps, and
        # the bump component matches the declared semver:* label. PR_LABELS is
        # read at PR time only (labels are repository state, not git-tracked).
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          python3 scripts/verify_source_version_bump.py verify \
            --base-ref "$BASE_REF"

      - name: Scan APM artifacts for repo-local references
        run: |
          python3 scripts/scan_apm_portability.py verify \
            --path .apm/instructions/master.instructions.md \
            --path CLAUDE.md \
            --path AGENTS.md \
            --path GEMINI.md

      - name: Scan APM artifacts for non-ASCII characters
        run: |
          python3 scripts/scan_apm_ascii.py verify \
            --path .apm/instructions/master.instructions.md \
            --path CLAUDE.md \
            --path AGENTS.md \
            --path GEMINI.md

      - name: Scan all tracked files for em-dash (U+2014)
        # Refs #1889: repo-wide gate so no tracked file can regress to U+2014.
        # scan_apm_ascii.py guards only the three APM artifacts; this step
        # covers the full tree.
        run: python3 scripts/scan_repo_em_dash.py verify --git-tracked

      - name: Scan all tracked files for prose double-hyphen separator
        # Refs #1903: repo-wide gate so no tracked prose file can reintroduce
        # ' -- ' as a separator. Skips noqa lines, Markdown table rows, and
        # structured-data file extensions (.yml, .yaml, .sh, .json, .toml,
        # .lock, .sql). Complements the em-dash gate above.
        run: python3 scripts/scan_repo_double_hyphen.py verify --git-tracked

      - name: Verify runbook template conformance
        # Refs #2065: new/changed docs/runbooks/*.md must follow TEMPLATE.md's
        # canonical section skeleton (diff-scoped, blocking). PR-body waiver:
        # 'runbook-template-waiver: docs/runbooks/NAME.md; reason'.
        run: |
          body_file="$(mktemp)"
          printf '%s' "$PR_BODY" > "$body_file"
          python3 scripts/scan_runbook_template_drift.py verify \
            --base-ref "$BASE_REF" \
            --body-file "$body_file"

      - name: Set up uv and project environment
        uses: ./.github/actions/setup-uv

      - name: Compile agent instructions
        # --target all: every apm-cli-supported tool, not just claude/codex.
        # Refs #2210.
        run: uv run --with "apm-cli==${APM_CLI_VERSION}" --exclude-newer "14 days" apm compile --target all

      - name: Verify compiled instruction outputs drift
        run: |
          # git status --porcelain (not git diff --exit-code): a target file
          # apm compile creates for the first time is untracked, and git diff
          # silently ignores untracked paths. Refs #2211 (Codex review).
          # shellcheck disable=SC2086
          drift="$(git status --porcelain -- $COMPILED_OUTPUT_PATHS)"
          if [ -n "$drift" ]; then
            echo "::error::Compiled instruction output drift detected vs .apm/instructions/master.instructions.md:"
            echo "$drift"
            echo "Run 'uv run --with \"apm-cli==${APM_CLI_VERSION}\" --exclude-newer \"14 days\" apm compile --target all' locally and commit the result."
            exit 1
          fi

      - name: Verify .apm checksum lockfile
        run: python3 scripts/verify_apm_checksums.py verify

      - name: Verify apm.lock.yaml MCP drift
        run: python3 scripts/scan_apm_lock_drift.py verify

      - name: Run prek (j178/prek) against all files
        run: uv tool run prek run --all-files --show-diff-on-failure

  scan-double-hyphen:
    # Refs #2069 (retro Gap B). Standalone required-check counterpart to the
    # portable-pr-policy step of the same scan. The pre-push hook
    # (scan_repo_double_hyphen in preflight_steps.py) only runs before an agent
    # push; a post-merge conflict resolution or `apm compile` that regenerates a
    # tracked file can reintroduce the prose double-hyphen separator after the
    # gate already passed, and that merge commit has no further inspection. This
    # job re-runs the repo-wide scan in CI so the post-merge tree is covered.
    name: "Scan double-hyphen / verify"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: scan-double-hyphen-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Shallow checkout suffices: the scan enumerates the current tracked
          # tree via git ls-files and reads files; it needs no git history.
          persist-credentials: false

      - name: Scan all tracked files for prose double-hyphen separator
        run: python3 scripts/scan_repo_double_hyphen.py verify --git-tracked

  verify-design-philosophy:
    name: "Verify design philosophy doc / verify"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: verify-design-philosophy-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Scan design-philosophy doc for drift against APM master
        run: |
          python3 scripts/scan_design_philosophy_drift.py verify \
            --master .apm/instructions/master.instructions.md \
            --doc docs/prd/agent-rules-design-philosophy.md \
            --glossary docs/standards/ubiquitous-language.md

  verify-dependabot-labels:
    name: "Verify dependabot labels / verify"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: verify-dependabot-labels-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify dependabot.yml labels resolve in labels.json
        run: |
          python3 scripts/dependabot_labels.py verify \
            --dependabot .github/dependabot.yml \
            --labels .github/labels.json

  verify-ruleset-sync:
    name: "Verify ruleset sync / gate"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ruleset-verify
    permissions:
      contents: read
    concurrency:
      group: verify-ruleset-sync-${{ github.ref }}
      cancel-in-progress: true
    env:
      GH_TOKEN_API: ${{ secrets.RULESETS_PAT }}
      REPO: ${{ github.repository }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Guard RULESETS_PAT
        run: |
          if [ -z "${GH_TOKEN_API}" ]; then
            echo "::error::RULESETS_PAT secret is not set. Configure the 'ruleset-verify' environment with the RULESETS_PAT secret. See docs/runbooks/rulesets.md \"Required secret\" and \"PR-time required-checks sync gate\"."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify required-check contexts match workflow job names
        run: |
          python3 scripts/verify_required_check_contexts.py verify \
            --sot-path .github/rulesets/main.json \
            --workflows-dir .github/workflows

      - name: Verify ruleset sync
        run: |
          python3 scripts/verify_ruleset_sync.py verify \
            --repo "${REPO}" \
            --base-ref "${BASE_REF}" \
            --sot-path .github/rulesets/main.json \
            --ruleset-name main-protection
