# Lint GitHub Actions workflows at PR time.
#
# actionlint validates workflow syntax, ${{ }} expression types, runner
# labels, and -- via shellcheck -- the shell in every run: block. This is the
# correctness sibling of the security-focused scan_workflow_* gates in
# verify-agents.yml; check-yaml in .pre-commit-config.yaml deliberately
# excludes .github/workflows/, so without this gate workflow YAML is otherwise
# unvalidated. Both binaries come from the flake (sharedPackages), so the gate
# runs through `nix develop` to match the devcontainer toolchain exactly. The
# same lint runs locally via the pre-commit `actionlint` hook and the
# preflight_all.py `actionlint` step. Refs #1256.
name: Verify workflows (actionlint)

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "flake.nix"
      - "flake.lock"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Run actionlint (with shellcheck) via the dev shell
        # `nix develop` realises the default shell, putting actionlint and
        # shellcheck on PATH; actionlint auto-discovers .github/workflows/ and
        # invokes shellcheck for every run: block.
        run: nix develop --command actionlint -color
