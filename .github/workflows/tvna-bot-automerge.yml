name: Auto-merge tvna-bot PRs

# The repository-level "Allow auto-merge" toggle is intentionally OFF so agents
# cannot enable GitHub native auto-merge on arbitrary PRs. Native auto-merge is
# repo-wide and cannot be scoped, so this keeper provides the same outcome
# strictly for PRs authored by the App bot (tvna-bot[bot]): once such a PR
# reaches mergeable_state=clean it is squash-merged via the REST merge API and
# its branch deleted. Branch protection (main ruleset: required checks,
# required_signatures, squash-only) still gates the merge -- a non-clean PR is
# left for the next trigger. Squash is fixed so the keyless signing invariant on
# main is preserved (see docs/standards/commit-signing.md).
#
# This consolidates the earlier per-flow devcontainer-pin-automerge keeper; the
# merge subcommand filters by author and clean state, so the broad triggers
# below are no-op-safe.
#
# Triggers (mirrors the previous pin keeper -- #1363): a check_suite:completed
# trigger never fires for Actions-created suites (GitHub recursion prevention),
# so the keeper is driven instead by:
#   * workflow_run on the two workflows that own the required status checks
#     completing successfully (pull_request-triggered, so not subject to the
#     Actions-suite suppression).
#   * schedule (every 15 min) as a safety net so a missed event still converges.
#   * workflow_dispatch for manual recovery.
# The merge uses a GitHub App installation token (not GITHUB_TOKEN) so the
# resulting push to main still triggers the downstream push workflows.
# Refs #1539, #696, #1137, #1352, #1363, #1401, #1437.

on:
  workflow_run:
    workflows: ["Verify PR", "Verify repository scripts"]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: tvna-bot-automerge
  cancel-in-progress: false

jobs:
  merge:
    name: Merge clean tvna-bot PRs
    # For workflow_run, gate on a successful run; the merge subcommand filters to
    # tvna-bot[bot] authors and clean PRs, so an unrelated success is a no-op.
    # schedule and workflow_dispatch carry no workflow_run payload, so allow them
    # through unconditionally.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: devcontainer-image-pins
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        # Persist the default token; the merge step authenticates with the App
        # token in GH_TOKEN, but checkout needs working credentials to fetch the
        # scripts.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Mint a short-lived GitHub App installation token so the merge's push to
      # main still triggers the downstream push workflows. Refs #1401.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DEVCONTAINER_PIN_APP_ID }}
          private-key: ${{ secrets.DEVCONTAINER_PIN_APP_PRIVATE_KEY }}

      - name: Merge clean tvna-bot PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/bot_pr_automerge.py merge
