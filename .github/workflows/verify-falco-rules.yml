name: Verify Falco rules

# Gate that validates .devcontainer/falco/custom-rules.yaml on every PR that
# touches it. Catches field-name typos (e.g. proc.exe vs proc.exepath) and
# missing required fields before review. Refs #1847, #1846.

on:
  pull_request:
    paths:
      - ".devcontainer/falco/**"
      - ".github/workflows/verify-falco-rules.yml"
      - "scripts/validate_falco_rules.py"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: "Verify Falco rules / gate"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and project environment
        uses: ./.github/actions/setup-uv

      - name: Validate Falco custom rules
        run: |
          uv run python scripts/validate_falco_rules.py verify \
            --file .devcontainer/falco/custom-rules.yaml
