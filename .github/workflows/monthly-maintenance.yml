name: Monthly maintenance

# Consolidated monthly-cadence maintenance (issue #1319). Currently hosts the
# MITRE ATT&CK coverage review reminder (#178), promoted from a quarterly to a
# monthly cadence per the consolidation request.
#
# Migrated from attack-coverage-review-reminder.yml -> job: remind.
# Thin orchestration: scripts/attack_review_reminder.py extracts the canonical
# template block from docs/runbooks/attack-coverage-review-cadence.md, verifies
# the H3 sections, and assembles the dated comment; scripts/post_issue_comment.py
# posts it on #178. Refs #184.
#
# Intentional semantic changes (documented per #1319):
#   - Cadence widened quarterly -> monthly (operator request). The old cron
#     "0 0 1-7 1,4,7,10 *" fired on days 1-7 of Jan/Apr/Jul/Oct and a job-level
#     gate filtered to Monday; the new cron fires once on the 1st of every month.
#   - The Monday-only gate is removed: with a fixed monthly day-of-month the
#     OR-semantics workaround it existed for no longer applies.
#   - Start time aligned to the weekly slot (20:00 UTC) per #1319.

on:
  schedule:
    # 20:00 UTC on the 1st of every month (aligned with the weekly slot).
    - cron: "0 20 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only (assemble template, do not post comment on #178).'
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: attack-coverage-review-reminder
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  RUNBOOK: docs/runbooks/attack-coverage-review-cadence.md
  TRACKING_ISSUE: "178"

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Assemble review reminder comment
        id: assemble
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          comment_path=/tmp/review-comment.md
          python3 scripts/attack_review_reminder.py assemble \
            --runbook "${RUNBOOK}" \
            --out "${comment_path}" \
            --summary-file "${GITHUB_STEP_SUMMARY}" \
            --repo "${REPO}" \
            --run-url "${RUN_URL}"
          echo "comment_path=${comment_path}" >> "$GITHUB_OUTPUT"

      - name: Post review reminder comment on tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          COMMENT_PATH: ${{ steps.assemble.outputs.comment_path }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            echo "[dry-run] Would post review reminder comment on ${REPO}#${TRACKING_ISSUE}."
            exit 0
          fi

          python3 scripts/post_issue_comment.py create \
            --issue-number "${TRACKING_ISSUE}" \
            --body-file "${COMMENT_PATH}"
          echo "Posted review reminder comment on ${REPO}#${TRACKING_ISSUE}."
