name: Monthly maintenance

# Consolidated monthly-cadence maintenance (issue #1319). Hosts the
# MITRE ATT&CK coverage review reminder (#178), promoted from a quarterly to a
# monthly cadence per the consolidation request, and the monthly GHCR
# devcontainer image prune (#1400, child of #696) that deletes old agent image
# versions left behind by the publish workflow.
#
# Migrated from attack-coverage-review-reminder.yml -> job: remind.
# Thin orchestration: scripts/attack_review_reminder.py extracts the canonical
# template block from docs/runbooks/attack-coverage-review-cadence.md, verifies
# the H3 sections, and assembles the dated comment; scripts/post_issue_comment.py
# posts it on #178. Refs #184.
#
# Intentional semantic changes (documented per #1319):
#   - Cadence widened quarterly -> monthly (operator request). The old cron
#     "0 0 1-7 1,4,7,10 *" fired on days 1-7 of Jan/Apr/Jul/Oct and a job-level
#     gate filtered to Monday; the new cron fires once on the 1st of every month.
#   - The Monday-only gate is removed: with a fixed monthly day-of-month the
#     OR-semantics workaround it existed for no longer applies.
#   - Start time aligned to the weekly slot (20:00 UTC) per #1319.

on:
  schedule:
    # 20:00 UTC on the 1st of every month (aligned with the weekly slot).
    - cron: "0 20 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only (assemble template, do not post comment on the security tracking issue).'
        type: boolean
        required: true
        default: true
      prune_dry_run:
        description: 'Devcontainer image prune: preview only (list candidates, do not delete).'
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: attack-coverage-review-reminder
  cancel-in-progress: false

# The reminder's target issue is resolved at runtime from
# .github/tracking-issues.toml (security-tracking anchor). Refs #1640.
env:
  REPO: ${{ github.repository }}
  RUNBOOK: docs/runbooks/attack-coverage-review-cadence.md

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assemble review reminder comment
        id: assemble
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          comment_path=/tmp/review-comment.md
          python3 scripts/attack_review_reminder.py assemble \
            --runbook "${RUNBOOK}" \
            --out "${comment_path}" \
            --summary-file "${GITHUB_STEP_SUMMARY}" \
            --repo "${REPO}" \
            --run-url "${RUN_URL}"
          echo "comment_path=${comment_path}" >> "$GITHUB_OUTPUT"

      - name: Post review reminder comment on tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          COMMENT_PATH: ${{ steps.assemble.outputs.comment_path }}
        run: |
          set -euo pipefail
          TRACKING_ISSUE="$(python3 scripts/issue_anchors.py get security-tracking)"
          if [ "${DRY_RUN}" = "true" ]; then
            echo "[dry-run] Would post review reminder comment on ${REPO}#${TRACKING_ISSUE}."
            exit 0
          fi

          python3 scripts/post_issue_comment.py create \
            --issue-number "${TRACKING_ISSUE}" \
            --body-file "${COMMENT_PATH}"
          echo "Posted review reminder comment on ${REPO}#${TRACKING_ISSUE}."

  # Monthly GHCR cleanup (#1400, child of #696). Each publish-devcontainer-images
  # run leaves a new commit-SHA image version (plus per-arch tags) per agent
  # package; they accumulate without bound. This job deletes old versions under a
  # count+age retention policy, always preserving main, buildcache-*, and the
  # currently pinned SHA. Deleting a user-owned container version needs a PAT with
  # read:packages + delete:packages (the GITHUB_TOKEN cannot: no packages:delete
  # permission, 403 from the delete endpoint) -- supplied as the GHCR_CLEANUP_TOKEN
  # Environment secret. The schedule deletes for real; workflow_dispatch previews
  # (dry-run) unless prune_dry_run is set to false. See docs/runbooks/devcontainers.md.
  prune-devcontainer-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: devcontainer-image-cleanup
    permissions:
      contents: read
    concurrency:
      group: prune-devcontainer-images
      cancel-in-progress: false
    env:
      OWNER: ${{ github.repository_owner }}
      KEEP_RECENT: "10"
      MIN_AGE_DAYS: "90"
    steps:
      - name: Guard GHCR_CLEANUP_TOKEN
        env:
          GHCR_CLEANUP_TOKEN: ${{ secrets.GHCR_CLEANUP_TOKEN }}
        run: |
          if [ -z "${GHCR_CLEANUP_TOKEN}" ]; then
            echo "::error::GHCR_CLEANUP_TOKEN secret is not set. See docs/runbooks/devcontainers.md section \"One-time setup for GHCR_CLEANUP_TOKEN\"."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prune old devcontainer image versions
        env:
          GH_TOKEN: ${{ secrets.GHCR_CLEANUP_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.prune_dry_run }}
        run: |
          set -euo pipefail
          python3 scripts/prune_devcontainer_images.py prune \
            --owner "${OWNER}" \
            --package claude-md-devcontainer-claude \
            --package claude-md-devcontainer-codex \
            --pinned-sha-from .devcontainer/claude/devcontainer.json \
            --pinned-sha-from .devcontainer/codex/devcontainer.json \
            --keep-recent "${KEEP_RECENT}" \
            --min-age-days "${MIN_AGE_DAYS}" \
            --dry-run "${DRY_RUN}" \
            --summary-file "${GITHUB_STEP_SUMMARY}"
