name: Refresh flake tool pins

# flake.nix is the single source of truth for the version + per-system SHA256
# of the GitHub-Releases-sourced tools (waza, apm). Dependabot has no Nix
# ecosystem, so these pins do not auto-follow upstream. This workflow closes
# that gap: weekly it checks each tool's latest release, holds anything still
# inside the [tool.uv].exclude-newer cooldown, recomputes the per-system SHA256
# with nix, bumps flake.nix, validates it, and opens a bump PR. Refs #1171.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC, after the dependabot window
  workflow_dispatch:

permissions: {}

concurrency:
  group: flake-pin-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Auto-follow ${{ matrix.tool }} flake pin
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: devcontainer-image-pins
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        tool: [waza, apm]
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Decide target version (cooldown-gated)
        id: decide
        run: |
          set -euo pipefail
          target="$(python3 scripts/flake_pin_latest.py check --tool '${{ matrix.tool }}')"
          if [ -z "$target" ]; then
            echo "No adoptable update for ${{ matrix.tool }} (none newer, or within cooldown)."
          else
            echo "Adoptable target for ${{ matrix.tool }}: $target"
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Recompute per-system hashes and bump flake.nix
        if: steps.decide.outputs.target != ''
        run: |
          set -euo pipefail
          tool='${{ matrix.tool }}'
          target='${{ steps.decide.outputs.target }}'
          hash_args=()
          for sys in x86_64-linux aarch64-linux; do
            url="$(python3 scripts/flake_pin.py asset-url --tool "$tool" --system "$sys" --version "$target")"
            echo "Prefetching $sys asset: $url"
            sri="$(nix store prefetch-file --json "$url" | python3 -c 'import json,sys; print(json.load(sys.stdin)["hash"])')"
            hash_args+=(--hash "$sys=$sri")
          done
          python3 scripts/flake_pin.py bump --tool "$tool" --version "$target" "${hash_args[@]}"

      - name: Validate the bumped flake
        if: steps.decide.outputs.target != ''
        run: nix flake check --show-trace

      - name: Open bump PR
        if: steps.decide.outputs.target != ''
        env:
          GH_TOKEN: ${{ secrets.DEVCONTAINER_PIN_PR_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tool='${{ matrix.tool }}'
          target='${{ steps.decide.outputs.target }}'
          python3 scripts/devcontainer_pin_pr.py open \
            --github-sha "${tool}-${target}" \
            --branch-prefix "flake-pin-" \
            --base main \
            --title "chore(flake): bump ${tool} pin to ${target}" \
            --commit-subject "chore(flake): bump ${tool} pin to ${target}" \
            --commit-trailer "Refs #1171" \
            --template .github/pr-body-templates/flake-pin.md \
            --file flake.nix
