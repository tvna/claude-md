name: Verify APM portability

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-apm-portability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: "Verify APM portability / verify"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Scan APM artifacts for repo-local references
        run: |
          python3 scripts/scan_apm_portability.py verify \
            --path .apm/instructions/master.instructions.md \
            --path CLAUDE.md \
            --path AGENTS.md
