name: Verify design philosophy doc

on:
  pull_request:
    paths:
      - ".apm/instructions/master.instructions.md"
      - "docs/agent-rules-design-philosophy.md"
      - "scripts/scan_design_philosophy_drift.py"
      - ".github/workflows/verify-design-philosophy.yml"

permissions:
  contents: read

concurrency:
  group: verify-design-philosophy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Scan design-philosophy doc for drift against APM master
        run: |
          python3 scripts/scan_design_philosophy_drift.py verify \
            --master .apm/instructions/master.instructions.md \
            --doc docs/agent-rules-design-philosophy.md
