name: Verify design philosophy doc

on:
  pull_request:
  # merge_group lets the required "Verify design philosophy doc / verify"
  # check resolve on the queued integration ref (GitHub Merge Queue, issue
  # #895). The job is a static working-tree check with no pull_request
  # payload dependency, so it runs unchanged on merge_group.
  merge_group:

permissions:
  contents: read

concurrency:
  group: verify-design-philosophy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: "Verify design philosophy doc / verify"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Scan design-philosophy doc for drift against APM master
        run: |
          python3 scripts/scan_design_philosophy_drift.py verify \
            --master .apm/instructions/master.instructions.md \
            --doc docs/prd/agent-rules-design-philosophy.md
