name: Verify agent instructions

on:
  pull_request:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - name: Detect relevant changes
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=50
          if git diff --name-only "origin/$BASE_REF...HEAD" \
            | grep -Eq '^(\.apm/|apm\.yml$|pyproject\.toml$|uv\.lock$|CLAUDE\.md$|AGENTS\.md$|\.github/workflows/(generate-agents|verify-agents)\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No APM-relevant changes; skipping drift verification."
          fi

  verify:
    needs: detect
    if: needs.detect.outputs.relevant == 'true'
    uses: ./.github/workflows/generate-agents.yml
    with:
      mode: verify
    permissions:
      contents: write
      pull-requests: write

  gate:
    needs: [detect, verify, lint-scripts]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate verification result
        env:
          RELEVANT: ${{ needs.detect.outputs.relevant }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          if [ "$RELEVANT" != 'true' ]; then
            echo "No APM-relevant changes; verification skipped (success)."
            exit 0
          fi
          if [ "$VERIFY_RESULT" = 'success' ]; then
            echo "APM drift verification passed."
            exit 0
          fi
          echo "::error::APM drift verification result=${VERIFY_RESULT} (expected 'success')."
          exit 1

  lint-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6.0.0
        with:
          enable-cache: true
      - name: Run script tests
        run: uv run --group dev pytest tests/test_labels_apply.py tests/test_github_api.py -v
