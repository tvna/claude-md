name: Verify repository scripts

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-scripts-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up uv and project environment
        uses: ./.github/actions/setup-uv

      - name: Run ruff lint gate
        run: uv run ruff check scripts tests

      - name: Run mypy type gate
        run: uv run mypy scripts tests

      - name: Assert uv pin lives only in pyproject.toml
        run: uv run python scripts/uv_pin.py drift

      - name: Assert running uv matches the pin
        # Refs #1207. PR #1206 closed the *static* drift gap but left a runtime
        # gap: the host uv that runs Stop hooks could still drift ahead of the
        # pin without any deterministic gate firing. This step is that gate.
        run: uv run python scripts/preflight_uv_version.py verify

      - name: Assert nixpkgs lock respects uv cooldown
        run: uv run python scripts/nixpkgs_cooldown.py verify

      - name: Assert workflows install Python deps via uv only
        run: uv run python scripts/scan_workflow_pip.py verify

      - name: Assert workflows pin actions to SHA + tag comment
        run: uv run python scripts/scan_workflow_action_pins.py verify

      - name: Assert no unallowlisted gh CLI calls in workflows
        run: uv run python scripts/scan_workflow_gh_calls.py verify

      - name: Assert no untrusted context in workflow run blocks
        # Refs #1129: untrusted GitHub contexts (github.event.*,
        # github.head_ref, github.head_commit) must not be interpolated
        # directly into run: shell bodies; route them through env: instead.
        run: uv run python scripts/scan_workflow_injection.py verify

      - name: Assert no git push (unsigned authoring) in workflow run blocks
        # Refs #1437/#1466: a `git push` in a workflow run block authors an
        # unsigned commit as github-actions[bot]. Bot-generated PR commits must
        # use the signed App-bot createCommitOnBranch path (pr_upsert.py
        # upsert-files); this gate is the regression guard against git push.
        run: uv run python scripts/scan_workflow_unsigned_commit.py verify

      - name: Assert workflow secrets have concrete runbooks
        run: uv run python scripts/scan_secret_runbooks.py verify

      - name: Assert no hardcoded secrets in tracked non-Python files
        # Refs #1129: ruff's S family covers *.py; this closes the gap for
        # JSON/YAML/shell/TOML/workflow files with high-confidence rules.
        run: uv run python scripts/scan_secrets.py verify

      - name: Assert local Markdown links resolve
        run: uv run python scripts/scan_markdown_links.py verify

      - name: Assert docs index and lane placement
        run: uv run python scripts/scan_docs_inventory.py verify

      - name: Assert docs cite existing workflow files
        # Refs #1325: fails when a Markdown doc outside docs/archive/ cites a
        # .github/workflows/<name>.yml path that no longer exists -- the drift
        # class #1319's workflow consolidation left behind. Path form only;
        # bare filenames are repaired by hand and not gated.
        run: uv run python scripts/scan_doc_workflow_refs.py verify

      - name: Assert script maintainability metrics
        run: uv run python scripts/scan_maintainability_metrics.py verify

      - name: Verify preflight set matches CI script invocations
        # Refs #493: fails when a pull_request: workflow gains a
        # `python3 scripts/<name>.py` call without a matching step in
        # `scripts/preflight_all.py`. See docs/runbooks/preflight.md.
        run: uv run python scripts/scan_preflight_drift.py verify

      - name: Verify workflow-script input contracts
        # Refs #1087: every workflow-called script must declare a Contract:
        # docstring block (Inputs / Outputs / Failure policy loud|open),
        # enforcing M4 (boundary validation) and M9 (fail policy)
        # deterministically. Baseline debt in the script's
        # BASELINE_MISSING_CONTRACT must shrink, never grow.
        run: uv run python scripts/scan_input_contract_drift.py verify

      - name: Verify quality-standard enforcement map
        # Refs #1089: every M1-M10 must-have in
        # docs/standards/workflow-script-quality.md has a registry entry,
        # and every `enforced`/`partial` row resolves its backing gate.
        run: uv run python scripts/scan_quality_standard_drift.py verify

      - name: Verify section 2/4 safety enumerations stay non-exhaustive
        # Refs #1241/#1242/#1243 (and #1239, #178 criterion b): the
        # destructive-operation, untrusted-data, and adversarial-payload
        # enumerations in master.instructions.md must keep their
        # non-exhaustive marker so a later edit cannot quietly re-close the
        # list and reintroduce the enumeration-gap class.
        run: uv run python scripts/scan_nonexhaustive_invariant_drift.py verify

      - name: Verify scripts ship required tests
        # Refs #1088: fails when a scripts/*.py lacks its matching test module
        # (M2), when a new GitHub-API script is absent from the boundary
        # registry (O6, #194), or when a workflow-invoked script has no CLI
        # contract test (M3, #189). Sustains #189/#194 as a continuous gate.
        run: uv run python scripts/scan_test_presence_drift.py verify

      - name: Verify tracking-issue anchors stay declarative
        # Refs #1640: fails when a workflow, PR-body template, or script
        # constant hardcodes a tracking-issue number instead of resolving it
        # through .github/tracking-issues.toml via the issue_anchors resolver,
        # so an umbrella-issue renumbering stays a one-file diff.
        run: uv run python scripts/scan_issue_anchor_drift.py verify

      - name: Verify Claude/Codex hook coverage parity
        # Refs #615: fails when a Claude hook script is absent from Codex
        # coverage and is not in the explicit allowlist.
        run: uv run python scripts/scan_hook_coverage_drift.py verify

      - name: Verify devcontainer provisions gate-required tools
        # Refs #1103: fails when a tool a gate needs at runtime (a
        # preflight_all.py Step required_bin) is not provisioned in flake.nix,
        # so the devcontainer cannot silently lack a tool the gates depend on.
        run: uv run python scripts/scan_devcontainer_tool_drift.py verify

      - name: Verify devcontainer egress hosts carry a triage rationale
        # Refs #1170: fails when a .devcontainer/network/*.allowlist host has
        # no inline triage rationale, so a new outbound destination cannot be
        # admitted without the observe/evaluate/decide record in
        # docs/runbooks/devcontainer-tool-network-triage.md.
        run: uv run python scripts/scan_allowlist_rationale.py verify

      - name: Verify devcontainer allowlist parser parity
        # Refs #1257: fails when the bash read_allowlist in
        # .devcontainer/scripts/_egress-lib.sh and scripts/_allowlist.py
        # resolve_hosts disagree on a *.allowlist file, so the single source of
        # truth stays single across the container start path and the CI tooling.
        run: uv run python scripts/scan_allowlist_parser_parity.py verify

      - name: Verify flake.nix is the single source of truth for pinned hashes
        # Refs #1153: fails when a pinned binary's flake.nix SHA256 is hardcoded
        # under scripts/ or .github/workflows/, so a tool bump cannot leave a
        # stale hardcoded copy that diverges from the flake.
        run: uv run python scripts/scan_flake_pin_drift.py verify

      - name: Verify no tool is compiled from source on the CI surface
        # Refs #1154: fails when go/cargo install compiles a tool instead of
        # fetching a pinned prebuilt (the ~138s #1150 regression class); a
        # deliberate backstop is acked inline with a rationale.
        run: uv run python scripts/scan_compile_from_source.py verify

      - name: Verify shared-binary provisioning hooks are serial
        # Refs #1155: fails when a pre-commit hook that runs an install_*.sh
        # provisioner is not require_serial, so prek cannot race parallel
        # copies on the shared binary path (the #1150 PermissionError class).
        run: uv run python scripts/scan_provisioning_hook_serial.py verify

      - name: Verify SessionStart PATH persistence stays centralized
        # Refs #1230: fails when a scripts/*.sh writes $CLAUDE_ENV_FILE directly
        # instead of using persist_session_path from scripts/_session_path.sh,
        # which would re-create the duplication that refactor removed.
        run: uv run python scripts/scan_session_path_drift.py verify

      - name: Verify test shard markers
        # Refs #545: each tests/test_*.py must declare exactly one
        # module-scope shard marker so the lint-scripts-pytest matrix
        # neither skips nor double-counts a file. Running this before the
        # matrix surfaces marker drift with a clear diagnostic instead of
        # a silent missing node ID in the gate's JUnit aggregation.
        run: uv run python scripts/verify_test_shard_markers.py

      - name: Verify security control families meet the auto-file floor
        # Refs #178: every scheduled control family in
        # .github/security-control-floor.toml must sit at the detect-and-file
        # floor (auto-files a per-family issue on drift) unless it carries an
        # explicit exempt_reason, so a new family cannot land below the floor
        # on reviewer memory alone.
        run: uv run python scripts/verify_security_control_floor.py

      - name: Verify security-control inventory is current with the tree
        # Refs #1387: the inventory (docs/prd/security-control-inventory.md)
        # must stay current. A surface that crosses a secret/privilege boundary
        # (a workflow using a non-GITHUB_TOKEN secret or declaring an
        # environment, or a script importing _secret_patterns) must be declared
        # in .github/security-surface-inventory.toml, and the document must not
        # cite a scripts/ path that no longer exists, so a new privileged
        # surface cannot land on reviewer memory alone.
        run: uv run python scripts/verify_control_inventory_currency.py verify

      - name: Warn if uv pin trails upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/uv_pin.py stale

  lint-scripts-pytest:
    # Refs #545: marker-bucketed matrix. Each leg runs a disjoint subset
    # of tests/ filtered by `pytest -m shard_<bucket>`. The completeness
    # job `lint-scripts-pytest-gate` aggregates the per-leg JUnit
    # artifacts and asserts the union equals the universe collected by
    # `pytest --collect-only` (no test left unrun, no test double-counted).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [
          preflight,
          policy,
          ci_ops,
          ci_ops_2,
          ci_ops_auto_retro_append,
          ci_ops_auto_retro_create,
          ci_ops_auto_retro_create_slow,
          ci_ops_auto_retro_decision_tree,
          ci_ops_auto_retro_signals,
          ci_ops_auto_retro_skips,
          ci_ops_auto_retro_rescan,
          default,
        ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up uv and project environment
        uses: ./.github/actions/setup-uv

      - name: Run script unit tests for shard ${{ matrix.shard }}
        # Coverage instrumentation runs only on push to main (see
        # .github/workflows/post-merge.yml and #462) so PR runs stay fast.
        # Developers must run `uv run python -m pytest --cov` locally
        # before push when coverage may have shifted.
        # --junitxml feeds Codecov Test Analytics (#469); junit_family=legacy
        # is the format Codecov recommends. Codecov upload is deferred to
        # the aggregate gate so each PR run uploads a single bundle, not
        # one per shard.
        run: |
          uv run python -m pytest \
            -m "shard_${{ matrix.shard }}" \
            -v \
            --junitxml=junit-${{ matrix.shard }}.xml \
            -o junit_family=legacy

      - name: Upload shard JUnit artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-${{ matrix.shard }}
          path: junit-${{ matrix.shard }}.xml
          if-no-files-found: error
          retention-days: 7

  lint-scripts-pytest-gate:
    # Refs #545: completeness gate. Runs once after every matrix leg
    # finishes (success or failure), enumerates the collected test
    # universe, downloads each leg's JUnit artifact, and asserts the
    # union of executed node IDs equals the universe with no duplicates.
    # Codecov Test Analytics upload happens here (single OIDC point) so
    # the per-leg jobs do not each need id-token: write.
    needs: lint-scripts-pytest
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write  # required for codecov/test-results-action OIDC (tokenless, public repo); see #469
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up uv and project environment
        uses: ./.github/actions/setup-uv

      - name: Assert every matrix leg succeeded
        # Fail the gate when any shard failed. ``needs.<id>.result`` is
        # ``success`` only when every matrix leg passed; any other value
        # (failure, cancelled, skipped) means a leg did not run cleanly.
        env:
          MATRIX_RESULT: ${{ needs.lint-scripts-pytest.result }}
        run: |
          if [ "$MATRIX_RESULT" != 'success' ]; then
            echo "::error::lint-scripts-pytest matrix result=${MATRIX_RESULT} (expected 'success'). One or more shards failed; see the matrix legs above."
            exit 1
          fi

      - name: Download all shard JUnit artifacts
        # Runs even when "Assert every matrix leg succeeded" failed so the
        # Codecov upload below has per-shard JUnit XML to record in Test
        # Analytics failure history (#556).
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: junit-*
          path: junit-artifacts
          merge-multiple: true

      - name: Collect full test universe
        # Runs once on the full tests/ directory; `--collect-only -q`
        # prints one node ID per line followed by a summary tail.
        # `verify_shard_coverage.py` ignores the tail.
        run: |
          uv run python -m pytest --collect-only -q > collected.txt

      - name: Verify shard coverage (union == universe, no duplicates)
        run: |
          uv run python scripts/verify_shard_coverage.py \
            --collected collected.txt \
            --junit junit-artifacts/junit-*.xml

      - name: Upload test results to Codecov
        # Runs even when an earlier step in this gate failed so failed
        # runs are still recorded in Test Analytics flake / failure
        # history (#469). All shard JUnit files are uploaded together.
        if: always()
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          files: ./junit-artifacts/junit-preflight.xml,./junit-artifacts/junit-policy.xml,./junit-artifacts/junit-ci_ops.xml,./junit-artifacts/junit-ci_ops_2.xml,./junit-artifacts/junit-ci_ops_auto_retro_append.xml,./junit-artifacts/junit-ci_ops_auto_retro_create.xml,./junit-artifacts/junit-ci_ops_auto_retro_create_slow.xml,./junit-artifacts/junit-ci_ops_auto_retro_decision_tree.xml,./junit-artifacts/junit-ci_ops_auto_retro_signals.xml,./junit-artifacts/junit-ci_ops_auto_retro_skips.xml,./junit-artifacts/junit-ci_ops_auto_retro_rescan.xml,./junit-artifacts/junit-default.xml
          disable_search: true
          fail_ci_if_error: false
          use_oidc: true

  egress-firewall-selftest:
    # Refs #1257 (PR5): isolated self-test of the custom egress-firewall
    # composite action in BLOCK mode (deny-by-default). PR4 ran this job in
    # audit (log-only) first; the audit selftest's only post-apply egress was
    # to allowlisted github.com, so no required destination was missing. PR5
    # promotes it to block and proves BOTH directions: github.com is allowed by
    # FQDN OR by the exact IP pre-resolved for this assertion, and a
    # non-allowlisted host (example.com) is dropped. Still deliberately NOT a
    # step in lint-scripts-static and NOT wired into the required `gate`
    # aggregation below: this exercises the egress layer in isolation, so a
    # runner-specific network quirk must never block unrelated work. The action
    # reuses .devcontainer/scripts/_egress-lib.sh via the dispatcher, so CI and
    # the container start path share one parser (parity-gated).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Pre-resolve test IPs before the firewall applies
        run: |
          set -euo pipefail
          # Resolve BEFORE any egress rule exists so the block-mode assertion
          # drives curl with --resolve + -4 and never depends on the runner's
          # resolver egress -- which block mode also constrains. (The
          # devcontainer DNS proxy handles in-container resolution separately;
          # CI has no proxy, so we sidestep DNS plumbing and test the iptables
          # allowlist layer in isolation.)
          allow_host="github.com"
          deny_host="example.com"
          allow_ip="$(getent ahostsv4 "$allow_host" | awk 'NR==1{print $1}')"
          deny_ip="$(getent ahostsv4 "$deny_host" | awk 'NR==1{print $1}')"
          if [[ -z "$allow_ip" || -z "$deny_ip" ]]; then
            echo "::error::pre-resolve failed ($allow_host=$allow_ip $deny_host=$deny_ip)"
            exit 1
          fi
          selftest_allowlist=".devcontainer/network/egress-selftest.allowlist"
          {
            printf '%s\n' '@include shared.allowlist'
            printf '%s\n' "${allow_ip}  # Selftest-only IP pin for $allow_host; ORs with the FQDN entry above."
          } > "$selftest_allowlist"
          {
            echo "ALLOW_HOST=$allow_host"
            echo "ALLOW_IP=$allow_ip"
            echo "DENY_HOST=$deny_host"
            echo "DENY_IP=$deny_ip"
          } >> "$GITHUB_ENV"
          echo "pre-resolved $allow_host=$allow_ip $deny_host=$deny_ip"

      - name: Apply egress allowlist in block mode
        uses: ./.github/actions/egress-firewall
        with:
          mode: block
          allowlist: .devcontainer/network/egress-selftest.allowlist

      - name: Assert block denies non-allowlisted and permits allowlisted egress
        env:
          ALLOW_HOST: ${{ env.ALLOW_HOST }}
          ALLOW_IP: ${{ env.ALLOW_IP }}
          DENY_HOST: ${{ env.DENY_HOST }}
          DENY_IP: ${{ env.DENY_IP }}
        run: |
          set -euo pipefail
          # Capture into a variable (not `sudo ... > file`, which would redirect
          # as the unprivileged user -- shellcheck SC2024).
          rules="$(sudo iptables -S OUTPUT)"
          echo "OUTPUT chain:"
          printf '%s\n' "$rules"
          if ! grep -qE '^-P OUTPUT DROP' <<<"$rules"; then
            echo "::error::OUTPUT policy is not DROP in block mode"
            exit 1
          fi
          # github.com is allowed by the FQDN entry from shared.allowlist OR by
          # the selftest-only IP pin written above.  The --resolve assertion uses
          # the pre-resolved IP deliberately; if github.com's DNS answer rotates
          # between the pre-resolve step and the action's FQDN resolution, the
          # explicit IP allow still keeps the positive assertion deterministic.
          if ! curl -4 -sfI --resolve "${ALLOW_HOST}:443:${ALLOW_IP}" \
                 --connect-timeout 10 --max-time 25 "https://${ALLOW_HOST}" >/dev/null; then
            echo "::error::allowlisted egress to ${ALLOW_HOST} (${ALLOW_IP}) blocked under block mode"
            exit 1
          fi
          # Non-allowlisted example.com must be dropped: the connect cannot
          # complete, so curl exits non-zero. A success here means block failed.
          if curl -4 -s -o /dev/null --resolve "${DENY_HOST}:443:${DENY_IP}" \
                 --connect-timeout 5 --max-time 8 "https://${DENY_HOST}"; then
            echo "::error::non-allowlisted egress to ${DENY_HOST} (${DENY_IP}) was NOT blocked"
            exit 1
          fi
          echo "egress-firewall block selftest passed: policy DROP, ${ALLOW_HOST} OK, ${DENY_HOST} dropped."

      - name: Restore OUTPUT policy (contain blast radius)
        if: always()
        run: |
          # Block mode set OUTPUT policy DROP for ALL processes on the runner,
          # including the Actions runner agent. Restore ACCEPT and flush so the
          # job's own completion/telemetry and later steps are never impaired by
          # this isolated self-test. Best-effort: never fail the job here.
          sudo iptables -P OUTPUT ACCEPT || true
          sudo iptables -F OUTPUT || true

  gate:
    name: "Verify repository scripts / gate"
    # Refs #545: depends on `lint-scripts-pytest-gate` (the marker-matrix
    # completeness gate) rather than the matrix job directly so the
    # aggregate result reflects both "every shard passed" and "the union
    # of executed tests covered the collected universe".
    needs: [lint-scripts-static, lint-scripts-pytest-gate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Aggregate verification result
        env:
          LINT_STATIC_RESULT: ${{ needs.lint-scripts-static.result }}
          LINT_PYTEST_RESULT: ${{ needs.lint-scripts-pytest-gate.result }}
        run: |
          if [ "$LINT_STATIC_RESULT" != 'success' ]; then
            echo "::error::script lint static gate result=${LINT_STATIC_RESULT} (expected 'success')."
            exit 1
          fi
          if [ "$LINT_PYTEST_RESULT" != 'success' ]; then
            echo "::error::script lint pytest gate result=${LINT_PYTEST_RESULT} (expected 'success')."
            exit 1
          fi
          echo "Script lint static + pytest gates passed."

  legacy-agent-instructions-context:
    name: "Verify agent instructions / gate"
    needs: gate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mirror repository scripts result for live ruleset migration
        env:
          GATE_RESULT: ${{ needs.gate.result }}
        run: |
          if [ "$GATE_RESULT" != 'success' ]; then
            echo "::error::Verify repository scripts / gate result=${GATE_RESULT} (expected 'success')."
            exit 1
          fi
          echo "Verify repository scripts / gate passed."
