name: Verify agent instructions

on:
  pull_request:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Detect relevant changes
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=50
          if git diff --name-only "origin/$BASE_REF...HEAD" \
            | grep -Eq '^(\.apm/|apm\.yml$|pyproject\.toml$|uv\.lock$|CLAUDE\.md$|AGENTS\.md$|\.github/workflows/(generate-agents|verify-agents)\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No APM-relevant changes; skipping drift verification."
          fi

  verify:
    needs: detect
    if: needs.detect.outputs.relevant == 'true'
    uses: ./.github/workflows/generate-agents.yml
    with:
      mode: verify
    permissions:
      contents: write
      pull-requests: write

  lint-uv-pin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Assert uv pin lives only in pyproject.toml
        run: |
          set -euo pipefail
          PIN="$(python3 -c '
          import tomllib
          v = tomllib.load(open("pyproject.toml","rb"))["tool"]["uv"]["required-version"]
          print(v.lstrip("="))
          ')"
          echo "uv pin from pyproject.toml: ${PIN}"

          # (1) Literal-value check: the exact pin must not appear as a fixed
          # string anywhere outside pyproject.toml. Using a fixed-string match
          # against the resolved pin avoids false positives on APM_CLI_VERSION
          # ("0.12.1") and action version-comments ("v5.0.1").
          if grep -rFn -- "${PIN}" .github/ scripts/ docs/ 2>/dev/null; then
            echo "::error::uv pin literal ${PIN} appears outside pyproject.toml. Update pyproject.toml and let CI / scripts/install-uv.sh consume it."
            exit 1
          fi

          # (2) Symbol check (top-level workflow env): UV_VERSION as a top-level
          # `env:` value is forbidden — it must be sourced from a step output.
          if grep -rEn '^\s*UV_VERSION\s*:\s*"' .github/workflows/ 2>/dev/null; then
            echo "::error::Top-level UV_VERSION literal in workflow env: forbidden. Source it from steps.uvpin.outputs.version instead."
            exit 1
          fi

          # (3) Symbol check (docs): UV_VERSION must not appear in docs at all.
          if grep -rEn '\bUV_VERSION\b' docs/ 2>/dev/null; then
            echo "::error::UV_VERSION symbol found in docs/. Reference [tool.uv].required-version instead."
            exit 1
          fi

          echo "OK: no uv pin drift detected."

      - name: Warn if uv pin trails upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PIN="$(python3 -c '
          import tomllib
          v = tomllib.load(open("pyproject.toml","rb"))["tool"]["uv"]["required-version"]
          print(v.lstrip("="))
          ')"
          LATEST="$(gh release view --repo astral-sh/uv --json tagName --jq .tagName || echo '')"
          if [ -z "${LATEST}" ]; then
            echo "::warning::could not fetch latest astral-sh/uv release; staleness check skipped"
            exit 0
          fi
          if [ "${PIN}" != "${LATEST}" ]; then
            echo "::warning::uv pin (${PIN}) trails upstream latest (${LATEST}). Bump [tool.uv].required-version in pyproject.toml."
          else
            echo "uv pin matches upstream latest (${PIN})."
          fi

  gate:
    needs: [detect, verify, lint-uv-pin]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate verification result
        env:
          RELEVANT: ${{ needs.detect.outputs.relevant }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          LINT_RESULT: ${{ needs.lint-uv-pin.result }}
        run: |
          if [ "$LINT_RESULT" != 'success' ]; then
            echo "::error::uv pin drift gate result=${LINT_RESULT} (expected 'success')."
            exit 1
          fi
          if [ "$RELEVANT" != 'true' ]; then
            echo "No APM-relevant changes; APM verification skipped (success). uv pin drift gate passed."
            exit 0
          fi
          if [ "$VERIFY_RESULT" = 'success' ]; then
            echo "APM drift verification passed. uv pin drift gate passed."
            exit 0
          fi
          echo "::error::APM drift verification result=${VERIFY_RESULT} (expected 'success')."
          exit 1
