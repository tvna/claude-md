name: Auto-open retrospective issue on merge

# All logic lives in scripts/auto_retro.py and is unit-tested in
# tests/test_auto_retro.py. The workflow only marshals env vars and
# shells out to the single Python entry point. Implements CLAUDE.md
# section 3 ("After each merge, auto-open a retrospective issue").
# Refs #234.

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  # Idempotency in the script is the authoritative defence against
  # duplicate retro issues; this group only prevents two simultaneous
  # invocations for the same PR from racing the search check.
  group: auto-retro-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  open-retro:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Open retrospective issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 scripts/auto_retro.py run
