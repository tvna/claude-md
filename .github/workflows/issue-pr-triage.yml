name: Issue and PR triage

on:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened]
  pull_request_target:
    types: [opened, edited, synchronize, labeled, unlabeled, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.actor != 'github-actions[bot]' &&
      (
        (github.event_name == 'issues' &&
          contains(fromJSON('["opened","edited","reopened"]'), github.event.action)) ||
        (github.event_name == 'pull_request_target' &&
          contains(fromJSON('["opened","edited","reopened"]'), github.event.action)) ||
        github.event_name == 'issue_comment' ||
        github.event_name == 'pull_request_review_comment'
      )
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Scan and act on non-ASCII content
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/scan_non_ascii.py run

  triage:
    if: >-
      github.event_name == 'issues' ||
      (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
      LABELS_JSON: ${{ toJSON(github.event.issue.labels || github.event.pull_request.labels) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Classify threat intelligence need
        id: triage
        run: |
          labels="$(printf '%s' "$LABELS_JSON" | jq -r '(. // []) | map(.name // "") | join(",")')"
          python3 scripts/threat_intel_triage.py scan \
            --repo-root . \
            --labels "$labels" \
            --ghsa-live \
            --malpkg-live \
            --epss-live \
            --github-output "$GITHUB_OUTPUT" \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --comment-file "$RUNNER_TEMP/triage-comment.md"

      - name: Apply threat labels
        if: steps.triage.outputs.recommended_labels != ''
        env:
          ADD_LABELS: ${{ steps.triage.outputs.recommended_labels }}
        run: python3 scripts/threat_intel_triage.py apply-labels --add-labels "$ADD_LABELS"

      - name: Remove stale threat labels
        if: steps.triage.outputs.remove_labels != ''
        env:
          REMOVE_LABELS: ${{ steps.triage.outputs.remove_labels }}
        run: python3 scripts/threat_intel_triage.py apply-labels --remove-labels "$REMOVE_LABELS"

      # Co-locate the correlation table with the label so a third party can
      # explain the triage by inspecting the issue/PR alone (CLAUDE.md s6).
      # Idempotent: one marker-anchored comment per item. When no findings
      # fired, --update-only refreshes an existing comment to the cleared
      # state but never creates noise on a clean item. Bot comments do not
      # re-trigger this workflow (the scan job excludes github-actions[bot];
      # the triage job runs only on issues/pull_request_target).
      - name: Publish triage evidence comment
        env:
          RECOMMENDED_LABELS: ${{ steps.triage.outputs.recommended_labels }}
        run: |
          if [ -z "$RECOMMENDED_LABELS" ]; then
            python3 scripts/threat_intel_triage.py comment \
              --body-file "$RUNNER_TEMP/triage-comment.md" \
              --update-only
          else
            python3 scripts/threat_intel_triage.py comment \
              --body-file "$RUNNER_TEMP/triage-comment.md"
          fi

  dependabot-author:
    if: >-
      github.event_name == 'pull_request_target' &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Verify dependabot/* PR author is a trusted bot
        run: |
          python3 scripts/verify_dependabot_author.py verify \
            --head-ref "$HEAD_REF" \
            --author "$AUTHOR"
