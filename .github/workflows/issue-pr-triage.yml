name: Issue and PR triage

on:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened]
  pull_request_target:
    types: [opened, edited, synchronize, labeled, unlabeled, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    if: >-
      github.actor != 'github-actions[bot]' &&
      (
        (github.event_name == 'issues' &&
          contains(fromJSON('["opened","edited","reopened"]'), github.event.action)) ||
        (github.event_name == 'pull_request_target' &&
          contains(fromJSON('["opened","edited","reopened"]'), github.event.action)) ||
        github.event_name == 'issue_comment' ||
        github.event_name == 'pull_request_review_comment'
      )
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Scan and act on non-ASCII content
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/scan_non_ascii.py run

  triage:
    if: >-
      github.event_name == 'issues' ||
      (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
      LABELS_JSON: ${{ toJSON(github.event.issue.labels || github.event.pull_request.labels) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Classify threat intelligence need
        id: triage
        run: |
          labels="$(printf '%s' "$LABELS_JSON" | jq -r '(. // []) | map(.name // "") | join(",")')"
          python3 scripts/threat_intel_triage.py scan \
            --repo-root . \
            --labels "$labels" \
            --ghsa-live \
            --malpkg-live \
            --epss-live \
            --github-output "$GITHUB_OUTPUT" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Apply threat labels
        if: steps.triage.outputs.recommended_labels != ''
        run: gh issue edit "$NUMBER" --repo "$REPO" --add-label "${{ steps.triage.outputs.recommended_labels }}"

      - name: Remove stale threat labels
        if: steps.triage.outputs.remove_labels != ''
        run: gh issue edit "$NUMBER" --repo "$REPO" --remove-label "${{ steps.triage.outputs.remove_labels }}"
