name: Issue and PR triage

on:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened]
  pull_request_target:
    types: [opened, edited, synchronize, labeled, unlabeled, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.actor != 'github-actions[bot]' &&
      (
        (github.event_name == 'issues' &&
          contains(fromJSON('["opened","edited","reopened"]'), github.event.action)) ||
        (github.event_name == 'pull_request_target' &&
          contains(fromJSON('["opened","edited","reopened"]'), github.event.action)) ||
        github.event_name == 'issue_comment' ||
        github.event_name == 'pull_request_review_comment'
      )
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Scan and act on non-ASCII content
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/scan_non_ascii.py run

  # Per-item threat:* labelling and evidence comments were retired in #1645:
  # threat findings are repository-global, so they are aggregated weekly onto
  # the #178 security umbrella by the `dependency-threat-triage` job in
  # `.github/workflows/weekly-maintenance.yml` instead of being stamped onto
  # whatever issue/PR happened to trigger a run.

  dependabot-author:
    if: >-
      github.event_name == 'pull_request_target' &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Verify dependabot/* PR author is a trusted bot
        run: |
          python3 scripts/verify_dependabot_author.py verify \
            --head-ref "$HEAD_REF" \
            --author "$AUTHOR"
