name: Apply labels

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan only (diff + intent, no live changes)'
        type: boolean
        required: true
        default: true
      prune:
        description: 'Also DELETE labels present on GitHub but absent from SoT (destructive on existing issues)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.LABELS_PAT }}
  REPO: ${{ github.repository }}

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: labels-apply
    steps:
      - name: Guard dispatch ref
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::apply-labels must be dispatched against main (got ${{ github.ref }})."
          exit 1

      - name: Guard LABELS_PAT
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::LABELS_PAT secret is not set. See issue #87 for the planned runbook update."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate labels.json JSON syntax
        run: |
          set -euo pipefail
          if ! jq empty < .github/labels.json; then
            echo "::error file=.github/labels.json::Invalid JSON syntax."
            exit 1
          fi

      - name: Skeleton placeholder (full reconcile lands in #87)
        run: |
          set -euo pipefail
          N=$(jq 'length' .github/labels.json)
          echo "skeleton: would reconcile ${N} entries; full logic tracked in #87"
