name: Apply labels

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan only (diff + intent, no live changes)'
        type: boolean
        required: true
        default: true
      prune:
        description: 'Also DELETE labels present on GitHub but absent from SoT (destructive on existing issues)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.LABELS_PAT }}
  REPO: ${{ github.repository }}

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: labels-apply
    steps:
      - name: Guard dispatch ref
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::apply-labels must be dispatched against main (got ${{ github.ref }})."
          exit 1

      - name: Guard LABELS_PAT
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::LABELS_PAT secret is not set. See docs/runbooks/issue-triage.md §\"Required secret\"."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate labels.json
        run: |
          set -euo pipefail
          python3 scripts/labels_apply.py validate --sot .github/labels.json

      - name: Plan and apply labels
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_PRUNE: ${{ inputs.prune }}
        run: |
          set -euo pipefail
          COMMAND="apply"
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            COMMAND="plan"
          fi
          python3 scripts/labels_apply.py "$COMMAND" \
            --repo "$REPO" \
            --sot .github/labels.json \
            --prune "$INPUT_PRUNE" \
            --dry-run "$INPUT_DRY_RUN" \
            --summary-file "$GITHUB_STEP_SUMMARY"
