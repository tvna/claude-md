name: Generate docs

on:
  pull_request:
    paths:
      - ".github/workflows/generate-docs.yml"
      - "docs/generated/**"
      - "scripts/auto_retro.py"
      - "scripts/workflow_diagram.py"
      - ".github/workflows/*.yml"
      - "tests/test_auto_retro.py"
      - "tests/test_auto_retro_decision_tree.py"
      - "tests/test_workflow_cli_contracts.py"
      - "tests/test_workflow_diagram.py"

permissions:
  contents: read

concurrency:
  group: generate-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Generate auto-retro script decision tree
        run: python3 scripts/auto_retro.py decision-tree-doc

      - name: Generate workflow if-branch diagrams
        run: python3 scripts/workflow_diagram.py diagram-doc

      - name: Fail if any generated doc drifted
        run: |
          if ! git diff --exit-code -- docs/generated/; then
            echo "::error::docs/generated/ is out of date."
            echo "::error::Run 'python3 scripts/auto_retro.py decision-tree-doc' and 'python3 scripts/workflow_diagram.py diagram-doc' then commit the results."
            exit 1
          fi
