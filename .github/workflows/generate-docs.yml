name: Generate docs

on:
  pull_request:
    # Scope narrowed to docs/generated/workflows/ only (#1540).
    # docs/generated/scripts/ is owned by the post-merge automation and is no
    # longer regenerated or drift-checked on the PR.
    paths:
      - ".github/workflows/generate-docs.yml"
      - "docs/generated/workflows/**"
      - "scripts/workflow_diagram.py"
      - ".github/workflows/*.yml"
      - "tests/test_workflow_cli_contracts.py"
      - "tests/test_workflow_diagram.py"

permissions:
  contents: read

concurrency:
  group: generate-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Generate workflow if-branch diagrams
        run: python3 scripts/workflow_diagram.py diagram-doc

      - name: Fail if any generated workflow doc drifted
        run: |
          if ! git diff --exit-code -- docs/generated/workflows/; then
            echo "::error::docs/generated/workflows/ is out of date."
            echo "::error::Run the generated-doc command above, then commit the results."
            exit 1
          fi
