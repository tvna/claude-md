name: Measure verify-agents.yml timings

on:
  schedule:
    # 10:00 JST every Monday. Offset from the Sunday cluster
    # (branch-cleanup 20:00 UTC, ruleset-drift 21:00 UTC,
    # security-control-drift-report 23:00 UTC) so this run does not
    # contend with the read-only detectors for the GitHub API quota.
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Optional issue number to receive the report as a comment. Leave blank to skip commenting (artifact + step summary only).'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: measure-lint-pytest-timings
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO: ${{ github.repository }}

jobs:
  measure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read uv pin from pyproject.toml
        id: uvpin
        run: |
          set -euo pipefail
          PIN="$(python3 scripts/uv_pin.py read)"
          echo "version=${PIN}" >> "$GITHUB_OUTPUT"

      - name: Install uv
        env:
          UV_VERSION: ${{ steps.uvpin.outputs.version }}
        run: |
          set -euo pipefail
          curl -LsSf "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/uv.tar.gz
          tar -xzf /tmp/uv.tar.gz -C /tmp
          mkdir -p "$HOME/.local/bin"
          install -m 0755 /tmp/uv-x86_64-unknown-linux-gnu/uv "$HOME/.local/bin/uv"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv --version

      - name: Install Python
        run: uv python install

      - name: Sync locked project environment
        run: uv sync --locked

      - name: Fetch verify-agents.yml runs
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/actions/workflows/verify-agents.yml/runs?per_page=100" > runs.json

      - name: Fetch per-run jobs
        run: |
          set -euo pipefail
          mkdir -p jobs
          for id in $(jq -r '.workflow_runs[].id' runs.json); do
            gh api "repos/${REPO}/actions/runs/${id}/jobs" > "jobs/${id}.json"
          done

      - name: Generate timing report
        run: |
          set -euo pipefail
          uv run python scripts/analyze_ci_timings.py \
            --jobs jobs/ \
            --workflow "Verify agent instructions" \
            --title "verify-agents.yml timings (weekly)" \
            > report.md

      - name: Append report to step summary
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-timings-report
          path: report.md
          retention-days: 90

      - name: Post report as comment on dispatch issue
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_number != '' }}
        run: |
          set -euo pipefail
          gh issue comment "${{ inputs.issue_number }}" \
            --repo "${REPO}" \
            --body-file report.md
