name: Dependabot auto-merge audit

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Collect changed files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 scripts/dependabot_automerge.py list-files \
            --pr-number "$PR_NUMBER" \
            --output changed-files.txt

      - name: Audit policy
        id: audit
        run: |
          python3 scripts/dependabot_automerge.py audit \
            --event "$GITHUB_EVENT_PATH" \
            --policy .github/dependabot-automerge.json \
            --changed-files changed-files.txt \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --output "$GITHUB_OUTPUT"

      - name: Request GitHub auto-merge
        if: steps.audit.outputs.should_enable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 scripts/dependabot_automerge.py request-automerge \
            --pr-number "$PR_NUMBER"
