name: Dependabot auto-merge audit

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Collect changed files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 scripts/dependabot_automerge.py list-files \
            --pr-number "$PR_NUMBER" \
            --output changed-files.txt

      - name: Audit policy
        id: audit
        run: |
          python3 scripts/dependabot_automerge.py audit \
            --event "$GITHUB_EVENT_PATH" \
            --policy .github/dependabot-automerge.json \
            --changed-files changed-files.txt \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --output "$GITHUB_OUTPUT"

      - name: Request GitHub auto-merge
        if: steps.audit.outputs.should_enable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 scripts/dependabot_automerge.py request-automerge \
            --pr-number "$PR_NUMBER"

      # Revoke a previously enabled auto-merge when the PR is no longer eligible.
      # The `labeled` trigger means a threat-intel/severity label added after
      # enablement re-runs this audit; disable-automerge no-ops when auto-merge
      # was never enabled, so it is safe to run on every non-eligible result.
      - name: Disable GitHub auto-merge if no longer eligible
        if: steps.audit.outputs.should_enable != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 scripts/dependabot_automerge.py disable-automerge \
            --pr-number "$PR_NUMBER"
