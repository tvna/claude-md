name: Generate auto-retro decision tree

on:
  pull_request:
    paths:
      - ".github/workflows/generate-auto-retro-decision-tree.yml"
      - "docs/generated/auto-retro-decision-tree.md"
      - "scripts/auto_retro.py"
      - "tests/test_auto_retro.py"
      - "tests/test_workflow_cli_contracts.py"

permissions:
  contents: read

concurrency:
  group: auto-retro-decision-tree-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decision-tree:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate decision tree document
        run: python3 scripts/auto_retro.py decision-tree-doc

      - name: Fail if generated decision tree drifted
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          if ! git diff --exit-code -- docs/generated/auto-retro-decision-tree.md; then
            echo "::error::docs/generated/auto-retro-decision-tree.md is out of date. Run 'python3 scripts/auto_retro.py decision-tree-doc' and commit the result."
            exit 1
          fi
