name: Generate auto-retro decision tree

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - ".github/workflows/generate-auto-retro-decision-tree.yml"
      - "docs/generated/auto-retro-decision-tree.md"
      - "scripts/auto_retro.py"
      - "tests/test_auto_retro.py"
      - "tests/test_workflow_cli_contracts.py"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-retro-decision-tree-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decision-tree:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate decision tree document
        run: python3 scripts/auto_retro.py decision-tree-doc

      - name: Fail if generated decision tree drifted
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          if ! git diff --exit-code -- docs/generated/auto-retro-decision-tree.md; then
            echo "::error::docs/generated/auto-retro-decision-tree.md is out of date. Run 'python3 scripts/auto_retro.py decision-tree-doc' and commit the result."
            exit 1
          fi

      - name: Open pull request if generated decision tree changed
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: chore/update-auto-retro-decision-tree
          PR_TITLE: "docs(auto-retro): update generated decision tree (#605)"
        run: |
          if git diff --quiet -- docs/generated/auto-retro-decision-tree.md; then
            echo "Auto-retro decision tree document is already up to date."
            exit 0
          fi

          cat > /tmp/pr-body.md <<'EOF'
          ## Summary

          Regenerates `docs/generated/auto-retro-decision-tree.md` from `scripts/auto_retro.py::run`.

          ## Related Issue

          Closes #605

          ## Facts

          - `python3 scripts/auto_retro.py decision-tree-doc` changed `docs/generated/auto-retro-decision-tree.md`.
          - The generated document contains Mermaid produced from the `auto_retro.run()` AST.

          ## Assumptions

          - speculation: The post-merge generator ran because a merged change affected the auto-retro decision tree surface.

          ## Risk & blast radius

          - Documentation-only generated artifact under `docs/generated/`; no runtime workflow behavior changes.

          ## Rollback

          - Revert this generated-doc PR.

          ## Verification

          - command: `python3 scripts/auto_retro.py decision-tree-doc`
            result: `exit 0`

          ## Checklist

          ### Bootstrap

          - [x] Facts vs. Assumptions split is honest
          - [x] Risk & blast radius assessed; Rollback steps are runnable
          - [x] Issue number recorded on the `Closes #` line above
          - [x] Branch carries exactly one commit ahead of `main`

          ### After-merge (CI)

          - [x] Generated decision tree drift check exits 0
          - [ ] CI green on the merge commit

          ### Post-merge

          - [ ] Linked issue closed by the merge
          - [ ] auto-retro issue opened by `.github/workflows/auto-retro.yml`
          - [ ] No follow-up `fix(...)` PR needed within 24h of merge

          _Generated by [github-actions](https://github.com/actions)_
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$PR_BRANCH"
          git add docs/generated/auto-retro-decision-tree.md
          git commit -m "$PR_TITLE"
          git push --force-with-lease origin "$PR_BRANCH"

          if gh pr view "$PR_BRANCH" --json number --jq .number >/dev/null 2>&1; then
            gh pr edit "$PR_BRANCH" --title "$PR_TITLE" --body-file /tmp/pr-body.md
          else
            gh pr create --base "$GITHUB_REF_NAME" --head "$PR_BRANCH" --title "$PR_TITLE" --body-file /tmp/pr-body.md
          fi
