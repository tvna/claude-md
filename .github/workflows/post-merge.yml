name: Post-merge automation

on:
  pull_request_target:
    types: [closed]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      task:
        description: 'Post-merge task to run manually.'
        type: choice
        required: true
        default: decision-tree
        options:
          - decision-tree
          - coverage
          - all

permissions: {}

jobs:
  open-retro:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    concurrency:
      group: auto-retro-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Open retrospective issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 scripts/auto_retro.py run

  coverage:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.task == 'coverage' || inputs.task == 'all'))
    runs-on: ubuntu-latest
    outputs:
      coverage_gate_result: ${{ steps.coverage-tests.outcome }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read uv pin from pyproject.toml
        id: uvpin
        run: |
          set -euo pipefail
          PIN="$(python3 scripts/uv_pin.py read)"
          echo "version=${PIN}" >> "$GITHUB_OUTPUT"

      - name: Install uv
        env:
          UV_VERSION: ${{ steps.uvpin.outputs.version }}
        run: |
          curl -LsSf "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/uv.tar.gz
          tar -xzf /tmp/uv.tar.gz -C /tmp
          mkdir -p "$HOME/.local/bin"
          install -m 0755 /tmp/uv-x86_64-unknown-linux-gnu/uv "$HOME/.local/bin/uv"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv --version

      - name: Install Python
        run: uv python install

      - name: Sync locked project environment
        run: uv sync --locked

      - name: Run script unit tests with coverage
        id: coverage-tests
        continue-on-error: true
        run: uv run python -m pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=92.71 -v --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          files: ./coverage.xml
          flags: scripts
          fail_ci_if_error: false
          use_oidc: true

      - name: Upload test results to Codecov
        if: always()
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          files: ./junit.xml
          disable_search: true
          fail_ci_if_error: false
          use_oidc: true

      - name: Fail coverage job when coverage gate failed
        if: steps.coverage-tests.outcome == 'failure'
        run: |
          echo "::error::script coverage gate failed; see the pytest coverage output above."
          exit 1

  coverage-failure-issue:
    if: always() && needs.coverage.outputs.coverage_gate_result == 'failure'
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Open or update coverage failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVER_URL: ${{ github.server_url }}
          WORKFLOW: ${{ github.workflow }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: python3 scripts/coverage_failure_issue.py run

  decision-tree:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.task == 'decision-tree' || inputs.task == 'all'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: generate-docs-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate auto-retro script decision tree
        run: python3 scripts/auto_retro.py decision-tree-doc

      - name: Generate workflow if-branch diagrams
        run: python3 scripts/workflow_diagram.py diagram-doc

      - name: Open pull request if any generated doc changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_BRANCH: chore/update-generated-docs
          PR_TITLE: "docs(generated): regenerate decision tree and workflow diagrams (#960)"
        run: |
          if git diff --quiet -- docs/generated/; then
            echo "All generated docs are already up to date."
            exit 0
          fi

          cat > /tmp/pr-body.md <<'EOF'
          ## Summary

          Regenerates `docs/generated/` artifacts from source after a change merged to `main`:

          - `docs/generated/scripts/auto-retro-decision-tree.md` from `scripts/auto_retro.py::run` AST.
          - `docs/generated/workflows/*-if-branches.md` from `.github/workflows/*.yml` if-branch analysis.

          ## Related Issue

          Closes #960

          ## Facts

          - `python3 scripts/auto_retro.py decision-tree-doc` and/or `python3 scripts/workflow_diagram.py diagram-doc` changed one or more files under `docs/generated/`.
          - The generated documents contain Mermaid diagrams produced from script AST or workflow YAML parsing.

          ## Assumptions

          - speculation: A merged change affected the auto-retro decision tree surface or a workflow YAML if-branch.

          ## Risk and blast radius

          - Documentation-only generated artifacts under `docs/generated/`; no runtime workflow behavior changes.

          ## Rollback

          - Revert this generated-doc PR.

          ## Verification

          - command: `python3 scripts/auto_retro.py decision-tree-doc`
            result: `exit 0`
          - command: `python3 scripts/workflow_diagram.py diagram-doc`
            result: `exit 0`

          ## Checklist

          ### Bootstrap

          - [x] Facts vs. Assumptions split is honest
          - [x] Risk and blast radius assessed; Rollback steps are runnable
          - [x] Issue number recorded on the `Closes #` line above
          - [x] Branch carries exactly one commit ahead of `main`

          ### After-merge (CI)

          - [x] Generated docs drift check exits 0
          - [ ] CI green on the merge commit

          ### Post-merge

          - [ ] Linked issue closed by the merge
          - [ ] auto-retro issue opened by `.github/workflows/post-merge.yml`
          - [ ] No follow-up `fix(...)` PR needed within 24h of merge

          _Generated by [github-actions](https://github.com/actions)_
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$PR_BRANCH"
          git add docs/generated/
          git commit -m "$PR_TITLE"
          git push --force-with-lease origin "$PR_BRANCH"

          python3 scripts/pr_upsert.py upsert \
            --head "$PR_BRANCH" \
            --base "$GITHUB_REF_NAME" \
            --title "$PR_TITLE" \
            --body-file /tmp/pr-body.md
