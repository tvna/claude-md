name: Post-merge automation

on:
  pull_request_target:
    types: [closed]
  push:
    branches: [main]
  # Daily drift sweep for the verify-docs-drift job below. Every other job in
  # this workflow gates on push / workflow_dispatch in its `if:`, so a schedule
  # event runs only the drift gate; the write-capable jobs all skip. Refs #1574.
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: 'Post-merge task to run manually.'
        type: choice
        required: true
        default: decision-tree
        options:
          - decision-tree
          - coverage
          - triage-report
          - maturity-summary
          - all

permissions: {}

jobs:
  open-retro:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    concurrency:
      group: auto-retro-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Lead the merge-run job summary with the maturity report, then let the
      # retro step append its auto-retro summary below it (same job, so step
      # order is summary order). The script is stdlib-only, so the system
      # python3 runs it without setup-uv. A render failure only warns: opening
      # the retro is the load-bearing audit action and must not be blocked by a
      # cosmetic summary. Refs #1979.
      - name: Render codebase maturity summary to the job summary
        run: |
          python3 scripts/codebase_maturity_summary.py summary >> "$GITHUB_STEP_SUMMARY" \
            || echo "::warning::maturity summary render failed; continuing to open the retro"

      - name: Open retrospective issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 scripts/auto_retro.py run

  coverage:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.task == 'coverage' || inputs.task == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      coverage_gate_result: ${{ steps.coverage-tests.outcome }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up uv and project environment
        uses: ./.github/actions/setup-uv

      - name: Run script unit tests with coverage
        id: coverage-tests
        continue-on-error: true
        # No --cov-fail-under here: the threshold lives only in
        # [tool.coverage.report].fail_under (pyproject.toml), the
        # authoritative gate (#1354). pytest-cov enforces that config value.
        run: uv run python -m pytest --cov --cov-report=term-missing --cov-report=xml -v --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          flags: scripts
          fail_ci_if_error: false
          use_oidc: true

      - name: Upload test results to Codecov
        if: always()
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          files: ./junit.xml
          disable_search: true
          fail_ci_if_error: false
          use_oidc: true

      - name: Fail coverage job when coverage gate failed
        if: steps.coverage-tests.outcome == 'failure'
        run: |
          echo "::error::script coverage gate failed; see the pytest coverage output above."
          exit 1

  coverage-failure-issue:
    if: always() && needs.coverage.outputs.coverage_gate_result == 'failure'
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Open or update coverage failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVER_URL: ${{ github.server_url }}
          WORKFLOW: ${{ github.workflow }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: python3 scripts/coverage_failure_issue.py run

  # Read-only per-merge view of codebase scale and maturity (#1955). Renders a
  # deterministic Markdown report (script/test/workflow/doc counts, test:script
  # ratio, generated AST-doc coverage, gate-script count, and the maintainability
  # budget health reused from scan_maintainability_metrics) and appends it to the
  # job summary. It writes nothing to the repo and mints no token (contents:
  # read), so it shares no Environment with the write-capable jobs below and
  # cannot drift a committed doc.
  maturity-summary:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.task == 'maturity-summary' || inputs.task == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up uv and project environment
        uses: ./.github/actions/setup-uv

      - name: Render codebase maturity summary to the job summary
        run: uv run python scripts/codebase_maturity_summary.py summary >> "$GITHUB_STEP_SUMMARY"

  decision-tree:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.task == 'decision-tree' || inputs.task == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Mint a GitHub App token from the devcontainer-image-pins Environment so the
    # generated-docs PR commit is signed (Verified) and authored by the App bot
    # via createCommitOnBranch, not a runner `git push`. This job runs on push to
    # main / dispatch only, so the Environment never gates a PR check. Refs #1437.
    environment:
      name: devcontainer-image-pins
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: generate-docs-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Pin the generators to the project interpreter so this single-producer
      # committer cannot drift from the Python that wrote the docs already on
      # main. ast.unparse emits f-strings with 3.11-vs-3.12 quote-style
      # differences, so a bare `python3` (whatever ubuntu-latest defaults to)
      # could whole-file-churn docs/generated/. uv provisions the pinned
      # version; `uv run python` below uses it. Refs #1533.
      - name: Set up uv and project environment
        uses: ./.github/actions/setup-uv

      - name: Generate per-script AST graphs
        # Writes one doc per script under docs/generated/scripts/ast/ and prunes
        # orphan/legacy outputs. This folder is owned by the post-merge
        # automation; the PR and pre-push gates no longer regenerate it (#1540).
        run: uv run python scripts/script_ast_graph.py all-doc

      - name: Generate script dependency graph
        # Writes docs/generated/scripts/dependency-graph.md from scripts/*.py
        # import statements. Same single-producer ownership as the AST docs
        # above; pre-push and pre-merge gates do not regenerate it (#1543).
        run: uv run python scripts/script_dependency_graph.py all-doc

      - name: Generate script trigger reverse-map
        # Writes docs/generated/scripts/trigger-map.md by reverse-mapping the
        # four launch sources (workflow run: steps, pre-commit, preflight_all
        # Step argv, agent hooks). Same single-producer ownership as the docs
        # above; pre-push and pre-merge gates do not regenerate it (#1546).
        run: uv run python scripts/script_trigger_map.py all-doc

      - name: Generate workflow if-branch diagrams
        run: uv run python scripts/workflow_diagram.py diagram-doc

      - name: Generate document dependency graph diagram
        # Writes docs/generated/graph/doc-dependency-graph.md from
        # docs/graph/doc-dependencies.toml. Same single-producer ownership as
        # the AST/dependency graphs above; the pre-push and pre-merge gates do
        # not regenerate it. Refs #1754.
        run: uv run python scripts/doc_graph_viz.py all-doc

      - name: Regenerate script size-distribution snapshot
        # Writes docs/standards/module-size-distribution.toml from the
        # scripts/*.py physical-line distribution. Refs #2013: this snapshot
        # joins the single-producer model of docs/generated/ (#1540/#1543/#1546)
        # -- the PR and pre-push gates no longer regenerate it, so feature
        # branches stop hitting recurring merge conflicts in this one file; the
        # post-merge job is now the single producer.
        run: uv run python scripts/scan_module_size_distribution.py write

      - name: Detect generated-doc drift
        id: drift
        run: |
          if git diff --quiet -- docs/generated/ docs/standards/module-size-distribution.toml; then
            echo "All generated docs are already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint GitHub App token
        id: app-token
        if: ${{ steps.drift.outputs.changed == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DEVCONTAINER_PIN_APP_ID }}
          private-key: ${{ secrets.DEVCONTAINER_PIN_APP_PRIVATE_KEY }}

      - name: Open pull request if any generated doc changed
        if: ${{ steps.drift.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_BRANCH: chore/update-generated-docs
          PR_TITLE: "docs(generated): regenerate decision tree and workflow diagrams"
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Summary

          Regenerates `docs/generated/` artifacts from source after a change merged to `main`:

          - `docs/generated/scripts/ast/<stem>.md` from each `scripts/*.py` AST (one file per script).
          - `docs/generated/scripts/dependency-graph.md` from `scripts/*.py` sibling-import edges.
          - `docs/generated/scripts/trigger-map.md` from the four `scripts/*.py` launch sources.
          - `docs/generated/workflows/*-if-branches.md` from `.github/workflows/*.yml` if-branch analysis.
          - `docs/generated/graph/doc-dependency-graph.md` from `docs/graph/doc-dependencies.toml` (Mermaid dependency diagram).
          - `docs/standards/module-size-distribution.toml` from the `scripts/*.py` physical-line size distribution (single-producer snapshot, #2013).

          ## Related Issue

          Closes #__ISSUE_ANCHOR:generated-docs__

          ## Facts

          - One or more generated-doc commands changed files under `docs/generated/`.
          - The generated documents contain Mermaid diagrams produced from script AST or workflow YAML parsing.

          ## Assumptions

          - speculation: A merged change affected the auto-retro decision tree surface or a workflow YAML if-branch.

          ## Risk and blast radius

          - Documentation-only generated artifacts under `docs/generated/`; no runtime workflow behavior changes.

          ## Rollback

          - Revert this generated-doc PR.

          ## Verification

          - command: `uv run python scripts/script_ast_graph.py all-doc`
            result: `exit 0`
          - command: `uv run python scripts/script_dependency_graph.py all-doc`
            result: `exit 0`
          - command: `uv run python scripts/script_trigger_map.py all-doc`
            result: `exit 0`
          - command: `uv run python scripts/workflow_diagram.py diagram-doc`
            result: `exit 0`
          - command: `uv run python scripts/doc_graph_viz.py all-doc`
            result: `exit 0`
          - command: `uv run python scripts/scan_module_size_distribution.py write`
            result: `exit 0`

          ## Checklist

          ### Bootstrap

          - [x] Facts vs. Assumptions split is honest
          - [x] Risk and blast radius assessed; Rollback steps are runnable
          - [x] Issue number recorded on the `Closes #` line above
          - [x] Branch carries exactly one commit ahead of `main`

          ### After-merge (CI)

          - [x] Generated docs drift check exits 0
          - [ ] CI green on the merge commit

          ### Post-merge

          - [ ] Linked issue closed by the merge
          - [ ] auto-retro issue opened by `.github/workflows/post-merge.yml`
          - [ ] No follow-up `fix(...)` PR needed within 24h of merge

          _Generated by [github-actions](https://github.com/actions)_
          EOF

          # Signed, reuse-safe publish: the changed docs/generated/ files are
          # committed server side via createCommitOnBranch (App-bot author,
          # Verified). --from-diff derives the added/modified/deleted set from
          # `git status` of the working tree. --recreate deletes and recreates
          # the fixed branch off base with a single signed commit instead of
          # appending onto its tip: the branch can fall far behind main between
          # successful publishes, and a 152-file createCommitOnBranch appended
          # onto that stale tip fails ("Something went wrong"). A delete+create
          # is not a force-push, so the all-branches non_fast_forward ruleset is
          # still honored. Mirrors the triage-report refresh path.
          # Refs #1437, #1466, #1560, #1574.
          #
          # Refs #1640: the tracking issue for this PR series lives in
          # .github/tracking-issues.toml; render expands the __ISSUE_ANCHOR__
          # token in the body, and the commit trailer resolves the same anchor.
          python3 scripts/issue_anchors.py render --file /tmp/pr-body.md
          TRACKING_ISSUE="$(python3 scripts/issue_anchors.py get generated-docs)"
          python3 scripts/pr_upsert.py upsert-files \
            --head "$PR_BRANCH" \
            --base "$GITHUB_REF_NAME" \
            --title "$PR_TITLE" \
            --commit-body "Refs #${TRACKING_ISSUE}" \
            --body-file /tmp/pr-body.md \
            --from-diff docs/generated/ \
            --from-diff docs/standards/module-size-distribution.toml \
            --recreate

  # Moved here from weekly-maintenance.yml (#1386) so the triage-report
  # dashboard -- now the primary human inspection surface for auto-retro --
  # refreshes on every merge instead of weekly. Regenerates
  # docs/generated/scripts/auto-retro-triage-report.md from the live
  # retro-issue label state and opens a PR when the snapshot drifts. The
  # report is non-deterministic (it depends on GitHub state, not just
  # source), so it cannot live in the deterministic generated-docs
  # regeneration; the git history of the committed snapshot is the time
  # series. Refs #1042, #1386.
  triage-report:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.task == 'triage-report' || inputs.task == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Mint a GitHub App token from the devcontainer-image-pins Environment so the
    # refresh-PR commit is authored by the App bot (tvna-bot), matching the other
    # bot-generated PR workflows. The createCommitOnBranch path already signs the
    # commit; the App token makes the author the App bot rather than
    # github-actions[bot]. Refs #1437.
    environment:
      name: devcontainer-image-pins
    permissions:
      contents: write
      issues: read
      pull-requests: write
    concurrency:
      group: auto-retro-triage-report
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Regenerate triage report
        # Reads live retro-issue label state, so it uses the default GITHUB_TOKEN
        # (issues: read). Only the PR-authoring step below needs the App token.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 scripts/auto_retro.py triage-report

      # Mint a short-lived App installation token so the refresh-PR commit is
      # authored by the App bot (tvna-bot). Refs #1437.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DEVCONTAINER_PIN_APP_ID }}
          private-key: ${{ secrets.DEVCONTAINER_PIN_APP_PRIVATE_KEY }}

      # Publish the regenerated snapshot as a refresh PR. The snapshot commit is
      # authored via the signed createCommitOnBranch path
      # (scripts/pr_upsert.upsert_single_file_pr, recreate=True), not `git push`.
      # On each drift the fixed branch is deleted and re-created off main with one
      # signed commit, so it never accumulates an unsigned ancestor that would
      # permanently violate required_signatures (#1560); a delete+create is not a
      # force-push, so the all-branches non_fast_forward ruleset is still honored
      # (#1466). The command no-ops when the snapshot already matches main.
      # Authored by the App bot via the minted token.
      - name: Upsert refresh PR if the snapshot drifted
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python3 scripts/auto_retro.py triage-report-pr

  # Durable drift gate (#1574, the optional item 2 of #1533): regenerate the
  # deterministic docs/generated/ tree with the project-pinned interpreter and
  # fail loudly when main has drifted from it. The decision-tree job above is the
  # single producer and only opens a PR (it never fails on drift); this read-only
  # gate is the missing detection layer, so a stale docs/generated/ surfaces on
  # the next push or the daily schedule instead of waiting for an unrelated PR.
  # It mints no token and writes nothing (contents: read), so it shares no
  # Environment with the write-capable jobs above. The generators are pinned to
  # `uv run python` for the same reason the committer is (#1533): a bare python3
  # could f-string-churn the AST docs across Python versions and produce a false
  # drift signal here.
  verify-docs-drift:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up uv and project environment
        uses: ./.github/actions/setup-uv

      - name: Regenerate the deterministic generated docs
        run: |
          uv run python scripts/script_ast_graph.py all-doc
          uv run python scripts/script_dependency_graph.py all-doc
          uv run python scripts/script_trigger_map.py all-doc
          uv run python scripts/workflow_diagram.py diagram-doc
          uv run python scripts/doc_graph_viz.py all-doc
          # Refs #2013: the module-size snapshot joins the single-producer model
          # (#1540/#1543/#1546). Regenerate it here too so staleness on main
          # surfaces on the next push or the daily schedule.
          uv run python scripts/scan_module_size_distribution.py write

      - name: Fail when docs/generated/ drifted from the regeneration
        run: |
          # `git add -A` stages new, modified, and deleted paths so the
          # --cached diff catches untracked additions (e.g. a new ast/<stem>.md)
          # that a plain `git diff` would miss. No commit is made. The
          # module-size snapshot (#2013) is staged and diffed alongside
          # docs/generated/ so its drift fails the same gate.
          git add -A docs/generated/ docs/standards/module-size-distribution.toml
          if ! git diff --cached --quiet -- docs/generated/ docs/standards/module-size-distribution.toml; then
            # Keep the literal "docs/generated/ is stale" substring: it is one of
            # the _CI_KEYWORDS the preflight_issue_ci_staleness hook matches to
            # block stale post-merge CI issues, so the snapshot drift wording must
            # not split it. Refs #2013.
            echo "::error::docs/generated/ is stale (or docs/standards/module-size-distribution.toml drifted): regenerating with the pinned interpreter produced changes. The post-merge decision-tree job should have opened chore/update-generated-docs; check that it merged. Drift:"
            git diff --cached --stat -- docs/generated/ docs/standards/module-size-distribution.toml >&2
            exit 1
          fi
          echo "OK: docs/generated/ and the module-size snapshot match the pinned-interpreter regeneration."
