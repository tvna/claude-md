name: Verify ruleset sync

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  # merge_group lets the required "Verify ruleset sync / gate" check resolve
  # on the queued integration ref (GitHub Merge Queue, issue #895). On
  # merge_group there is no pull_request payload, so BASE_REF falls back to
  # the default branch the queue always integrates against (main).
  merge_group:

permissions:
  contents: read

env:
  GH_TOKEN_API: ${{ secrets.RULESETS_PAT }}
  REPO: ${{ github.repository }}
  BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}

jobs:
  gate:
    name: "Verify ruleset sync / gate"
    runs-on: ubuntu-latest
    environment: ruleset-verify
    steps:
      - name: Guard RULESETS_PAT
        run: |
          if [ -z "${GH_TOKEN_API}" ]; then
            echo "::error::RULESETS_PAT secret is not set. Configure the 'ruleset-verify' environment with the RULESETS_PAT secret. See docs/runbooks/rulesets.md \"Required secret\" and \"PR-time required-checks sync gate\"."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify required-check contexts match workflow job names
        run: |
          python3 scripts/verify_required_check_contexts.py verify \
            --sot-path .github/rulesets/main.json \
            --workflows-dir .github/workflows

      - name: Verify ruleset sync
        run: |
          python3 scripts/verify_ruleset_sync.py verify \
            --repo "${REPO}" \
            --base-ref "${BASE_REF}" \
            --sot-path .github/rulesets/main.json \
            --ruleset-name main-protection
