name: Generate agent instructions

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      mode:
        description: 'generate (default) opens a PR on diff; verify fails on diff (used by PR drift gate)'
        type: string
        default: generate

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  APM_CLI_VERSION: "0.12.1"
  # Every file `apm compile --target all` can produce (Refs #2210, #2211).
  # git status --porcelain (not git diff) is required here: a target file
  # that apm compile creates for the first time is untracked, and
  # `git diff` silently ignores untracked paths.
  COMPILED_OUTPUT_PATHS: "CLAUDE.md AGENTS.md GEMINI.md .github/copilot-instructions.md"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The generate (PR-opening) path mints a GitHub App token from the
    # devcontainer-image-pins Environment, so the App-bot commit is signed and
    # App-authored. The job is dispatch-/schedule-triggered only (verify mode is
    # not wired to any PR trigger), so the Environment never gates a PR check.
    # Refs #1437, #1466.
    environment:
      name: devcontainer-image-pins

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up uv and project environment
        uses: ./.github/actions/setup-uv

      - name: Compile agent instructions
        # --target all: every apm-cli-supported tool, not just claude/codex.
        # Refs #2210. apm.yml's `target:` field stays narrow (install-time
        # skill deployment); this flag governs compile-time text output only.
        run: uv run --with "apm-cli==${APM_CLI_VERSION}" apm compile --target all

      - name: Fail if generated instructions drifted (verify mode)
        if: ${{ inputs.mode == 'verify' }}
        run: |
          # shellcheck disable=SC2086 # COMPILED_OUTPUT_PATHS is a deliberate
          # space-separated pathspec list, not a single quoted path.
          if [ -n "$(git status --porcelain -- $COMPILED_OUTPUT_PATHS)" ]; then
            echo "::error::One or more of $COMPILED_OUTPUT_PATHS is out of date. Run 'uv sync --locked && uv run --with \"apm-cli==${APM_CLI_VERSION}\" apm compile --target all' and commit the result."
            exit 1
          fi

      - name: Exit early when generated instructions are unchanged
        id: drift
        if: ${{ inputs.mode != 'verify' }}
        run: |
          # shellcheck disable=SC2086
          if [ -z "$(git status --porcelain -- $COMPILED_OUTPUT_PATHS)" ]; then
            echo "$COMPILED_OUTPUT_PATHS are already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Mint a short-lived GitHub App installation token so the generated PR's
      # commit is authored by the App bot (tvna-bot) and signed (Verified) via
      # the createCommitOnBranch path below, not a runner `git push`. Refs #1437.
      - name: Mint GitHub App token
        id: app-token
        if: ${{ inputs.mode != 'verify' && steps.drift.outputs.changed == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DEVCONTAINER_PIN_APP_ID }}
          private-key: ${{ secrets.DEVCONTAINER_PIN_APP_PRIVATE_KEY }}

      - name: Open pull request if generated instructions changed
        if: ${{ inputs.mode != 'verify' && steps.drift.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_BRANCH: chore/regenerate-agent-instructions
          PR_TITLE: "chore: regenerate agent instructions"
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          Regenerates the apm-compiled agent instructions (CLAUDE.md, AGENTS.md, GEMINI.md, and any newly-eligible apm-cli target output) from the APM source instructions.

          This automated update is opened as a pull request to keep generated instruction changes aligned with the repository change policy.

          Refs #__ISSUE_ANCHOR:agents-regen__
          EOF

          # Refs #1640: the tracking issue for this PR series lives in
          # .github/tracking-issues.toml; render expands the __ISSUE_ANCHOR__
          # token in the body, and the commit trailer resolves the same anchor.
          python3 scripts/issue_anchors.py render --file /tmp/pr-body.md
          TRACKING_ISSUE="$(python3 scripts/issue_anchors.py get agents-regen)"

          # --from-diff (not --add): each compiled path is resolved via
          # `git status --porcelain`, which reports both a modified tracked
          # file and one apm compile creates for the first time (untracked).
          # A fixed --add list only ever commits paths named at write time,
          # so a newly-eligible apm-cli target (e.g. .github/copilot-
          # instructions.md, once the source instruction becomes unscoped)
          # would compile successfully but never land in the PR. --from-diff
          # also naturally omits any path that did not actually change.
          # Refs #2210, #2211 (Codex review).
          # shellcheck disable=SC2046,SC2086
          python3 scripts/pr_upsert.py upsert-files \
            --head "$PR_BRANCH" \
            --base "$GITHUB_REF_NAME" \
            --title "$PR_TITLE" \
            --commit-body "Refs #${TRACKING_ISSUE}" \
            --body-file /tmp/pr-body.md \
            $(for p in $COMPILED_OUTPUT_PATHS; do printf -- '--from-diff %s ' "$p"; done)
