name: Generate agent instructions

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      mode:
        description: 'generate (default) opens a PR on diff; verify fails on diff (used by PR drift gate)'
        type: string
        default: generate

permissions:
  contents: write
  pull-requests: write

env:
  APM_CLI_VERSION: "0.12.1"

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read uv pin from pyproject.toml
        id: uvpin
        run: |
          set -euo pipefail
          PIN="$(python3 scripts/uv_pin.py read)"
          echo "version=${PIN}" >> "$GITHUB_OUTPUT"

      - name: Install uv
        env:
          UV_VERSION: ${{ steps.uvpin.outputs.version }}
        run: |
          curl -LsSf "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/uv.tar.gz
          tar -xzf /tmp/uv.tar.gz -C /tmp
          mkdir -p "$HOME/.local/bin"
          install -m 0755 /tmp/uv-x86_64-unknown-linux-gnu/uv "$HOME/.local/bin/uv"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv --version

      - name: Install Python
        run: uv python install

      - name: Sync locked project environment
        run: uv sync --locked

      - name: Compile agent instructions
        run: uv run --with "apm-cli==${APM_CLI_VERSION}" apm compile

      - name: Fail if generated instructions drifted (verify mode)
        if: ${{ inputs.mode == 'verify' }}
        run: |
          if ! git diff --exit-code -- CLAUDE.md AGENTS.md; then
            echo "::error::CLAUDE.md or AGENTS.md is out of date. Run 'uv sync --locked && uv run --with \"apm-cli==${APM_CLI_VERSION}\" apm compile' and commit the result."
            exit 1
          fi

      - name: Open pull request if generated instructions changed
        if: ${{ inputs.mode != 'verify' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: chore/regenerate-agent-instructions
          PR_TITLE: "chore: regenerate agent instructions (#18)"
        run: |
          if git diff --quiet -- CLAUDE.md AGENTS.md; then
            echo "CLAUDE.md and AGENTS.md are already up to date."
            exit 0
          fi

          cat > /tmp/pr-body.md <<'EOF'
          Regenerates `CLAUDE.md` and `AGENTS.md` from the APM source instructions.

          This automated update is opened as a pull request to keep generated instruction changes aligned with the repository change policy.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$PR_BRANCH"
          git add CLAUDE.md AGENTS.md
          git commit -m "$PR_TITLE"
          git push --force-with-lease origin "$PR_BRANCH"

          if gh pr view "$PR_BRANCH" --json number --jq .number >/dev/null 2>&1; then
            gh pr edit "$PR_BRANCH" --title "$PR_TITLE" --body-file /tmp/pr-body.md
          else
            gh pr create --base "$GITHUB_REF_NAME" --head "$PR_BRANCH" --title "$PR_TITLE" --body-file /tmp/pr-body.md
          fi
