name: Generate agent instructions

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      mode:
        description: 'generate (default) opens a PR on diff; verify fails on diff (used by PR drift gate)'
        type: string
        default: generate

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  APM_CLI_VERSION: "0.12.1"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up uv and project environment
        uses: ./.github/actions/setup-uv

      - name: Compile agent instructions
        run: uv run --with "apm-cli==${APM_CLI_VERSION}" apm compile

      - name: Fail if generated instructions drifted (verify mode)
        if: ${{ inputs.mode == 'verify' }}
        run: |
          if ! git diff --exit-code -- CLAUDE.md AGENTS.md; then
            echo "::error::CLAUDE.md or AGENTS.md is out of date. Run 'uv sync --locked && uv run --with \"apm-cli==${APM_CLI_VERSION}\" apm compile' and commit the result."
            exit 1
          fi

      - name: Open pull request if generated instructions changed
        if: ${{ inputs.mode != 'verify' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_BRANCH: chore/regenerate-agent-instructions
          PR_TITLE: "chore: regenerate agent instructions (#18)"
        run: |
          if git diff --quiet -- CLAUDE.md AGENTS.md; then
            echo "CLAUDE.md and AGENTS.md are already up to date."
            exit 0
          fi

          cat > /tmp/pr-body.md <<'EOF'
          Regenerates `CLAUDE.md` and `AGENTS.md` from the APM source instructions.

          This automated update is opened as a pull request to keep generated instruction changes aligned with the repository change policy.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$PR_BRANCH"
          git add CLAUDE.md AGENTS.md
          git commit -m "$PR_TITLE"
          # The shallow checkout fetched only main, so refs/remotes/origin/$PR_BRANCH
          # is absent and --force-with-lease would reject the overwrite with
          # "stale info" whenever the bot branch already exists. Fetch it first to
          # give the lease a current basis; on the first run the branch is absent,
          # the fetch is a no-op, and the push is a create that needs no force (#1412).
          git fetch origin "+refs/heads/$PR_BRANCH:refs/remotes/origin/$PR_BRANCH" || true
          git push --force-with-lease origin "$PR_BRANCH"

          python3 scripts/pr_upsert.py upsert \
            --head "$PR_BRANCH" \
            --base "$GITHUB_REF_NAME" \
            --title "$PR_TITLE" \
            --body-file /tmp/pr-body.md
