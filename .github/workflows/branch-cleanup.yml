name: Branch cleanup (dry-run)

on:
  schedule:
    # 05:00 JST every Monday.
    - cron: "0 20 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan only (survey + report, no deletion). This workflow currently has no delete code path; flipping false is a no-op until a follow-up PR (#31 Goal D).'
        type: boolean
        required: true
        default: true
      min_age_days:
        description: 'Minimum days since last commit for a branch to qualify as a deletion candidate.'
        type: number
        required: true
        default: 60

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: branch-cleanup
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO: ${{ github.repository }}
  SUMMARY_ISSUE_TITLE: "[branch-cleanup] weekly summary log"

jobs:
  survey:
    runs-on: ubuntu-latest

    steps:
      - name: Guard dispatch ref
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::branch-cleanup must be dispatched against main (got ${{ github.ref }})."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve default branch
        id: defaults
        run: |
          set -euo pipefail
          DEFAULT_BRANCH=$(gh api "/repos/${REPO}" --jq .default_branch)
          echo "default_branch=${DEFAULT_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Default branch: ${DEFAULT_BRANCH}"

      - name: Survey candidate branches
        id: survey
        env:
          RAW_DRY_RUN: ${{ inputs.dry_run }}
          RAW_MIN_AGE_DAYS: ${{ inputs.min_age_days }}
          DEFAULT_BRANCH: ${{ steps.defaults.outputs.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/branch_cleanup.py survey \
            --repo "${REPO}" \
            --dry-run "${RAW_DRY_RUN:-true}" \
            --min-age-days "${RAW_MIN_AGE_DAYS:-60}" \
            --default-branch "${DEFAULT_BRANCH}" \
            --event-name "${EVENT_NAME}" \
            --run-url "${RUN_URL}" \
            --out /tmp/cleanup-comment.md \
            --github-output "${GITHUB_OUTPUT}" \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Maintain rolling summary issue
        env:
          ISSUE_TITLE: ${{ env.SUMMARY_ISSUE_TITLE }}
          CANDIDATE_COUNT: ${{ steps.survey.outputs.candidate_count }}
          IDLE_CLOSE_DAYS: "28"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/branch_cleanup.py reconcile \
            --repo "${REPO}" \
            --title "${ISSUE_TITLE}" \
            --candidate-count "${CANDIDATE_COUNT}" \
            --comment-file /tmp/cleanup-comment.md \
            --idle-close-days "${IDLE_CLOSE_DAYS}" \
            --run-url "${RUN_URL}"
