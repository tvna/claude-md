name: Refresh auto-retro triage report

# Regenerates docs/generated/scripts/auto-retro-triage-report.md from the
# live retro-issue label state and opens a PR when the snapshot drifts.
# Unlike generate-docs.yml this report is non-deterministic (it depends on
# GitHub state, not just source), so it cannot live in that PR drift gate;
# it is refreshed on its own schedule instead. The git history of the
# committed snapshot is the time series. Refs #1042.

on:
  schedule:
    # Weekly, Monday 07:13 UTC. No collision with existing crons:
    # weekly-maintenance (Sun 20:00), retro-followup-drift (daily 06:37),
    # auto-retro-sentinel (daily 03:00), auto-retro-post-merge-rescan
    # (daily 04:00), attack-coverage-review-reminder (monthly).
    - cron: "13 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: auto-retro-triage-report
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Regenerate triage report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 scripts/auto_retro.py triage-report

      - name: Open pull request if the snapshot drifted
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_BRANCH: chore/refresh-auto-retro-triage-report
          PR_TITLE: "chore(auto-retro): refresh triage report (#1042)"
        run: |
          REPORT_PATH=docs/generated/scripts/auto-retro-triage-report.md
          # --porcelain reports both modified and new (untracked) files, so
          # the check fires on the first run too, when the snapshot does not
          # yet exist in the tree and `git diff` alone would miss it.
          if [ -z "$(git status --porcelain -- "$REPORT_PATH")" ]; then
            echo "Triage report is already up to date."
            exit 0
          fi

          cat > /tmp/pr-body.md <<'EOF'
          Refreshes the auto-retro triage report snapshot from the current
          retro-issue label state.

          This report is non-deterministic (it depends on live GitHub state),
          so it is refreshed on a schedule and opened as a pull request rather
          than enforced by the generate-docs.yml drift gate. Refs #1042.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$PR_BRANCH"
          git add "$REPORT_PATH"
          git commit -m "$PR_TITLE"
          git push --force-with-lease origin "$PR_BRANCH"

          python3 scripts/pr_upsert.py upsert \
            --head "$PR_BRANCH" \
            --base "$GITHUB_REF_NAME" \
            --title "$PR_TITLE" \
            --body-file /tmp/pr-body.md
