name: Weekly maintenance

# Consolidated weekly-cadence maintenance (issue #1319). In addition to the
# original weekly jobs, this file now hosts two formerly-standalone weekly
# workflows, merged here because they share the weekly trigger class:
#   - flake-pin-refresh.yml         -> job: flake-pin-refresh
#   - auto-retro-triage-report.yml  -> job: auto-retro-triage-report
#
# Per #1319 all weekly schedules are aligned to a single slot. The former crons
# (flake-pin-refresh: Mon 06:00 UTC; auto-retro-triage-report: Mon 07:13 UTC)
# now run at Sun 20:00 UTC alongside the rest. flake-pin-refresh previously ran
# "after the dependabot window"; that ordering relationship is intentionally
# dropped in favour of the unified weekly slot (its cooldown gate, not cron
# ordering, is what guards premature adoption). Each merged job keeps its own
# job-level permissions, environment, concurrency, and matrix so effective
# security permissions are unchanged.

on:
  schedule:
    # 05:00 JST every Monday. GitHub Actions cron is evaluated in UTC.
    - cron: "0 20 * * 0"
  # Event-driven drift detection (#1390): a change to a control-family source of
  # truth on main runs the security-control-drift job immediately instead of
  # waiting up to a week for the cron. Only that job opts in (its `if` includes
  # `push`); every other job stays schedule/dispatch-only and is skipped on push.
  # The weekly cron remains the backstop, and the per-family detector scripts are
  # reused unchanged (no duplicated detector logic).
  push:
    branches: [main]
    paths:
      - ".github/rulesets/**"
      - ".github/labels.json"
      - ".apm/instructions/**"
      - "pyproject.toml"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "GEMINI.md"
      - "docs/prd/security-control-inventory.md"
  workflow_dispatch:
    inputs:
      task:
        description: 'Weekly task to run manually.'
        type: choice
        required: true
        default: all
        options:
          - all
          - branch-cleanup
          - dependency-freshness
          - dependency-threat-triage
          - generate-agents
          - measure-timings
          - ruleset-drift
          - security-control-drift
          - flake-pin-refresh
          - codespace-cleanup
      codespace_cleanup_dry_run:
        description: 'Codespace cleanup: preview only, do not delete codespaces.'
        type: boolean
        required: true
        default: true
      codespace_cleanup_min_age_days:
        description: 'Codespace cleanup: minimum idle days (by last_used_at) for a Shutdown codespace to qualify.'
        type: number
        required: true
        default: 30
      branch_cleanup_dry_run:
        description: 'Branch cleanup: plan only. The workflow currently has no delete code path.'
        type: boolean
        required: true
        default: true
      branch_cleanup_min_age_days:
        description: 'Branch cleanup: minimum days since last commit for a branch to qualify.'
        type: number
        required: true
        default: 60
      measure_issue_number:
        description: 'Measure timings: optional issue number to receive the report as a comment.'
        type: string
        required: false
        default: ''
      measure_cutoff:
        description: 'Measure timings: optional UTC date (YYYY-MM-DD) for compare mode.'
        type: string
        required: false
        default: ''
      security_control_dry_run:
        description: 'Security control drift: plan only, do not post comment on tracking issue.'
        type: boolean
        required: true
        default: true

permissions: {}

env:
  REPO: ${{ github.repository }}
  APM_CLI_VERSION: "0.12.1"

jobs:
  branch-cleanup:
    if: github.event_name == 'schedule' || inputs.task == 'all' || inputs.task == 'branch-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: read
    concurrency:
      group: branch-cleanup
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SUMMARY_ISSUE_TITLE: "[branch-cleanup] weekly summary log"
    steps:
      - name: Guard dispatch ref
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::branch-cleanup must be dispatched against main (got ${{ github.ref }})."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve default branch
        id: defaults
        run: |
          set -euo pipefail
          DEFAULT_BRANCH=$(python3 scripts/github_paginate.py get \
            --path "repos/${REPO}" \
            --field default_branch)
          echo "default_branch=${DEFAULT_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Default branch: ${DEFAULT_BRANCH}"

      - name: Survey candidate branches
        id: survey
        env:
          RAW_DRY_RUN: ${{ inputs.branch_cleanup_dry_run }}
          RAW_MIN_AGE_DAYS: ${{ inputs.branch_cleanup_min_age_days }}
          DEFAULT_BRANCH: ${{ steps.defaults.outputs.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/branch_cleanup.py survey \
            --repo "${REPO}" \
            --dry-run "${RAW_DRY_RUN:-true}" \
            --min-age-days "${RAW_MIN_AGE_DAYS:-60}" \
            --default-branch "${DEFAULT_BRANCH}" \
            --event-name "${EVENT_NAME}" \
            --run-url "${RUN_URL}" \
            --out /tmp/cleanup-comment.md \
            --github-output "${GITHUB_OUTPUT}" \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Maintain rolling summary issue
        env:
          ISSUE_TITLE: ${{ env.SUMMARY_ISSUE_TITLE }}
          CANDIDATE_COUNT: ${{ steps.survey.outputs.candidate_count }}
          IDLE_CLOSE_DAYS: "28"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/branch_cleanup.py reconcile \
            --repo "${REPO}" \
            --title "${ISSUE_TITLE}" \
            --candidate-count "${CANDIDATE_COUNT}" \
            --comment-file /tmp/cleanup-comment.md \
            --idle-close-days "${IDLE_CLOSE_DAYS}" \
            --run-url "${RUN_URL}"

  dependency-freshness:
    if: github.event_name == 'schedule' || inputs.task == 'all' || inputs.task == 'dependency-freshness'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv and project environment
        uses: ./.github/actions/setup-uv

      - name: Assert uv pin lives only in pyproject.toml
        run: uv run python scripts/uv_pin.py drift

      - name: Assert python pin is exact and consistent
        run: uv run python scripts/python_pin.py verify

      - name: Assert workflows install Python deps via uv only
        run: uv run python scripts/scan_workflow_pip.py verify

      - name: Assert workflows pin actions to SHA + tag comment
        run: uv run python scripts/scan_workflow_action_pins.py verify

      - name: Assert no unallowlisted gh CLI calls in workflows
        run: uv run python scripts/scan_workflow_gh_calls.py verify

      - name: Warn if uv pin trails upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/uv_pin.py stale

      - name: Summarize policy
        run: |
          {
            echo "## Dependency freshness report"
            echo
            echo "- Lockfile drift: \`uv sync --locked\`"
            echo "- uv pin drift: \`scripts/uv_pin.py drift\`"
            echo "- Workflow dependency install drift: \`scripts/scan_workflow_pip.py verify\`"
            echo "- GitHub Action pin drift: \`scripts/scan_workflow_action_pins.py verify\`"
            echo "- Workflow gh CLI policy: \`scripts/scan_workflow_gh_calls.py verify\`"
            echo "- Upstream uv staleness: warning-only \`scripts/uv_pin.py stale\`"
            echo
            echo "Policy: \`docs/standards/dependency-freshness.md\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Scheduled re-triage (#1277) and the single home of threat-intel findings
  # since #1645. Threat findings are repository-global, so this cadence is the
  # one place they are recorded: it re-evaluates the locked-dependency corpus
  # against live threat intel, aggregates every finding into one idempotent
  # marker-anchored comment on the #178 security umbrella (resolved via the
  # issue-anchor table, not hardcoded), and still fails loud (--fail-on-intel)
  # so a recurring advisory or an expired accepted-intel suppression turns the
  # run red independent of PR traffic. Per-item threat:* labelling was retired.
  dependency-threat-triage:
    if: github.event_name == 'schedule' || inputs.task == 'all' || inputs.task == 'dependency-threat-triage'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Re-triage locked dependencies against live threat intel
        id: scan
        run: |
          python3 scripts/threat_intel_triage.py scan \
            --repo-root . \
            --labels "" \
            --ghsa-live \
            --malpkg-live \
            --epss-live \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --github-output "$GITHUB_OUTPUT" \
            --comment-file "$RUNNER_TEMP/threat-aggregate.md" \
            --fail-on-intel

      # Aggregate the findings onto the #178 security umbrella. Runs even when
      # the scan step failed loud on intel_needed (the evidence file is written
      # before --fail-on-intel exits non-zero), so the umbrella always reflects
      # the current state while the job conclusion stays red. The issue number
      # is resolved from .github/tracking-issues.toml (Refs #1640), never
      # hardcoded, so scan_issue_anchor_drift.py stays clean.
      - name: Aggregate findings onto the security tracking issue
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/threat-aggregate.md" ]; then
            echo "::warning::scan produced no aggregate evidence (it failed before writing it); leaving the umbrella unchanged. The scan step already failed loud."
            exit 0
          fi
          TRACKING_ISSUE="$(python3 scripts/issue_anchors.py get security-tracking)"
          if [ "${{ steps.scan.outputs.intel_needed }}" = "true" ]; then
            python3 scripts/threat_intel_triage.py comment \
              --body-file "$RUNNER_TEMP/threat-aggregate.md" \
              --issue "${TRACKING_ISSUE}" \
              --marker '<!-- threat-intel-aggregate v1 -->'
          else
            python3 scripts/threat_intel_triage.py comment \
              --body-file "$RUNNER_TEMP/threat-aggregate.md" \
              --issue "${TRACKING_ISSUE}" \
              --marker '<!-- threat-intel-aggregate v1 -->' \
              --update-only
          fi

  generate-agents:
    if: github.event_name == 'schedule' || inputs.task == 'all' || inputs.task == 'generate-agents'
    uses: ./.github/workflows/generate-agents.yml
    with:
      mode: generate
    permissions:
      contents: write
      pull-requests: write

  measure-timings:
    if: github.event_name == 'schedule' || inputs.task == 'all' || inputs.task == 'measure-timings'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    concurrency:
      group: measure-lint-pytest-timings
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv and project environment
        uses: ./.github/actions/setup-uv

      - name: Fetch verify-agents.yml runs
        run: |
          set -euo pipefail
          python3 scripts/github_paginate.py get \
            --path "repos/${REPO}/actions/workflows/verify-agents.yml/runs?per_page=100" \
            --output runs.json

      - name: Fetch per-run jobs
        run: |
          set -euo pipefail
          python3 scripts/github_paginate.py fetch-run-jobs \
            --runs runs.json \
            --repo "${REPO}" \
            --outdir jobs

      - name: Generate timing report
        env:
          CUTOFF: ${{ inputs.measure_cutoff }}
        run: |
          set -euo pipefail
          if [ -n "${CUTOFF}" ]; then
            uv run python scripts/analyze_ci_timings.py \
              --jobs jobs/ \
              --workflow "Verify repository scripts" \
              --cutoff "${CUTOFF}" \
              --title "verify-agents.yml timings (pre vs post ${CUTOFF})" \
              > report.md
          else
            uv run python scripts/analyze_ci_timings.py \
              --jobs jobs/ \
              --workflow "Verify repository scripts" \
              --title "verify-agents.yml timings (weekly)" \
              --budget-seconds 300 \
              --budget-output budget.json \
              > report.md
          fi

      - name: Append report to step summary
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update CI budget tracking issue
        if: ${{ inputs.measure_cutoff == '' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || 'true' }}
        run: |
          set -euo pipefail
          python3 scripts/ci_budget_issue.py run \
            --repo "${REPO}" \
            --breach-file budget.json \
            --run-url "${RUN_URL}" \
            --dry-run "${DRY_RUN}"

      - name: Upload report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-timings-report
          path: report.md
          retention-days: 90

      - name: Post report as comment on dispatch issue
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.measure_issue_number != '' }}
        run: |
          set -euo pipefail
          python3 scripts/post_issue_comment.py create \
            --issue-number "${{ inputs.measure_issue_number }}" \
            --body-file report.md

  ruleset-drift:
    if: github.event_name == 'schedule' || inputs.task == 'all' || inputs.task == 'ruleset-drift'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ruleset-verify
    permissions:
      contents: read
      issues: write
    concurrency:
      group: ruleset-drift
      cancel-in-progress: false
    env:
      GH_TOKEN_API: ${{ secrets.RULESETS_PAT }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Guard RULESETS_PAT
        run: |
          if [ -z "${GH_TOKEN_API}" ]; then
            echo "::error::RULESETS_PAT secret is not set. See docs/runbooks/rulesets.md §\"Required secret\"."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate ruleset JSON syntax
        run: |
          set -euo pipefail
          python3 scripts/validate_json_syntax.py verify \
            --file .github/rulesets/main.json \
            --file .github/rulesets/all-branches.json

      - name: Detect ruleset drift
        id: diff
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/ruleset_drift.py detect \
            --repo "${REPO}" \
            --sot-dir .github/rulesets \
            --run-url "${RUN_URL}" \
            --summary-file "${GITHUB_STEP_SUMMARY}" \
            --sot-body-file /tmp/drift-sot-issue.md \
            --unknown-body-file /tmp/drift-unknown-issue.md \
            >> "$GITHUB_OUTPUT"

      # Reconcile the single rolling issue per kind (#1004): create / update /
      # stay silent / auto-close. Runs unconditionally so a resolved drift closes
      # the open issue instead of stacking a fresh one each run (#998/#1000/#1002).
      - name: Reconcile SoT-vs-live drift issue
        run: |
          set -euo pipefail
          python3 scripts/ruleset_drift.py reconcile \
            --repo "${REPO}" \
            --kind sot \
            --detected "${DRIFT_DETECTED}" \
            --body-file /tmp/drift-sot-issue.md
        env:
          DRIFT_DETECTED: ${{ steps.diff.outputs.drift_count != '0' }}

      - name: Reconcile unknown-ruleset issue
        run: |
          set -euo pipefail
          python3 scripts/ruleset_drift.py reconcile \
            --repo "${REPO}" \
            --kind unknown \
            --detected "${UNKNOWN_DETECTED}" \
            --body-file /tmp/drift-unknown-issue.md
        env:
          UNKNOWN_DETECTED: ${{ steps.diff.outputs.unknown_count != '0' }}

  security-control-drift:
    if: github.event_name == 'schedule' || github.event_name == 'push' || inputs.task == 'all' || inputs.task == 'security-control-drift'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ruleset-verify
    permissions:
      contents: read
      issues: write
    concurrency:
      group: security-control-drift-report
      cancel-in-progress: false
    env:
      GH_TOKEN_API: ${{ secrets.RULESETS_PAT }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Guard RULESETS_PAT
        run: |
          if [ -z "${GH_TOKEN_API}" ]; then
            echo "::error::RULESETS_PAT secret is not set (reused read-only for ruleset detect). See docs/runbooks/rulesets.md."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv and project environment
        uses: ./.github/actions/setup-uv

      - name: Detect ruleset drift (read-only)
        id: ruleset
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/ruleset_drift.py detect \
            --repo "${REPO}" \
            --sot-dir .github/rulesets \
            --run-url "${RUN_URL}" \
            --summary-file /tmp/ruleset-detect-summary.md \
            --sot-body-file /tmp/ruleset-sot.md \
            --unknown-body-file /tmp/ruleset-unknown.md \
            > /tmp/ruleset-detect.out
          echo "rc=0" >> "$GITHUB_OUTPUT"

      - name: Record ruleset detect exit code
        id: ruleset_rc
        if: always()
        env:
          OUTCOME: ${{ steps.ruleset.outcome }}
        run: |
          set -euo pipefail
          if [ "${OUTCOME}" = "success" ]; then
            echo "rc=0" >> "$GITHUB_OUTPUT"
          else
            echo "rc=1" >> "$GITHUB_OUTPUT"
            touch /tmp/ruleset-detect.out
          fi

      - name: Plan labels drift (read-only)
        id: labels
        continue-on-error: true
        run: |
          set -euo pipefail
          : > /tmp/labels-summary.md
          python3 scripts/labels_apply.py plan \
            --repo "${REPO}" \
            --sot .github/labels.json \
            --prune false \
            --dry-run true \
            --summary-file /tmp/labels-summary.md

      - name: Record labels plan exit code
        id: labels_rc
        if: always()
        env:
          OUTCOME: ${{ steps.labels.outcome }}
        run: |
          set -euo pipefail
          if [ "${OUTCOME}" = "success" ]; then
            echo "rc=0" >> "$GITHUB_OUTPUT"
          else
            echo "rc=1" >> "$GITHUB_OUTPUT"
            touch /tmp/labels-summary.md
          fi

      - name: Compile APM instructions
        id: apm_compile
        continue-on-error: true
        # --target all: every apm-cli-supported tool, not just claude/codex.
        # Refs #2210.
        run: uv run --with "apm-cli==${APM_CLI_VERSION}" --exclude-newer "14 days" apm compile --target all

      - name: Diff CLAUDE.md / AGENTS.md / GEMINI.md
        id: apm
        if: always()
        run: |
          set -euo pipefail
          if git diff --exit-code -- CLAUDE.md AGENTS.md GEMINI.md; then
            echo "rc=0" >> "$GITHUB_OUTPUT"
          else
            echo "rc=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect uv pin literal drift (read-only)
        id: uv_drift
        continue-on-error: true
        run: python3 scripts/uv_pin.py drift

      - name: Record uv drift exit code
        id: uv_drift_rc
        if: always()
        env:
          OUTCOME: ${{ steps.uv_drift.outcome }}
        run: |
          set -euo pipefail
          if [ "${OUTCOME}" = "success" ]; then
            echo "rc=0" >> "$GITHUB_OUTPUT"
          else
            echo "rc=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect workflow-permissions drift (read-only)
        id: wfperm
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RULESETS_PAT }}
        run: |
          set -euo pipefail
          python3 scripts/rulesets_apply.py workflow-permissions \
            --repo "${REPO}" \
            --sot-file .github/actions-permissions/workflow.json \
            --mode drift \
            --summary-file "${GITHUB_STEP_SUMMARY}"

      - name: Record workflow-permissions drift exit code
        id: wfperm_rc
        if: always()
        env:
          OUTCOME: ${{ steps.wfperm.outcome }}
        run: |
          set -euo pipefail
          if [ "${OUTCOME}" = "success" ]; then
            echo "rc=0" >> "$GITHUB_OUTPUT"
          else
            echo "rc=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Warn if uv pin trails upstream (read-only)
        id: uv_stale
        continue-on-error: true
        run: python3 scripts/uv_pin.py stale > /tmp/uv-stale.out 2>&1

      - name: Record uv stale exit code
        id: uv_stale_rc
        if: always()
        env:
          OUTCOME: ${{ steps.uv_stale.outcome }}
        run: |
          set -euo pipefail
          if [ "${OUTCOME}" = "success" ]; then
            echo "rc=0" >> "$GITHUB_OUTPUT"
          else
            echo "rc=1" >> "$GITHUB_OUTPUT"
            touch /tmp/uv-stale.out
          fi

      - name: Verify OWASP ASI mapping completeness (read-only)
        id: owasp
        continue-on-error: true
        run: python3 scripts/owasp_asi_mapping.py verify

      - name: Record OWASP ASI verify exit code
        id: owasp_rc
        if: always()
        env:
          OUTCOME: ${{ steps.owasp.outcome }}
        run: |
          set -euo pipefail
          if [ "${OUTCOME}" = "success" ]; then
            echo "rc=0" >> "$GITHUB_OUTPUT"
          else
            echo "rc=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Aggregate drift report
        id: aggregate
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/security_drift_report.py aggregate \
            --ruleset-detect-output /tmp/ruleset-detect.out \
            --ruleset-detect-rc "${{ steps.ruleset_rc.outputs.rc }}" \
            --labels-plan-rc "${{ steps.labels_rc.outputs.rc }}" \
            --labels-summary-file /tmp/labels-summary.md \
            --apm-diff-rc "${{ steps.apm.outputs.rc }}" \
            --uv-drift-rc "${{ steps.uv_drift_rc.outputs.rc }}" \
            --workflow-permissions-drift-rc "${{ steps.wfperm_rc.outputs.rc }}" \
            --uv-stale-rc "${{ steps.uv_stale_rc.outputs.rc }}" \
            --uv-stale-output /tmp/uv-stale.out \
            --owasp-asi-verify-rc "${{ steps.owasp_rc.outputs.rc }}" \
            --run-url "${RUN_URL}" \
            --summary-file "${GITHUB_STEP_SUMMARY}" \
            --report-file /tmp/security-drift-report.md \
            --github-output "${GITHUB_OUTPUT}"

      - name: Post or update rolling comment on the security tracking issue
        if: always()
        env:
          DRY_RUN: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && 'false' || inputs.security_control_dry_run }}
        run: |
          set -euo pipefail
          # Refs #1640: the rolling-comment target lives in
          # .github/tracking-issues.toml, not in this file.
          TRACKING_ISSUE="$(python3 scripts/issue_anchors.py get security-tracking)"
          python3 scripts/security_drift_report.py post-comment \
            --repo "${REPO}" \
            --issue "${TRACKING_ISSUE}" \
            --report-file /tmp/security-drift-report.md \
            --dry-run "${DRY_RUN}"

      # Reconcile ONE rolling issue per target family: create on new drift, keep a
      # single issue (closing legacy dated duplicates), and auto-close when a
      # family stops drifting. Runs unconditionally (no drift_families gate) so a
      # resolved family can close its open issue, mirroring the ruleset-drift
      # reconcile steps. Refs #1726.
      - name: Reconcile per-family drift issues
        if: always() && steps.aggregate.outcome == 'success'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRY_RUN: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && 'false' || inputs.security_control_dry_run }}
        run: |
          set -euo pipefail
          python3 scripts/security_drift_report.py file-family-issues \
            --repo "${REPO}" \
            --run-url "${RUN_URL}" \
            --run-date "${{ steps.aggregate.outputs.report_date }}" \
            --families "${{ steps.aggregate.outputs.drift_families }}" \
            --resolved-families "${{ steps.aggregate.outputs.covered_families }}" \
            --dry-run "${DRY_RUN}"

  # Merged from flake-pin-refresh.yml (#1319). flake.nix is the single source of
  # truth for the version + per-system SHA256 of the GitHub-Releases-sourced
  # tools (waza, apm, rtk). Dependabot has no Nix ecosystem, so these pins do
  # not auto-follow upstream. This job checks each tool's latest release, holds
  # anything still inside the [tool.uv].exclude-newer cooldown, recomputes the
  # per-system SHA256 with nix, bumps flake.nix, validates it, and opens a bump
  # PR. Refs #1171.
  flake-pin-refresh:
    if: github.event_name == 'schedule' || inputs.task == 'all' || inputs.task == 'flake-pin-refresh'
    name: Auto-follow ${{ matrix.tool }} flake pin
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: devcontainer-image-pins
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: flake-pin-refresh-${{ matrix.tool }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        tool: [waza, apm, rtk]
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Decide target version (cooldown-gated)
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="$(python3 scripts/flake_pin_latest.py check --tool '${{ matrix.tool }}')"
          if [ -z "$target" ]; then
            echo "No adoptable update for ${{ matrix.tool }} (none newer, or within cooldown)."
          else
            echo "Adoptable target for ${{ matrix.tool }}: $target"
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Recompute per-system hashes and bump flake.nix
        if: steps.decide.outputs.target != ''
        run: |
          set -euo pipefail
          tool='${{ matrix.tool }}'
          target='${{ steps.decide.outputs.target }}'
          hash_args=()
          for sys in x86_64-linux aarch64-linux; do
            url="$(python3 scripts/flake_pin.py asset-url --tool "$tool" --system "$sys" --version "$target")"
            echo "Prefetching $sys asset: $url"
            sri="$(nix store prefetch-file --json "$url" | python3 -c 'import json,sys; print(json.load(sys.stdin)["hash"])')"
            hash_args+=(--hash "$sys=$sri")
          done
          python3 scripts/flake_pin.py bump --tool "$tool" --version "$target" "${hash_args[@]}"

      - name: Validate the bumped flake
        if: steps.decide.outputs.target != ''
        run: nix flake check --show-trace

      # Mint a short-lived GitHub App installation token so the generated flake
      # bump PR is authored by the App bot (not a human PAT owner) and still
      # triggers the downstream pin keepers. Refs #1401.
      - name: Mint GitHub App token
        if: steps.decide.outputs.target != ''
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DEVCONTAINER_PIN_APP_ID }}
          private-key: ${{ secrets.DEVCONTAINER_PIN_APP_PRIVATE_KEY }}

      - name: Open bump PR
        if: steps.decide.outputs.target != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tool='${{ matrix.tool }}'
          target='${{ steps.decide.outputs.target }}'
          # Refs #1640: the trailer's tracking issue lives in
          # .github/tracking-issues.toml, not in this file.
          TRACKING_ISSUE="$(python3 scripts/issue_anchors.py get flake-pin)"
          python3 scripts/devcontainer_pin_pr.py open \
            --github-sha "${tool}-${target}" \
            --branch-prefix "flake-pin-" \
            --base main \
            --title "chore(flake): bump ${tool} pin to ${target}" \
            --commit-subject "chore(flake): bump ${tool} pin to ${target}" \
            --commit-trailer "Refs #${TRACKING_ISSUE}" \
            --template .github/pr-body-templates/flake-pin.md \
            --file flake.nix

  # Delete Shutdown Codespaces idle for longer than codespace_cleanup_min_age_days
  # (default 30 days). Requires a PAT with admin:org scope stored as
  # CODESPACES_CLEANUP_TOKEN in the codespace-cleanup environment; the built-in
  # GITHUB_TOKEN cannot delete codespaces (API returns 403). Refs #1930.
  codespace-cleanup:
    if: github.event_name == 'schedule' || inputs.task == 'all' || inputs.task == 'codespace-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: codespace-cleanup
    permissions:
      contents: read
    concurrency:
      group: codespace-cleanup
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.CODESPACES_CLEANUP_TOKEN }}
      ORG: ${{ github.repository_owner }}
      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.codespace_cleanup_dry_run }}
      MIN_AGE_DAYS: ${{ inputs.codespace_cleanup_min_age_days || 30 }}
    steps:
      - name: Guard CODESPACES_CLEANUP_TOKEN
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::CODESPACES_CLEANUP_TOKEN secret is not set. Provision a PAT with admin:org scope and store it in the codespace-cleanup environment."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Prune inactive codespaces
        run: |
          set -euo pipefail
          python3 scripts/prune_codespaces.py prune \
            --org "${ORG}" \
            --min-age-days "${MIN_AGE_DAYS}" \
            --dry-run "${DRY_RUN}" \
            --summary-file "${GITHUB_STEP_SUMMARY}"
