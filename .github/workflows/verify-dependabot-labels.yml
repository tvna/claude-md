name: Verify dependabot labels

on:
  pull_request:
    paths:
      - ".github/dependabot.yml"
      - ".github/labels.json"
      - "scripts/dependabot_labels.py"
      - ".github/workflows/verify-dependabot-labels.yml"

permissions:
  contents: read

concurrency:
  group: verify-dependabot-labels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Verify dependabot.yml labels resolve in labels.json
        run: |
          python3 scripts/dependabot_labels.py verify \
            --dependabot .github/dependabot.yml \
            --labels .github/labels.json
