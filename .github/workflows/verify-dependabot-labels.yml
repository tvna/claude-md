name: Verify dependabot labels

on:
  pull_request:
  # merge_group lets the required "Verify dependabot labels / verify" check
  # resolve on the queued integration ref (GitHub Merge Queue, issue #895).
  # The job is a static working-tree check with no pull_request payload
  # dependency, so it runs unchanged on merge_group.
  merge_group:

permissions:
  contents: read

concurrency:
  group: verify-dependabot-labels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: "Verify dependabot labels / verify"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Verify dependabot.yml labels resolve in labels.json
        run: |
          python3 scripts/dependabot_labels.py verify \
            --dependabot .github/dependabot.yml \
            --labels .github/labels.json
