name: Portable PR policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: portable-pr-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APM_CLI_VERSION: "0.12.1"

jobs:
  gate:
    name: "Portable PR policy / gate"
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      KIND: pull_request
      TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      BODY_POLICY_CUTOFF: "2026-05-26T00:00:00Z"
      BODY_POLICY_SHAPE_CUTOFF: "2026-05-26T00:00:00Z"
      BASE_REF: origin/${{ github.event.pull_request.base.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # fetch-depth: 0 makes origin/<base> reachable from HEAD so the
          # README translation check can compare <base>..HEAD.
          fetch-depth: 0

      - name: Validate title policy
        run: |
          body_file="$(mktemp)"
          printf '%s' "$PR_BODY" > "$body_file"
          python3 scripts/title_policy.py verify --kind "$KIND" --body-file "$body_file" --author "$PR_AUTHOR"

      - name: Validate body section structure
        run: |
          body_file="$(mktemp)"
          printf '%s' "$PR_BODY" > "$body_file"
          python3 scripts/body_policy.py verify \
            --kind "$KIND" \
            --body-file "$body_file"

      - name: Validate retro repair completeness
        run: |
          body_file="$(mktemp)"
          printf '%s' "$PR_BODY" > "$body_file"
          python3 scripts/auto_retro.py verify-retro-completeness \
            --repo "$REPO" --pr-title "$TITLE" --pr-body-file "$body_file"

      - name: Block direct PR from retro issue
        run: |
          body_file="$(mktemp)"
          printf '%s' "$PR_BODY" > "$body_file"
          python3 scripts/auto_retro.py verify-no-direct-retro-pr \
            --repo "$REPO" --pr-title "$TITLE" --pr-body-file "$body_file"

      - name: Validate PR-issue link
        run: |
          body_file="$(mktemp)"
          printf '%s' "$PR_BODY" > "$body_file"
          python3 scripts/issue_link.py verify --repo "$REPO" --body-file "$body_file" --author "$PR_AUTHOR"

      - name: Validate linked issue titles
        run: |
          body_file="$(mktemp)"
          printf '%s' "$PR_BODY" > "$body_file"
          python3 scripts/verify_linked_issue_titles.py verify --repo "$REPO" --body-file "$body_file"

      - name: Validate README translation parity
        run: |
          body_file="$(mktemp)"
          printf '%s' "$PR_BODY" > "$body_file"
          python3 scripts/verify_readme_translation.py verify \
            --base-ref "$BASE_REF" \
            --body-file "$body_file"

      - name: Scan APM artifacts for repo-local references
        run: |
          python3 scripts/scan_apm_portability.py verify \
            --path .apm/instructions/master.instructions.md \
            --path CLAUDE.md \
            --path AGENTS.md

      - name: Read uv pin from pyproject.toml
        id: uvpin
        run: |
          set -euo pipefail
          PIN="$(python3 scripts/uv_pin.py read)"
          echo "version=${PIN}" >> "$GITHUB_OUTPUT"

      - name: Install uv
        env:
          UV_VERSION: ${{ steps.uvpin.outputs.version }}
        run: |
          curl -LsSf "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/uv.tar.gz
          tar -xzf /tmp/uv.tar.gz -C /tmp
          mkdir -p "$HOME/.local/bin"
          install -m 0755 /tmp/uv-x86_64-unknown-linux-gnu/uv "$HOME/.local/bin/uv"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv --version

      # Cache the uv download/build cache so `uv sync --locked`, the
      # `uv tool run prek` install, and the `apm compile` --with download
      # reuse resolved artifacts instead of re-fetching each CI run. Keyed
      # on uv.lock; restore-keys gives a partial hit when the lock changes
      # so only the delta is fetched. Refs #1146.
      - name: Cache uv artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install Python
        run: uv python install

      - name: Sync locked project environment
        run: uv sync --locked

      - name: Compile agent instructions
        run: uv run --with "apm-cli==${APM_CLI_VERSION}" --exclude-newer "14 days" apm compile

      - name: Verify CLAUDE.md / AGENTS.md drift
        run: |
          if ! git diff --exit-code -- CLAUDE.md AGENTS.md; then
            echo "::error::CLAUDE.md / AGENTS.md drift detected vs .apm/instructions/master.instructions.md."
            echo "Run 'uv run --with \"apm-cli==${APM_CLI_VERSION}\" --exclude-newer \"14 days\" apm compile' locally and commit the result."
            exit 1
          fi

      - name: Verify .apm checksum lockfile
        run: python3 scripts/verify_apm_checksums.py verify

      # Cache the prek hook environments (the pre-commit-hooks venv) so the
      # --all-files run reuses them instead of rebuilding each CI run. Keyed
      # on .pre-commit-config.yaml so a hook/rev change invalidates the
      # cache. Refs #1146.
      - name: Cache prek hook environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            prek-${{ runner.os }}-

      # Cache the compiled waza binary so the skill-quality-gate hook reuses
      # it instead of recompiling via `go install` every run (the dominant
      # cost of the prek step). Keyed on scripts/install_waza.sh so a pinned
      # WAZA_VERSION bump invalidates the cache. Refs #1146.
      - name: Cache waza binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/go/bin/waza
          key: waza-${{ runner.os }}-${{ hashFiles('scripts/install_waza.sh') }}

      # Put the Go bin dir on PATH so install_waza.sh finds the cached waza
      # via `command -v waza` and skips the go-install compile. Refs #1146.
      - name: Put Go bin directory on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run prek (j178/prek) against all files
        run: uv tool run prek run --all-files --show-diff-on-failure
