name: Apply rulesets

on:
  workflow_dispatch:
    inputs:
      ruleset:
        description: 'Which ruleset(s) to apply'
        type: choice
        required: true
        default: 'both'
        options:
          - all-branches
          - main
          - both
      dry_run:
        description: 'Plan only (diff + intent, no live changes)'
        type: boolean
        required: true
        default: true
      enable_auto_delete:
        description: 'Also enable repo setting "Automatically delete head branches" (ignored when dry_run)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.RULESETS_PAT }}
  REPO: ${{ github.repository }}

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ruleset-apply
    steps:
      - name: Guard dispatch ref
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::apply-rulesets must be dispatched against main (got ${{ github.ref }})."
          exit 1

      - name: Guard RULESETS_PAT
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::RULESETS_PAT secret is not set. See docs/rulesets.md §\"Required secret\"."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate ruleset JSON syntax
        run: |
          set -euo pipefail
          for f in .github/rulesets/main.json .github/rulesets/all-branches.json; do
            if ! jq empty < "$f"; then
              echo "::error file=$f::Invalid JSON syntax."
              exit 1
            fi
          done

      - name: Plan and apply rulesets
        env:
          INPUT_RULESET: ${{ inputs.ruleset }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          declare -a TARGETS=()
          case "$INPUT_RULESET" in
            all-branches) TARGETS=("all-branches.json") ;;
            main)         TARGETS=("main.json") ;;
            both)         TARGETS=("all-branches.json" "main.json") ;;
            *) echo "::error::Unknown ruleset input: $INPUT_RULESET"; exit 1 ;;
          esac

          curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/rulesets" \
            -o /tmp/existing-rulesets.json

          {
            echo "## Apply rulesets — dispatch summary"
            echo
            echo "- ruleset: \`$INPUT_RULESET\`"
            echo "- dry_run: \`$INPUT_DRY_RUN\`"
            echo "- enable_auto_delete: \`${{ inputs.enable_auto_delete }}\`"
            echo
            echo "| File | Ruleset name | Matches | Action | Result id |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for FILE in "${TARGETS[@]}"; do
            FPATH=".github/rulesets/$FILE"
            NAME=$(jq -r '.name' "$FPATH")
            MATCHES=$(jq --arg n "$NAME" '[.[] | select(.name == $n)] | length' /tmp/existing-rulesets.json)

            if [ "$MATCHES" -gt 1 ]; then
              echo "::error::Multiple existing rulesets named '$NAME' ($MATCHES). Refusing to guess; resolve manually."
              echo "| $FILE | $NAME | $MATCHES | abort | — |" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            EXISTING_ID=""
            if [ "$MATCHES" -eq 0 ]; then
              ACTION="POST"
            else
              ACTION="PUT"
              EXISTING_ID=$(jq -r --arg n "$NAME" '[.[] | select(.name == $n)] | .[0].id' /tmp/existing-rulesets.json)
            fi

            if [ "$ACTION" = "PUT" ]; then
              curl --fail-with-body -sS \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${REPO}/rulesets/${EXISTING_ID}" \
                -o "/tmp/live-${FILE}"
              {
                echo
                echo "<details><summary>Diff for <code>${NAME}</code> (id ${EXISTING_ID})</summary>"
                echo
                echo '```diff'
                diff -u \
                  <(jq -S '{name, target, enforcement, conditions, bypass_actors, rules}' "/tmp/live-${FILE}") \
                  <(jq -S '{name, target, enforcement, conditions, bypass_actors, rules}' "$FPATH") \
                  || true
                echo '```'
                echo "</details>"
              } >> "$GITHUB_STEP_SUMMARY"
            fi

            if [ "$INPUT_DRY_RUN" = "true" ]; then
              echo "| $FILE | $NAME | $MATCHES | plan-only ($ACTION) | ${EXISTING_ID:-—} |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            RESPONSE_FILE=$(mktemp)
            STATUS=1
            LAST_HTTP_CODE="000"
            if [ "$ACTION" = "POST" ]; then
              URL="https://api.github.com/repos/${REPO}/rulesets"
              METHOD="POST"
            else
              URL="https://api.github.com/repos/${REPO}/rulesets/${EXISTING_ID}"
              METHOD="PUT"
            fi
            for ATTEMPT in 1 2 3; do
              LAST_HTTP_CODE=$(curl -sS -o "$RESPONSE_FILE" -w '%{http_code}' \
                -X "$METHOD" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -H "Content-Type: application/json" \
                --data-binary "@${FPATH}" \
                "$URL" || echo "000")
              if [ "$LAST_HTTP_CODE" -ge 200 ] && [ "$LAST_HTTP_CODE" -lt 300 ]; then
                STATUS=0; break
              fi
              echo "Attempt $ATTEMPT: HTTP $LAST_HTTP_CODE for $METHOD $FILE"
              # Retry only on transient 5xx or curl-level failure ("000")
              if [ "$LAST_HTTP_CODE" != "000" ] && [ "$LAST_HTTP_CODE" -lt 500 ]; then
                break
              fi
              if [ "$ATTEMPT" -lt 3 ]; then
                sleep $((ATTEMPT * 5))
              fi
            done

            if [ "$STATUS" -ne 0 ]; then
              echo "::error::Failed to $METHOD $FILE (last HTTP $LAST_HTTP_CODE)."
              {
                echo
                echo "**Error applying ${FILE} (HTTP ${LAST_HTTP_CODE}):**"
                echo '```'
                cat "$RESPONSE_FILE"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            RESULT_ID=$(jq -r '.id' "$RESPONSE_FILE")
            echo "| $FILE | $NAME | $MATCHES | $ACTION applied | $RESULT_ID |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Enable auto-delete head branches
        if: ${{ inputs.enable_auto_delete && !inputs.dry_run }}
        run: |
          set -euo pipefail
          BEFORE=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}" | jq -r '.delete_branch_on_merge')
          curl --fail-with-body -sS \
            -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d '{"delete_branch_on_merge": true}' \
            "https://api.github.com/repos/${REPO}" > /dev/null
          AFTER=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}" | jq -r '.delete_branch_on_merge')
          {
            echo
            echo "### Repository setting: \`delete_branch_on_merge\`"
            echo "- Before: \`$BEFORE\`"
            echo "- After: \`$AFTER\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Auto-delete (dry-run plan)
        if: ${{ inputs.enable_auto_delete && inputs.dry_run }}
        run: |
          set -euo pipefail
          CURRENT=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}" | jq -r '.delete_branch_on_merge')
          {
            echo
            echo "### Repository setting: \`delete_branch_on_merge\` (dry-run)"
            echo "- Current: \`$CURRENT\`"
            echo "- Planned: PATCH to \`true\`"
          } >> "$GITHUB_STEP_SUMMARY"
