name: Apply rulesets

on:
  workflow_dispatch:
    inputs:
      ruleset:
        description: 'Which ruleset(s) to apply'
        type: choice
        required: true
        default: 'both'
        options:
          - all-branches
          - main
          - both
      dry_run:
        description: 'Plan only (diff + intent, no live changes)'
        type: boolean
        required: true
        default: true
      enable_auto_delete:
        description: 'Also enable repo setting "Automatically delete head branches" (ignored when dry_run)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.RULESETS_PAT }}
  REPO: ${{ github.repository }}

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Guard RULESETS_PAT
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::RULESETS_PAT secret is not set. See docs/rulesets.md §\"Required secret\"."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate ruleset JSON syntax
        run: |
          set -euo pipefail
          for f in .github/rulesets/main.json .github/rulesets/all-branches.json; do
            if ! jq empty < "$f"; then
              echo "::error file=$f::Invalid JSON syntax."
              exit 1
            fi
          done

      - name: Pre-check admin role id matches bypass_actors
        run: |
          set -euo pipefail
          ROLES_JSON=$(gh api "/repos/${REPO}/roles")
          ADMIN_ID=$(echo "$ROLES_JSON" | jq -r '[.[] | select(.name == "admin")] | .[0].id // empty')
          if [ -z "$ADMIN_ID" ]; then
            echo "::error::Could not resolve admin role id from /repos/${REPO}/roles."
            echo "$ROLES_JSON" | jq .
            exit 1
          fi
          echo "Resolved admin role id: $ADMIN_ID"
          for f in .github/rulesets/main.json .github/rulesets/all-branches.json; do
            DECLARED=$(jq -r '.bypass_actors[0].actor_id' "$f")
            if [ "$DECLARED" != "$ADMIN_ID" ]; then
              echo "::error file=$f::Declared bypass_actors[0].actor_id=$DECLARED but live admin role id is $ADMIN_ID. See docs/rulesets.md §\"Prerequisite — retrieve bypass actor ids\"."
              exit 1
            fi
          done

      - name: Plan and apply rulesets
        env:
          INPUT_RULESET: ${{ inputs.ruleset }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          declare -a TARGETS=()
          case "$INPUT_RULESET" in
            all-branches) TARGETS=("all-branches.json") ;;
            main)         TARGETS=("main.json") ;;
            both)         TARGETS=("all-branches.json" "main.json") ;;
            *) echo "::error::Unknown ruleset input: $INPUT_RULESET"; exit 1 ;;
          esac

          gh api "/repos/${REPO}/rulesets" > /tmp/existing-rulesets.json

          {
            echo "## Apply rulesets — dispatch summary"
            echo
            echo "- ruleset: \`$INPUT_RULESET\`"
            echo "- dry_run: \`$INPUT_DRY_RUN\`"
            echo "- enable_auto_delete: \`${{ inputs.enable_auto_delete }}\`"
            echo
            echo "| File | Ruleset name | Matches | Action | Result id |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for FILE in "${TARGETS[@]}"; do
            FPATH=".github/rulesets/$FILE"
            NAME=$(jq -r '.name' "$FPATH")
            MATCHES=$(jq --arg n "$NAME" '[.[] | select(.name == $n)] | length' /tmp/existing-rulesets.json)

            if [ "$MATCHES" -gt 1 ]; then
              echo "::error::Multiple existing rulesets named '$NAME' ($MATCHES). Refusing to guess; resolve manually."
              echo "| $FILE | $NAME | $MATCHES | abort | — |" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            EXISTING_ID=""
            if [ "$MATCHES" -eq 0 ]; then
              ACTION="POST"
            else
              ACTION="PUT"
              EXISTING_ID=$(jq -r --arg n "$NAME" '[.[] | select(.name == $n)] | .[0].id' /tmp/existing-rulesets.json)
            fi

            if [ "$ACTION" = "PUT" ]; then
              gh api "/repos/${REPO}/rulesets/${EXISTING_ID}" > "/tmp/live-${FILE}"
              {
                echo
                echo "<details><summary>Diff for <code>${NAME}</code> (id ${EXISTING_ID})</summary>"
                echo
                echo '```diff'
                diff -u \
                  <(jq -S '{name, target, enforcement, conditions, bypass_actors, rules}' "/tmp/live-${FILE}") \
                  <(jq -S '{name, target, enforcement, conditions, bypass_actors, rules}' "$FPATH") \
                  || true
                echo '```'
                echo "</details>"
              } >> "$GITHUB_STEP_SUMMARY"
            fi

            if [ "$INPUT_DRY_RUN" = "true" ]; then
              echo "| $FILE | $NAME | $MATCHES | plan-only ($ACTION) | ${EXISTING_ID:-—} |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            RESPONSE_FILE=$(mktemp)
            STATUS=1
            for ATTEMPT in 1 2 3; do
              if [ "$ACTION" = "POST" ]; then
                if gh api --method POST \
                    -H "Accept: application/vnd.github+json" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    "/repos/${REPO}/rulesets" \
                    --input "$FPATH" > "$RESPONSE_FILE" 2>&1; then
                  STATUS=0; break
                fi
              else
                if gh api --method PUT \
                    -H "Accept: application/vnd.github+json" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    "/repos/${REPO}/rulesets/${EXISTING_ID}" \
                    --input "$FPATH" > "$RESPONSE_FILE" 2>&1; then
                  STATUS=0; break
                fi
              fi
              echo "Attempt $ATTEMPT failed for $FILE; sleeping $((ATTEMPT * 5))s..."
              sleep $((ATTEMPT * 5))
            done

            if [ "$STATUS" -ne 0 ]; then
              echo "::error::Failed to $ACTION $FILE after 3 attempts."
              {
                echo
                echo "**Error applying ${FILE}:**"
                echo '```'
                cat "$RESPONSE_FILE"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            RESULT_ID=$(jq -r '.id' "$RESPONSE_FILE")
            echo "| $FILE | $NAME | $MATCHES | $ACTION applied | $RESULT_ID |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Enable auto-delete head branches
        if: ${{ inputs.enable_auto_delete && !inputs.dry_run }}
        run: |
          set -euo pipefail
          BEFORE=$(gh api "/repos/${REPO}" | jq -r '.delete_branch_on_merge')
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPO}" \
            -F delete_branch_on_merge=true > /dev/null
          AFTER=$(gh api "/repos/${REPO}" | jq -r '.delete_branch_on_merge')
          {
            echo
            echo "### Repository setting: \`delete_branch_on_merge\`"
            echo "- Before: \`$BEFORE\`"
            echo "- After: \`$AFTER\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Auto-delete (dry-run plan)
        if: ${{ inputs.enable_auto_delete && inputs.dry_run }}
        run: |
          set -euo pipefail
          CURRENT=$(gh api "/repos/${REPO}" | jq -r '.delete_branch_on_merge')
          {
            echo
            echo "### Repository setting: \`delete_branch_on_merge\` (dry-run)"
            echo "- Current: \`$CURRENT\`"
            echo "- Planned: PATCH to \`true\`"
          } >> "$GITHUB_STEP_SUMMARY"
