name: Apply rulesets

on:
  workflow_dispatch:
    inputs:
      ruleset:
        description: 'Which ruleset(s) to apply'
        type: choice
        required: true
        default: 'all'
        options:
          - all-branches
          - main
          - all
      dry_run:
        description: 'Plan only (diff + intent, no live changes)'
        type: boolean
        required: true
        default: true
      enable_auto_delete:
        description: 'Also enable repo setting "Automatically delete head branches" (ignored when dry_run)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.RULESETS_PAT }}
  REPO: ${{ github.repository }}

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ruleset-apply
    steps:
      - name: Guard dispatch ref
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::apply-rulesets must be dispatched against main (got ${{ github.ref }})."
          exit 1

      - name: Guard RULESETS_PAT
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::RULESETS_PAT secret is not set. See docs/runbooks/rulesets.md §\"Required secret\"."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate ruleset JSON syntax
        run: |
          set -euo pipefail
          for f in .github/rulesets/main.json .github/rulesets/all-branches.json; do
            if ! jq empty < "$f"; then
              echo "::error file=$f::Invalid JSON syntax."
              exit 1
            fi
          done

      - name: Plan and apply rulesets
        env:
          MODE: ${{ inputs.dry_run && 'plan' || 'apply' }}
        run: |
          set -euo pipefail
          python3 scripts/rulesets_apply.py "$MODE" \
            --repo "${REPO}" \
            --sot-dir .github/rulesets \
            --choice "${{ inputs.ruleset }}" \
            --enable-auto-delete "${{ inputs.enable_auto_delete }}" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Enable auto-delete head branches
        if: ${{ inputs.enable_auto_delete }}
        run: |
          set -euo pipefail
          python3 scripts/rulesets_apply.py auto-delete \
            --repo "${REPO}" \
            --dry-run "${{ inputs.dry_run }}" \
            --summary-file "$GITHUB_STEP_SUMMARY"
