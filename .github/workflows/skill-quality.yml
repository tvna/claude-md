# Skill quality gate (PR): runs waza spec-compliance checks on changed skills.
#
# Defense-in-depth companion to the local pre-commit hook `skill-quality-gate`
# (.pre-commit-config.yaml). Policy is fixed in scripts/skill_quality_gate.py:
# spec-compliance failure = fail, token budget = warning only, LLM judge not
# run. See issue #1099.
name: skill-quality

on:
  pull_request:
    paths:
      - ".agents/skills/**/SKILL.md"
      - "scripts/skill_quality_gate.py"
      - "scripts/install_waza.sh"
      - ".github/workflows/skill-quality.yml"

permissions:
  contents: read

jobs:
  skill-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"

      - name: Read uv pin from pyproject.toml
        id: uvpin
        run: |
          set -euo pipefail
          PIN="$(python3 scripts/uv_pin.py read)"
          echo "version=${PIN}" >> "$GITHUB_OUTPUT"

      - name: Install uv
        env:
          UV_VERSION: ${{ steps.uvpin.outputs.version }}
        run: |
          curl -LsSf "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/uv.tar.gz
          tar -xzf /tmp/uv.tar.gz -C /tmp
          mkdir -p "$HOME/.local/bin"
          install -m 0755 /tmp/uv-x86_64-unknown-linux-gnu/uv "$HOME/.local/bin/uv"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv --version

      - name: Install Python
        run: uv python install

      - name: Sync locked project environment
        run: uv sync --locked

      - name: Install waza (pinned)
        run: scripts/install_waza.sh

      - name: Run skill quality gate
        run: uv run python scripts/skill_quality_gate.py verify
