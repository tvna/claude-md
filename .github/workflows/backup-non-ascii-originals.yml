name: Backup non-ASCII originals (P1)

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to post the SHA-256 summary to (e.g. 102). Leave blank to skip.'
        type: string
        required: false
        default: ''

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Guard dispatch ref
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::This workflow must be dispatched against main (got ${{ github.ref }})."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Capture issues, PRs, and comments
        id: capture
        run: |
          set -euo pipefail

          TIMESTAMP=$(date -u +"%Y%m%dT%H%MZ")
          ARTIFACT_NAME="backup-non-ascii-${TIMESTAMP}"
          OUTDIR="/tmp/backup"
          mkdir -p "${OUTDIR}"

          echo "Fetching issues..."
          python3 scripts/github_paginate.py fetch \
            --path "repos/${REPO}/issues?state=all&per_page=100" \
            --output "${OUTDIR}/issues.json"

          echo "Fetching pull requests..."
          python3 scripts/github_paginate.py fetch \
            --path "repos/${REPO}/pulls?state=all&per_page=100" \
            --output "${OUTDIR}/pull_requests.json"

          echo "Fetching issue comments..."
          python3 scripts/github_paginate.py fetch \
            --path "repos/${REPO}/issues/comments?per_page=100" \
            --output "${OUTDIR}/issue_comments.json"

          echo "Fetching pull request review comments..."
          python3 scripts/github_paginate.py fetch \
            --path "repos/${REPO}/pulls/comments?per_page=100" \
            --output "${OUTDIR}/pull_request_review_comments.json"

          ARCHIVE="${OUTDIR}/originals-${TIMESTAMP}.json.gz"

          python3 scripts/backup_archive.py build \
            --indir "${OUTDIR}" \
            --timestamp "${TIMESTAMP}" \
            --repo "${REPO}" \
            --archive "${ARCHIVE}"

          SHA256=$(sha256sum "${ARCHIVE}" | awk '{print $1}')
          ARCHIVE_BASENAME=$(basename "${ARCHIVE}")

          {
            echo "artifact_name=${ARTIFACT_NAME}"
            echo "archive_path=${ARCHIVE}"
            echo "archive_basename=${ARCHIVE_BASENAME}"
            echo "sha256=${SHA256}"
            echo "timestamp=${TIMESTAMP}"
          } >> "$GITHUB_OUTPUT"

      - name: Write step summary
        env:
          ARTIFACT_NAME: ${{ steps.capture.outputs.artifact_name }}
          ARCHIVE_BASENAME: ${{ steps.capture.outputs.archive_basename }}
          SHA256: ${{ steps.capture.outputs.sha256 }}
          TIMESTAMP: ${{ steps.capture.outputs.timestamp }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## Non-ASCII originals backup (P1)"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Artifact | \`${ARTIFACT_NAME}\` |"
            echo "| File | \`${ARCHIVE_BASENAME}\` |"
            echo "| SHA-256 | \`${SHA256}\` |"
            echo "| Captured at | \`${TIMESTAMP}\` |"
            echo "| Retention | 90 days |"
            echo "| Run | ${RUN_URL} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backup artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.capture.outputs.artifact_name }}
          path: ${{ steps.capture.outputs.archive_path }}
          retention-days: 90

      - name: Post SHA-256 to issue
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_number != '' }}
        env:
          ARTIFACT_NAME: ${{ steps.capture.outputs.artifact_name }}
          ARCHIVE_BASENAME: ${{ steps.capture.outputs.archive_basename }}
          SHA256: ${{ steps.capture.outputs.sha256 }}
          TIMESTAMP: ${{ steps.capture.outputs.timestamp }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          BODY="**P1 backup captured** \`${TIMESTAMP}\`

          | Field | Value |
          |-------|-------|
          | Artifact | \`${ARTIFACT_NAME}\` |
          | File | \`${ARCHIVE_BASENAME}\` |
          | SHA-256 | \`${SHA256}\` |
          | Retention | 90 days |
          | Run | ${RUN_URL} |

          Record these values in the issue body backup section."

          python3 scripts/post_issue_comment.py create \
            --issue-number "${ISSUE_NUMBER}" \
            --body "${BODY}"
