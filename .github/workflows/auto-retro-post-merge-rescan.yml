name: Deferred Post-merge checklist re-scan

# Deferred follow-up to #418. After #418 removes Post-merge rows from the
# merge-time auto-retro body, this workflow re-scans each merged PR's
# Post-merge checklist subsection 24-48h after merge and appends a row to
# the existing retro issue when an observation gate remains unsatisfied.
#
# All logic lives in scripts/auto_retro.py (post_merge_rescan_run +
# helpers) and is unit-tested in tests/test_auto_retro_post_merge_rescan.py.
# The workflow only marshals env vars and shells to the single Python
# entry point. Refs #421.

on:
  schedule:
    # Daily at 04:00 UTC -- one hour after the sentinel cron (03:00 UTC)
    # so the two do not compete for the same GitHub API rate-limit budget.
    # The 24h cadence is aligned with the "No follow-up fix(...) PR needed
    # within 24h of merge" gate in the Post-merge checklist.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: 'Lookback window in hours (overrides default 48).'
        type: number
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: auto-retro-post-merge-rescan
  cancel-in-progress: false

jobs:
  rescan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Re-scan Post-merge checklist gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          AUTO_RETRO_RESCAN_HOURS: ${{ inputs.hours }}
        run: python3 scripts/auto_retro.py post-merge-rescan
