name: Ruleset drift detection

on:
  schedule:
    # 06:00 JST every Monday (offset 1h from branch-cleanup).
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ruleset-drift
  cancel-in-progress: false

env:
  GH_TOKEN_API: ${{ secrets.RULESETS_PAT }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO: ${{ github.repository }}

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: Guard RULESETS_PAT
        run: |
          if [ -z "${GH_TOKEN_API}" ]; then
            echo "::error::RULESETS_PAT secret is not set. See docs/rulesets.md §\"Required secret\"."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Validate ruleset JSON syntax
        run: |
          set -euo pipefail
          for f in .github/rulesets/main.json .github/rulesets/all-branches.json; do
            if ! jq empty < "$f"; then
              echo "::error file=$f::Invalid JSON syntax."
              exit 1
            fi
          done

      - name: Detect ruleset drift
        id: diff
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/ruleset_drift.py detect \
            --repo "${REPO}" \
            --sot-dir .github/rulesets \
            --run-url "${RUN_URL}" \
            --summary-file "${GITHUB_STEP_SUMMARY}" \
            --sot-body-file /tmp/drift-sot-issue.md \
            --unknown-body-file /tmp/drift-unknown-issue.md \
            >> "$GITHUB_OUTPUT"

      - name: File SoT-vs-live drift issue
        if: steps.diff.outputs.drift_count != '0'
        env:
          RUN_DATE: ${{ steps.diff.outputs.run_date }}
        run: |
          set -euo pipefail
          python3 scripts/ruleset_drift.py file-sot-issue \
            --repo "${REPO}" \
            --run-date "${RUN_DATE}" \
            --body-file /tmp/drift-sot-issue.md

      - name: File unknown-ruleset issue
        if: steps.diff.outputs.unknown_count != '0'
        env:
          RUN_DATE: ${{ steps.diff.outputs.run_date }}
        run: |
          set -euo pipefail
          python3 scripts/ruleset_drift.py file-unknown-issue \
            --repo "${REPO}" \
            --run-date "${RUN_DATE}" \
            --body-file /tmp/drift-unknown-issue.md
