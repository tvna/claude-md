name: Scan non-ASCII content

# All logic lives in scripts/scan_non_ascii.py and is unit-tested in
# tests/test_scan_non_ascii.py per the refactor strategy in issue #123
# (mirrors #112). The workflow only marshals env vars and shells out
# to the single Python entry point. See docs/prd/non-ascii-defense.md.

on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Scan and act on non-ASCII content
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/scan_non_ascii.py run
