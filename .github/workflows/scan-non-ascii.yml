name: Scan non-ASCII content

on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  issues: write
  pull-requests: write
  contents: read

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO: ${{ github.repository }}
  NON_ASCII_LABEL: severity:non-ascii-content
  COMMENT_MARKER: '<!-- scan-non-ascii.yml v1 -->'
  ACK_MARKER: '<!-- non-ascii-ack -->'

jobs:
  scan:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Extract event payload
        id: extract
        env:
          EVENT_JSON: ${{ toJSON(github.event) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            issues)
              NUMBER=$(jq -r '.issue.number' <<<"$EVENT_JSON")
              TITLE=$(jq -r '.issue.title // ""' <<<"$EVENT_JSON")
              BODY=$(jq -r '.issue.body // ""' <<<"$EVENT_JSON")
              ASSOC=$(jq -r '.issue.author_association' <<<"$EVENT_JSON")
              KIND=issue
              ;;
            pull_request_target)
              NUMBER=$(jq -r '.pull_request.number' <<<"$EVENT_JSON")
              TITLE=$(jq -r '.pull_request.title // ""' <<<"$EVENT_JSON")
              BODY=$(jq -r '.pull_request.body // ""' <<<"$EVENT_JSON")
              ASSOC=$(jq -r '.pull_request.author_association' <<<"$EVENT_JSON")
              KIND=pull_request
              ;;
            issue_comment)
              NUMBER=$(jq -r '.issue.number' <<<"$EVENT_JSON")
              TITLE=""
              BODY=$(jq -r '.comment.body // ""' <<<"$EVENT_JSON")
              ASSOC=$(jq -r '.comment.author_association' <<<"$EVENT_JSON")
              if jq -e '.issue.pull_request' <<<"$EVENT_JSON" >/dev/null; then
                KIND=pr_comment
              else
                KIND=issue_comment
              fi
              ;;
            pull_request_review_comment)
              NUMBER=$(jq -r '.pull_request.number' <<<"$EVENT_JSON")
              TITLE=""
              BODY=$(jq -r '.comment.body // ""' <<<"$EVENT_JSON")
              ASSOC=$(jq -r '.comment.author_association' <<<"$EVENT_JSON")
              KIND=pr_review_comment
              ;;
            *)
              echo "::error::Unknown event $EVENT_NAME"
              exit 1
              ;;
          esac

          printf '%s\n%s' "$TITLE" "$BODY" > /tmp/text
          printf '%s' "$BODY" > /tmp/body

          {
            echo "kind=$KIND"
            echo "number=$NUMBER"
            echo "assoc=$ASSOC"
          } >> "$GITHUB_OUTPUT"

      - name: Detect non-ASCII and classify
        id: classify
        run: |
          set -euo pipefail

          HAS_NON_ASCII=false
          if LC_ALL=C grep -P '[^\x00-\x7F]' /tmp/text >/dev/null 2>&1; then
            HAS_NON_ASCII=true
          fi

          HAS_ACK=false
          if LC_ALL=C grep -F "$ACK_MARKER" /tmp/body >/dev/null 2>&1; then
            HAS_ACK=true
          fi

          ASSOC='${{ steps.extract.outputs.assoc }}'
          case "$ASSOC" in
            OWNER|MEMBER|COLLABORATOR) TRUST=trusted ;;
            *) TRUST=external ;;
          esac

          if [ "$HAS_NON_ASCII" = false ]; then
            ACTION=none
          elif [ "$TRUST" = trusted ] && [ "$HAS_ACK" = true ]; then
            ACTION=skip
          elif [ "$TRUST" = trusted ]; then
            ACTION=advisory
          else
            ACTION=block
          fi

          {
            echo "has_non_ascii=$HAS_NON_ASCII"
            echo "has_ack=$HAS_ACK"
            echo "trust=$TRUST"
            echo "action=$ACTION"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## scan-non-ascii summary"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Event | \`${{ github.event_name }}\` |"
            echo "| Number | #${{ steps.extract.outputs.number }} |"
            echo "| Kind | \`${{ steps.extract.outputs.kind }}\` |"
            echo "| Author association | \`$ASSOC\` |"
            echo "| Trust class | \`$TRUST\` |"
            echo "| Has non-ASCII | \`$HAS_NON_ASCII\` |"
            echo "| Has ack marker | \`$HAS_ACK\` |"
            echo "| Action | \`$ACTION\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build advisory comment
        id: build
        if: steps.classify.outputs.action == 'advisory' || steps.classify.outputs.action == 'block'
        run: |
          set -euo pipefail

          # jq -Rsa '.' produces an ASCII-only JSON string; non-ASCII becomes \uXXXX
          # (incl. UTF-16 surrogate pairs for non-BMP codepoints like 4-byte emoji).
          # The -a (--ascii-output) flag is required — modern jq emits raw UTF-8 otherwise.
          ESCAPED=$(jq -Rsa '.' < /tmp/text | sed 's/^"//; s/"$//')
          if [ ${#ESCAPED} -gt 4000 ]; then
            ESCAPED="${ESCAPED:0:4000}... [truncated]"
          fi

          ACTION='${{ steps.classify.outputs.action }}'
          ASSOC='${{ steps.extract.outputs.assoc }}'
          KIND='${{ steps.extract.outputs.kind }}'

          {
            echo "$COMMENT_MARKER"
            echo
            echo "Non-ASCII content detected in this \`$KIND\`."
            echo
            echo "**Why this matters.** \`subscribe_pr_activity\` ingests this text into Claude sessions. Non-ASCII characters (Japanese, emoji, zero-width, RTL marks, fullwidth) are a known prompt-injection carrier. See \`docs/non-ascii-defense.md\` and \`docs/rulesets.md\` lines 48-51."
            echo
            if [ "$ACTION" = advisory ]; then
              echo "**Trusted author (\`$ASSOC\`):** advisory only. Label \`$NON_ASCII_LABEL\` has been applied; the content stays in place. To dismiss after operator review, append \`$ACK_MARKER\` to the body."
            else
              echo "**External author (\`$ASSOC\`):** blocked pending re-submission with ASCII-only content. The opt-out marker \`$ACK_MARKER\` does not apply to external contributors."
            fi
            echo
            echo "**Escaped form (data view, agent-safe):**"
            echo
            echo '```'
            echo "$ESCAPED"
            echo '```'
            echo
            echo "_Posted automatically by \`.github/workflows/scan-non-ascii.yml\`._"
          } > /tmp/comment.md

      - name: Apply label
        if: steps.classify.outputs.action == 'advisory' || steps.classify.outputs.action == 'block'
        run: |
          set -euo pipefail
          NUMBER='${{ steps.extract.outputs.number }}'
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg l "$NON_ASCII_LABEL" '{labels:[$l]}')" \
            "https://api.github.com/repos/${REPO}/issues/${NUMBER}/labels"

      - name: Post or update advisory comment (idempotent)
        if: steps.classify.outputs.action == 'advisory' || steps.classify.outputs.action == 'block'
        run: |
          set -euo pipefail
          NUMBER='${{ steps.extract.outputs.number }}'

          # Idempotency: find an existing advisory by marker.
          EXISTING=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/issues/${NUMBER}/comments?per_page=100" \
            | jq -r --arg m "$COMMENT_MARKER" '.[] | select(.body | startswith($m)) | .id' | head -n1)

          BODY=$(jq -Rs '.' < /tmp/comment.md)

          if [ -n "$EXISTING" ]; then
            curl --fail-with-body -sS \
              -X PATCH \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              -d "$(jq -nc --argjson b "$BODY" '{body:$b}')" \
              "https://api.github.com/repos/${REPO}/issues/comments/${EXISTING}"
            echo "Updated existing advisory comment $EXISTING."
          else
            curl --fail-with-body -sS \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              -d "$(jq -nc --argjson b "$BODY" '{body:$b}')" \
              "https://api.github.com/repos/${REPO}/issues/${NUMBER}/comments"
            echo "Posted new advisory comment."
          fi

      - name: Block external (PR review or issue close)
        if: steps.classify.outputs.action == 'block'
        run: |
          set -euo pipefail
          NUMBER='${{ steps.extract.outputs.number }}'
          KIND='${{ steps.extract.outputs.kind }}'

          case "$KIND" in
            pull_request|pr_comment|pr_review_comment)
              curl --fail-with-body -sS \
                -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -H "Content-Type: application/json" \
                -d '{"event":"REQUEST_CHANGES","body":"Blocked by .github/workflows/scan-non-ascii.yml -- non-ASCII content from external contributor. See the advisory comment above; re-submit with ASCII-only content."}' \
                "https://api.github.com/repos/${REPO}/pulls/${NUMBER}/reviews"
              echo "Requested changes on PR #${NUMBER}."
              ;;
            issue|issue_comment)
              curl --fail-with-body -sS \
                -X PATCH \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -H "Content-Type: application/json" \
                -d '{"state":"closed","state_reason":"not_planned"}' \
                "https://api.github.com/repos/${REPO}/issues/${NUMBER}"
              echo "Closed issue #${NUMBER} (state_reason: not_planned)."
              ;;
          esac
