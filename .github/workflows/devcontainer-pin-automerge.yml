name: Auto-merge devcontainer pin PR

# The repository-level "Allow auto-merge" toggle is intentionally OFF so agents
# cannot enable GitHub native auto-merge on arbitrary PRs. Native auto-merge is
# repo-wide and cannot be scoped to a single PR, so this keeper provides the same
# outcome strictly for the generated pin PR (branch prefix
# devcontainer/image-pins-): once it reaches mergeable_state=clean it is
# squash-merged via the REST merge API. Branch protection (main-protection) still
# gates the merge -- a non-clean PR is left for the next trigger.
#
# Triggers (#1363): the earlier check_suite:completed trigger never fired -- per
# GitHub docs, "the check_suite event does not trigger workflows if the check
# suite was created by GitHub Actions" (recursion prevention), and every pin-PR
# check is Actions-created. So the keeper is driven instead by:
#   * workflow_run on the two workflows that own the required status checks
#     (Verify PR, Verify repository scripts) completing -- the last to finish
#     finds the PR clean and merges. Not subject to the Actions-suite
#     suppression because the runs are pull_request-triggered.
#   * schedule (every 15 min) as a safety net so a missed event still converges.
#   * workflow_dispatch for manual recovery.
# The merge uses the PAT DEVCONTAINER_PIN_PR_TOKEN (not GITHUB_TOKEN) so the
# resulting push to main still triggers the downstream push workflows
# (publish / refresh / post-merge). Refs #696, #1137, #1352, #1363.

on:
  workflow_run:
    workflows: ["Verify PR", "Verify repository scripts"]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: devcontainer-pin-automerge
  cancel-in-progress: false

jobs:
  merge:
    name: Merge open devcontainer pin PR when green
    # For workflow_run, head_branch is the branch CI ran on; restrict to the pin
    # branch prefix and a successful run so unrelated CI does not spin up this
    # job. schedule and workflow_dispatch carry no workflow_run payload, so allow
    # them through unconditionally -- the merge subcommand is a no-op when no
    # clean pin PR is open.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'devcontainer/image-pins-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: devcontainer-image-pins
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        # Persist the default token; the merge step authenticates with the PAT in
        # GH_TOKEN, but checkout needs working credentials to fetch the scripts.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Merge pin PR if mergeable
        env:
          GH_TOKEN: ${{ secrets.DEVCONTAINER_PIN_PR_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/devcontainer_pin_pr.py merge
