name: Coverage on main

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write  # required for codecov-action OIDC (tokenless, public repo)

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read uv pin from pyproject.toml
        id: uvpin
        run: |
          set -euo pipefail
          PIN="$(python3 scripts/uv_pin.py read)"
          echo "version=${PIN}" >> "$GITHUB_OUTPUT"

      - name: Install uv
        env:
          UV_VERSION: ${{ steps.uvpin.outputs.version }}
        run: |
          curl -LsSf "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/uv.tar.gz
          tar -xzf /tmp/uv.tar.gz -C /tmp
          mkdir -p "$HOME/.local/bin"
          install -m 0755 /tmp/uv-x86_64-unknown-linux-gnu/uv "$HOME/.local/bin/uv"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv --version

      - name: Install Python
        run: uv python install

      - name: Sync locked project environment
        run: uv sync --locked

      - name: Run script unit tests with coverage
        run: uv run python -m pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=92.71 -v

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          files: ./coverage.xml
          flags: scripts
          fail_ci_if_error: false
          use_oidc: true
