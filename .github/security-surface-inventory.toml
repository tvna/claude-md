# Machine-readable manifest of security-relevant surfaces that cross a secret
# or privilege boundary. Refs #1387, docs/prd/security-control-inventory.md.
#
# scripts/verify_control_inventory_currency.py enforces this file in the
# lint-scripts-static job of .github/workflows/verify-agents.yml. The gate
# auto-detects, from the tree alone (no network), every surface that crosses a
# secret/privilege line:
#   - a workflow under .github/workflows/ that references a non-GITHUB_TOKEN
#     secret (a PAT or GitHub App key) OR declares an `environment:`;
#   - a script under scripts/ that imports the shared secret-pattern detector
#     `_secret_patterns`.
# Every detected surface MUST be listed below so a NEW privileged surface
# cannot land on reviewer memory alone (CLAUDE.md section 3).
#
# status:
#   "inventory" - the surface has a row in docs/prd/security-control-inventory.md
#                 (the gate verifies the row exists).
#   "exempt"    - the surface is intentionally NOT given an inventory row; a
#                 non-empty `reason` MUST justify why it carries no control row.
#
# Scope note: the broad gate_* / preflight_* / _github_api globs are NOT the
# detection signal. They predominantly match CI-process gates (40+ files)
# rather than ATT&CK security controls, so listing them would create a large
# exempt table that is itself a drift surface (CLAUDE.md section 4).
schema_version = 1

# --- Privileged workflows (non-GITHUB_TOKEN secret or environment) ----------

[[surfaces]]
path = ".github/workflows/apply-labels.yml"
status = "inventory"

[[surfaces]]
path = ".github/workflows/apply-rulesets.yml"
status = "inventory"

[[surfaces]]
path = ".github/workflows/devcontainer-pin-refresh.yml"
status = "inventory"

[[surfaces]]
path = ".github/workflows/generate-agents.yml"
status = "inventory"

[[surfaces]]
path = ".github/workflows/monthly-maintenance.yml"
status = "inventory"

[[surfaces]]
path = ".github/workflows/post-merge.yml"
status = "inventory"

[[surfaces]]
path = ".github/workflows/publish-devcontainer-images.yml"
status = "inventory"

[[surfaces]]
path = ".github/workflows/tvna-bot-automerge.yml"
status = "inventory"

[[surfaces]]
path = ".github/workflows/verify-pr.yml"
status = "inventory"

[[surfaces]]
path = ".github/workflows/weekly-maintenance.yml"
status = "inventory"

# --- Secret-pattern handling scripts ----------------------------------------

[[surfaces]]
path = "scripts/preflight_github_secrets.py"
status = "inventory"

[[surfaces]]
path = "scripts/scan_secrets.py"
status = "inventory"
