name: claude-md
version: 2.0.1
description: Personal universal agent instructions, compiled to CLAUDE.md,
  AGENTS.md and GEMINI.md for every apm-cli-supported tool via `apm compile
  --target all` (#2210).
# `target:` scopes `apm install`-style primitive/skill deployment (the
# obra/superpowers / tvna/clairvoyance pins below land under .claude/ and
# .agents/ only), which is deliberately narrower than the `--target all` flag
# CI passes to `apm compile` for the universal *text* output (CLAUDE.md /
# AGENTS.md / GEMINI.md / .github/copilot-instructions.md). Broadening this
# field would additionally deploy the pinned skill trees into .cursor/,
# .opencode/, .windsurf/, .gemini/ for tools this repo does not use. #2210.
target:
- claude
- codex
dependencies:
  apm:
  - obra/superpowers#f2cbfbefebbfef77321e4c9abc9e949826bea9d7
  - tvna/clairvoyance#4df075294c8e6a33b42e6703b54211f66c8a5ca3
  mcp:
  - name: context7
    transport: http
    url: https://mcp.context7.com/mcp
  # Local GitHub MCP server, added by special exception for CLI use (#1063).
  # apm.yml is the source of truth; scripts/gen_mcp_json.py renders .mcp.json
  # from this block at SessionStart (gitignored, never committed -- prohibited
  # per docs/standards/repo-scope.md, #1067). The server launches via
  # scripts/mcp_github_launch.sh, which mints a fresh GitHub App installation
  # token at every start, so no PAT is handed over and no secret hits a file.
  - name: github
    transport: stdio
    command: scripts/mcp_github_launch.sh
    args: []
