# .devcontainer/falco/custom-rules.yaml
#
# Custom Falco rules for the claude-md devcontainer.
# Tuned to minimize false positives from legitimate developer activity while
# retaining coverage for supply-chain attacks, credential theft, and
# container escape attempts.
#
# Prerequisites (Linux host only):
#   Install Falco: https://falco.org/docs/getting-started/installation/
#   Run alongside the devcontainer:
#     sudo falco -r .devcontainer/falco/custom-rules.yaml
#
# Honest limitation: Falco runs on the HOST kernel and is not installed
# inside the devcontainer. The existing _egress-ebpf.sh provides a
# complementary in-container bpftrace monitor (execve + ptrace + TCP + open).
# macOS / Windows hosts are not supported (Docker Desktop VM boundary).
#
# Refs: #1839

# --- Lists ---

- list: claude_md_allowed_shells
  items: [bash, sh, zsh, fish, dash]

- list: claude_md_package_managers
  items: [npm, node, pip, pip3, python, python3, uv, cargo, rustup, nix, nix-env, nix-build]

- list: claude_md_debuggers
  items: [gdb, dlv, lldb, strace, bpftrace, perf]

- list: claude_md_known_tools
  items: [git, gh, claude, codex, bpftrace, iptables, nix-build, nix-store,
          nix-collect-garbage, gpg, ssh, ssh-keygen, age]

# --- Macros ---

- macro: in_claude_md_devcontainer
  condition: container.name startswith "claude-md"

- macro: from_package_manager
  condition: proc.pname in (claude_md_package_managers)

- macro: is_interactive_shell
  condition: proc.tty != 0

- macro: is_known_tool
  condition: >
    proc.name in (claude_md_known_tools)
    or proc.pname in (claude_md_known_tools)

# --- Rules ---

# Supply-chain: package manager spawns a non-interactive shell.
# Legitimate: `npm run build` may invoke bash -c (tty=0, expected).
# Suspicious: npm/pip postinstall that opens a socket or downloads a dropper.
- rule: Package manager spawns non-interactive shell
  desc: >
    A package manager spawned a shell non-interactively inside the devcontainer.
    This is a common supply-chain attack vector where a malicious postinstall
    or build script attempts to open a reverse shell or execute a dropper.
    Legitimate build scripts (tty=0, bounded lifetime) produce this event too;
    correlate with subsequent CONNECT or EXEC events to distinguish.
  condition: >
    in_claude_md_devcontainer
    and spawned_process
    and proc.name in (claude_md_allowed_shells)
    and from_package_manager
    and not is_interactive_shell
  output: >
    Package manager spawned non-interactive shell
    container=%container.name pkg_mgr=%proc.pname shell=%proc.name
    cmdline=%proc.cmdline pid=%proc.pid user=%user.name
  priority: WARNING
  tags: [supply-chain, T1059, claude-md-devcontainer]

# Credential access: any unexpected process reads SSH keys or cloud credentials.
- rule: Credential file access by unexpected process
  desc: >
    A process that is not a known trusted tool accessed SSH private keys, AWS
    credentials, or the GitHub CLI token store. Legitimate access by git/gh/ssh
    is expected; access by node, python, curl, or wget at runtime is suspicious
    and may indicate credential harvesting by a malicious dependency.
  condition: >
    in_claude_md_devcontainer
    and open_read
    and (fd.name startswith "/home/claude/.ssh/"
         or fd.name startswith "/home/claude/.aws/"
         or fd.name = "/home/claude/.config/gh/hosts.yml"
         or fd.name startswith "/home/codex/.ssh/"
         or fd.name = "/home/codex/.config/gh/hosts.yml"
         or fd.name startswith "/root/.ssh/")
    and not is_known_tool
  output: >
    Credential file read by unexpected process
    container=%container.name proc=%proc.name pname=%proc.pname
    file=%fd.name cmdline=%proc.cmdline user=%user.name
  priority: ERROR
  tags: [credential-access, T1555, claude-md-devcontainer]

# Binary dropped into /tmp or /dev/shm and executed.
- rule: Dropped binary executed from temporary path
  desc: >
    A binary in /tmp or /dev/shm was executed. This is the canonical fileless
    malware and supply-chain dropper pattern: a package postinstall writes a
    binary to a world-writable path and immediately exec's it.
  condition: >
    in_claude_md_devcontainer
    and spawned_process
    and (proc.exepath startswith "/tmp/"
         or proc.exepath startswith "/dev/shm/")
    and not proc.name in (claude_md_known_tools)
  output: >
    Dropped binary executed from temporary path
    container=%container.name proc=%proc.name exepath=%proc.exepath
    cmdline=%proc.cmdline pid=%proc.pid user=%user.name
  priority: CRITICAL
  tags: [execution, T1059, T1620, claude-md-devcontainer]

# ptrace by a non-debugger process.
- rule: ptrace by unexpected process
  desc: >
    A process issued ptrace against another process and is not a known debugger.
    Legitimate callers (gdb, dlv, strace) are allowed; unexpected callers such
    as node or python may be attempting process injection (T1055).
  condition: >
    in_claude_md_devcontainer
    and syscall.type = ptrace
    and not proc.name in (claude_md_debuggers)
  output: >
    ptrace by unexpected process
    container=%container.name proc=%proc.name pname=%proc.pname
    pid=%proc.pid cmdline=%proc.cmdline
  priority: WARNING
  tags: [defense-evasion, T1055, claude-md-devcontainer]

# Reverse shell: stdin/stdout redirected to a network socket via dup(2).
# Follows the official Falco pattern ("Redirect STDOUT/STDIN to Network
# Connection in Container"): dup events with evt.rawres in (0,1,2) and
# fd.type ipv4/ipv6 reliably capture the fd-redirect moment. The prior
# spawned_process+fd.type approach was unreliable because fd.* fields do
# not apply to execve events. The iptables egress allowlist blocks the
# outbound connection; this rule fires the Falco alert for SIEM visibility.
- rule: Shell stdin/stdout redirected to network connection (potential reverse shell)
  desc: >
    A shell process duplicated a network file descriptor onto stdin (0),
    stdout (1), or stderr (2) via dup/dup2/dup3. This is the canonical
    reverse-shell indicator: a supply-chain dropper redirects the shell's
    I/O streams over a TCP socket. Follows the official Falco
    "Redirect STDOUT/STDIN to Network Connection in Container" pattern.
    The iptables egress allowlist drops the packet; this rule adds the alert.
  condition: >
    in_claude_md_devcontainer
    and dup
    and proc.name in (claude_md_allowed_shells)
    and evt.rawres in (0, 1, 2)
    and fd.type in (ipv4, ipv6)
  output: >
    Shell stdin/stdout redirected to network connection (potential reverse shell)
    container=%container.name proc=%proc.name fd=%fd.name
    cmdline=%proc.cmdline pid=%proc.pid user=%user.name
  priority: CRITICAL
  tags: [execution, lateral-movement, T1059, claude-md-devcontainer]

# cgroup release_agent write: container escape via CVE-2022-0492 class.
- rule: Write to cgroup release_agent
  desc: >
    A process wrote to a cgroup release_agent file, which is a known container
    escape technique (CVE-2022-0492). The devcontainer does not grant
    CAP_SYS_ADMIN, so this should be impossible; any match indicates an
    unexpected capability escalation.
  condition: >
    in_claude_md_devcontainer
    and open_write
    and fd.name endswith "/release_agent"
  output: >
    Write to cgroup release_agent (container escape attempt)
    container=%container.name proc=%proc.name file=%fd.name
    cmdline=%proc.cmdline pid=%proc.pid user=%user.name
  priority: CRITICAL
  tags: [container-escape, T1611, claude-md-devcontainer]
