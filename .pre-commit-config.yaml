repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
        exclude: ^\.github/workflows/
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: uv-pin-drift
        name: uv pin drift (scripts/uv_pin.py drift)
        entry: uv run python scripts/uv_pin.py drift
        language: system
        pass_filenames: false
        files: ^pyproject\.toml$
      - id: scan-workflow-pip
        name: scan workflow pip (scripts/scan_workflow_pip.py verify)
        entry: uv run python scripts/scan_workflow_pip.py verify
        language: system
        pass_filenames: false
        files: ^\.github/workflows/.*\.ya?ml$
      - id: scan-workflow-injection
        name: scan workflow injection (scripts/scan_workflow_injection.py verify)
        entry: uv run python scripts/scan_workflow_injection.py verify
        language: system
        pass_filenames: false
        files: ^\.github/workflows/.*\.ya?ml$
      - id: actionlint
        name: actionlint (workflow syntax + shellcheck)
        # System binary from flake.nix (sharedPackages). With no file args it
        # auto-discovers .github/workflows/ and shells out to shellcheck (also
        # in the flake) for every run: block. Guarded with `command -v` so a
        # non-nix context (a bare contributor laptop, or a uv-only CI job such
        # as portable-pr-policy.yml that runs prek without the nix shell)
        # soft-skips instead of hard-failing -- this mirrors the soft=True
        # actionlint step in preflight_all.py. The unconditional hard gate is
        # the nix-based verify-actionlint.yml, so enforcement is not lost.
        # Refs #1256.
        entry: bash -c 'command -v actionlint >/dev/null 2>&1 || { echo "actionlint not on PATH; skipping (enforced by verify-actionlint.yml)" >&2; exit 0; }; exec actionlint "$@"' --
        language: system
        pass_filenames: false
        files: ^\.github/workflows/.*\.ya?ml$
      - id: scan-secrets
        name: scan secrets (scripts/scan_secrets.py verify)
        entry: uv run python scripts/scan_secrets.py verify
        language: system
        pass_filenames: false
        always_run: true
      - id: preflight-hook-event-keys
        name: preflight hook event keys (scripts/preflight_hook_event_keys.py verify)
        entry: uv run python scripts/preflight_hook_event_keys.py verify
        language: system
        pass_filenames: false
        files: ^\.(claude/settings|codex/hooks|devin/hooks\.v1)\.json$
      - id: skill-quality-gate
        name: skill quality gate (waza check spec-compliance)
        entry: bash -c 'scripts/install_waza.sh >&2 && uv run python scripts/skill_quality_gate.py verify "$@"' --
        language: system
        files: ^\.agents/skills/.*/SKILL\.md$
        # Run once over all matched files instead of in parallel batches: the
        # entry provisions the shared waza binary via scripts/install_waza.sh,
        # and parallel copies otherwise race + redundantly download it (#1150).
        require_serial: true

      - id: preflight-branch-base
        name: preflight branch base (scripts/preflight_branch_base.py verify)
        entry: uv run python scripts/preflight_branch_base.py verify
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
      - id: preflight-coverage
        name: preflight coverage (scripts/preflight_coverage.py)
        entry: uv run python scripts/preflight_coverage.py
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
