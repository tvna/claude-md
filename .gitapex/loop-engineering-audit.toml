# Loop-engineering achievement audit -- stored, re-auditable checklist.
#
# Purpose: record honestly how far this repository realizes the framework in
# "Loop Engineering - The Anthropic Playbook" (HuaShu, 2026). This file is the
# single source of truth; the human browses it and re-audits with:
#
#     uv run python scripts/audit_loop_engineering.py run
#
# The reporter re-derives present/absent for every ``machine_checkable`` item
# from the working tree and flags DRIFT when a recorded status no longer
# matches reality (e.g. once #2269 adds the token-cap policy, that item flips
# to present and this file must be updated). Judgment items are human-audited
# and print their recorded status plus an evidence pointer.
#
# Honesty policy: this is an audit, not a scorecard. Status is recorded as the
# repository actually is, including deliberately-declined loop features. No
# machine asserts "achieved" on a judgment item; a mechanical verdict on a
# subjective question would be false precision (the risk the repo declined for
# the skill LLM-judge in #1099).
#
# Status vocabulary:
#   present  -- the artifact/capability exists.
#   partial  -- exists but incompletely (deterministic-only, or gap tracked).
#   absent   -- not present (may be a real gap or a not-yet-built precondition).
#   declined -- intentionally not built (documented design stance).
#   guarded / unguarded -- for the four costs: whether a standing guard exists.
#
# Refs #2294 (this artifact), #2268 (gap-analysis umbrella).

[meta]
schema_version = 1
source = "Loop Engineering - The Anthropic Playbook (HuaShu, 2026)"
audit_umbrella = "#2268"
last_reviewed = "2026-07-04"

